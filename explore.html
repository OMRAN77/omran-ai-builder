<title id="pageTitle">🔍 استكشف — OM Ai</title>
<style>
  html,body{margin:0; padding:0; background:#0f1115; font-family:'Segoe UI',Tahoma,Arial,sans-serif; color:#eee; min-height:100%;}
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 20px; border-bottom:1px solid #262b36; flex-wrap:wrap;}
  header h1{font-size:18px; margin:0;}
  header a{color:#60a5fa; text-decoration:none; font-size:13px; font-weight:bold;}
  #grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; padding:20px;}
  .card{position:relative; background:#161922; border:1px solid #262b36; border-radius:12px; overflow:hidden; color:#eee; transition:transform .15s, border-color .15s; display:flex; flex-direction:column;}
  .card:hover{transform:translateY(-3px); border-color:#3b82f6;}
  .card a.cardLink{text-decoration:none; color:#eee; display:flex; flex-direction:column; flex:1;}
  .card .thumb{height:120px; background:linear-gradient(135deg,#1e293b,#0f172a); display:flex; align-items:center; justify-content:center; font-size:34px;}
  .card .body{padding:10px 12px;}
  .card .title{font-size:14px; font-weight:bold; margin:0 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .meta{font-size:11px; color:#9aa3b2;}
  .card .delBtn{position:absolute; top:6px; left:6px; background:rgba(0,0,0,.55); border:1px solid #ef4444; color:#f87171; border-radius:8px; width:28px; height:28px; font-size:14px; cursor:pointer; z-index:2;}
  .card .delBtn:hover{background:#ef4444; color:#fff;}
  #empty{padding:60px 20px; text-align:center; color:#9aa3b2; font-size:14px;}
</style>

  /* v-share-pages-i18n: اللغات السبع الناقصة (كانت ترجع للعربيّ) — الجدول باللغات الـ١٤ */

  fil: { pageTitle:'🔍 Explore — OM Ai', title:'🔍 Tuklasin ang mga proyektong gawa ng mga user', back:'← Bumalik sa OM Ai', empty:'Wala pang pampublikong proyekto. Maging una sa pagbabahagi ng sa iyo! 🚀', loadErr:'Hindi na-load ang mga proyekto, subukan muli mamaya.', untitled:'Proyektong walang pamagat', by:'Ni', guest:'Bisita', delTitle:'Burahin ang proyekto', confirmDel:'Permanenteng burahin ang proyektong ito mula sa Explore?', delFail:'Hindi nabura ang proyekto: ', unknownErr:'Hindi kilalang error', delFailRetry:'Hindi nabura ang proyekto, subukan muli mamaya.', dateLocale:'fil-PH' },
  id: { pageTitle:'🔍 Jelajahi — OM Ai', title:'🔍 Jelajahi proyek buatan pengguna', back:'← Kembali ke OM Ai', empty:'Belum ada proyek publik. Jadilah yang pertama membagikan proyekmu! 🚀', loadErr:'Gagal memuat proyek, coba lagi nanti.', untitled:'Proyek tanpa judul', by:'Oleh', guest:'Tamu', delTitle:'Hapus proyek', confirmDel:'Hapus proyek ini dari Jelajahi secara permanen?', delFail:'Gagal menghapus proyek: ', unknownErr:'Kesalahan tidak diketahui', delFailRetry:'Gagal menghapus proyek, coba lagi nanti.', dateLocale:'id-ID' },

  ru: { pageTitle:'🔍 Обзор — OM Ai', title:'🔍 Проекты, созданные пользователями', back:'← Вернуться в OM Ai', empty:'Пока нет публичных проектов. Станьте первым, кто поделится своим! 🚀', loadErr:'Не удалось загрузить проекты, попробуйте позже.', untitled:'Проект без названия', by:'Автор:', guest:'Гость', delTitle:'Удалить проект', confirmDel:'Удалить этот проект из обзора навсегда?', delFail:'Не удалось удалить проект: ', unknownErr:'Неизвестная ошибка', delFailRetry:'Не удалось удалить проект, попробуйте позже.', dateLocale:'ru-RU' },

  zh: { pageTitle:'🔍 探索 — OM Ai', title:'🔍 探索用户创建的项目', back:'← 返回 OM Ai', empty:'还没有公开项目。快来第一个分享你的项目吧！🚀', loadErr:'项目加载失败，请稍后再试。', untitled:'未命名项目', by:'作者：', guest:'访客', delTitle:'删除项目', confirmDel:'要从探索中永久删除此项目吗？', delFail:'删除项目失败：', unknownErr:'未知错误', delFailRetry:'删除项目失败，请稍后再试。', dateLocale:'zh-CN' },
};
const lang = localStorage.getItem('aiapp_lang') || 'ar';
const S = EXPLORE_STR[lang] || EXPLORE_STR.ar;
if(lang === 'ar' || lang === 'ur'){ document.documentElement.dir = 'rtl'; document.documentElement.lang = lang; }
else { document.documentElement.dir = 'ltr'; document.documentElement.lang = lang; }
document.getElementById('pageTitle').textContent = S.pageTitle;
document.getElementById('hTitle').textContent = S.title;
document.getElementById('hBack').textContent = S.back;
document.getElementById('empty').textContent = S.empty;

function authGetLocal(key){ return sessionStorage.getItem(key) || localStorage.getItem(key); }
const myUsername = authGetLocal('aiapp_username');
const myToken = authGetLocal('aiapp_auth_token');

function deleteProject(id, cardEl){
  if(!confirm(S.confirmDel)) return;
  fetch('/api/share?id=' + encodeURIComponent(id), {
    method: 'DELETE',
    headers: { Authorization: 'Bearer ' + (myToken || '') },
  })
    .then(r => r.json())
    .then(data => {
      if(data && data.ok){
        cardEl.remove();
        const grid = document.getElementById('grid');
        if(!grid.children.length) document.getElementById('empty').style.display = 'block';
      } else {
        alert(S.delFail + (data && data.error ? data.error : S.unknownErr));
      }
    })
    .catch(() => alert(S.delFailRetry));
}

function getTitleCache(){
  try { return JSON.parse(localStorage.getItem('explore_title_cache') || '{}'); }
  catch(e){ return {}; }
}
function saveTitleCache(cache){
  try { localStorage.setItem('explore_title_cache', JSON.stringify(cache)); }
  catch(e){}
}
function translateTitles(items, targetLang){
  const cache = getTitleCache();
  const cacheKey = (id) => id + '_' + targetLang;
  const needIds = items.filter(p => p.title && !cache[cacheKey(p.id)]).map(p => p.id);
  if(!needIds.length) return Promise.resolve(cache);
  const needTexts = items.filter(p => needIds.includes(p.id)).map(p => p.title);
  return fetch('/api/translate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ texts: needTexts, targetLang }),
  })
    .then(r => r.json())
    .then(data => {
      const translations = (data && data.translations) || [];
      needIds.forEach((id, i) => {
        if(translations[i]) cache[cacheKey(id)] = translations[i];
      });
      saveTitleCache(cache);
      return cache;
    })
    .catch(() => cache);
}

fetch('/api/share?explore=1')
  .then(r => r.json())
  .then(data => {
    const items = data.items || [];
    const grid = document.getElementById('grid');
    if(!items.length){
      document.getElementById('empty').style.display = 'block';
      return;
    }
    translateTitles(items, lang).then(cache => {
      items.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        const d = new Date(p.createdAt || Date.now());
        const isMine = myUsername && p.username === myUsername;
        const displayTitle = (p.title && cache[p.id + '_' + lang]) || p.title || S.untitled;
        // v-explore-xss: العنوان والاسم يكتبهما الناشر (والعنوان المترجَم ناتج نموذج) — نصّ لا HTML، وإلّا نفّذ سكربتًا على نطاق التطبيق.
        const el = (tag, cls, text) => { const n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; };
        const link = el('a', 'cardLink');
        link.href = '/p.html?id=' + encodeURIComponent(p.id);
        const body = el('div', 'body');
        body.appendChild(el('div', 'title', displayTitle));
        body.appendChild(el('div', 'meta', S.by + ' ' + ((p.username && p.username !== 'زائر') ? p.username : S.guest) + ' — ' + d.toLocaleDateString(S.dateLocale)));
        link.appendChild(el('div', 'thumb', '🧩'));
        link.appendChild(body);
        card.appendChild(link);
        if(isMine){
          const del = el('button', 'delBtn', '🗑️');
          del.type = 'button';
          del.title = S.delTitle;
          del.addEventListener('click', (e) => {
            e.preventDefault();
            deleteProject(p.id, card);
          });
          card.appendChild(del);
        }
        grid.appendChild(card);
      });
    });
  })
  .catch(() => {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent = S.loadErr;
  });
</script>
</body>
</html>
