<script>
/* مرسى نور — مدينة مرفأ حرّة التجوّل، ملفّ واحد (v-marsa-noor، المالك ٩ أكتوبر: «أبدأ لكن لا تحذف أي شي»).
   لا خدمات خارجيّة ولا صور ولا أصوات: كلّ القوام من <canvas> وكلّ الصوت من WebAudio؛ المحرّك ثلاثيّ الأبعاد وحده من الشبكة.
   اللغة من ?lang= (بطاقة الإلهام تمرّرها)، وإلّا لغة الوثيقة ثمّ العربيّة. */
(function () {
  var q = /[?&]lang=([a-z]{2})/.exec(location.search), l = q ? q[1] : (document.documentElement.lang || 'ar');
  var ar = l !== 'en';
  document.documentElement.lang = ar ? 'ar' : 'en';
  document.documentElement.dir = ar ? 'rtl' : 'ltr';
  if (matchMedia('(pointer: coarse)').matches) document.documentElement.classList.add('coarse');
  document.documentElement.classList.add('pre'); // قبل «ابدأ»: اللوحة مخفيّة خلف المقدّمة
  /* لو فشل تحميل المحرّك من الشبكة (فشل الاستيراد الثابت لا يصل إلى الوحدة) أو انكسر الإقلاع: شاشة خطأ بدل صفحة بيضاء. */
  window.__marsaErr = function () {
    var e = document.getElementById('err'); if (!e || window.__marsaReady) return;
    document.getElementById('errT').textContent = ar ? 'تعذّر تحميل المحرّك' : 'Engine failed to load';
    document.getElementById('errS').textContent = ar ? 'تحقّق من الاتصال ثمّ أعد التحميل.' : 'Check your connection and reload.';
    e.classList.add('on');
  };
  addEventListener('error', function () { if (!window.__marsaReady) window.__marsaErr(); });
  /* نصوص المقدّمة قبل وصول الوحدة (أو إن لم تصل): لا تبقى الأزرار فارغة */
  document.addEventListener('DOMContentLoaded', function () { var set = function (id, v) { var e = document.getElementById(id); if (e && !e.textContent) e.textContent = v; }; set('introT', ar ? 'مرسى نور' : 'Marsa Noor'); set('introS', ar ? 'مدينة المرفأ — تجوّل حرّ' : 'Harbor city — free roam'); set('start', ar ? 'ابدأ القيادة' : 'Start driving'); set('introLoad', ar ? 'يُحمَّل المحرّك…' : 'Loading the engine…'); });
  setTimeout(function () { if (!window.__marsaReady) window.__marsaErr(); }, 25000);
})();
</script>

<style>

  <div id="topCenter">
    <div id="banner" class="panel"><div class="name" id="jobName"></div><div class="tgt" id="jobTgt"></div><div class="row"><span id="jobDist" class="num"></span><span class="timer num" id="jobTime"></span><span id="jobExtra" class="num"></span></div><div class="hint" id="jobHint"></div></div>

const TOGGLES = { KeyC: () => { camMode = camMode === 'chase' ? 'hood' : camMode === 'hood' ? 'top' : 'chase'; S.settings.cam = camMode; saveSoon(); }, KeyM: () => mapOpen ? closeBigMap() : openBigMap(), KeyQ: cycleRadio, KeyH: () => { hornT = 0.5; sfx.horn(); }, KeyE: () => V.onFoot ? enterCar() : leaveCar(), KeyG: () => garageOpen ? closeDrawers() : openGarage(), KeyR: recover, KeyJ: () => jobsOpen ? closeDrawers() : openJobs(), KeyT: toggleTime, Slash: () => { S.settings.hintsSeen = !S.settings.hintsSeen; hintsT = 0; } };

/* ===== ٢١. الحلقة الرئيسيّة ===== */
let tnow = 0, frame = 0, acc = 0, lastT = 0, fpsAcc = 0, fpsN = 0, fpsT = 0, tier = 0, started = false; V.recoverT = 0;
const DT = 1 / 120;

  const paused = garageOpen || mapOpen; if (paused && job && dt > 0) job.started += dt; V.recoverT = Math.max(0, V.recoverT - dt); hornT = Math.max(0, hornT - dt);
  if (!paused && dt > 0) {
    acc += dt; let n = 0; while (acc >= DT && n < 4) { if (V.onFoot) stepChar(DT); else { offRoad = !isRoad(V.x, V.z) && !onSidewalk(V.x, V.z); stepCar(DT); } acc -= DT; n++; } if (n === 4) acc = 0;
    stepTraffic(dt, tnow); stepPeds(dt); stepTram(dt); stepLights(tnow); stepJob(dt); stepArrow(); updateSmoke(dt); updateHarbor(tnow, dt);
    sfx.engine(V.rpm, V.gas, V.nitroOn, clamp(Math.abs(V.vLong) / carStats().MAXV, 0, 1)); sfx.skid(V.isDrifting || (V.hb && Math.abs(V.vLong) > 5) ? clamp((Math.abs(V.vLat) - 3) / 8, 0.05, 1) * 0.25 : 0);
    if (V.nitroOn && !V.nitroWas) sfx.nitroWhoosh(); V.nitroWas = V.nitroOn;
    if (garageRing && !V.onFoot) { const dg = Math.hypot(V.x - garageRing.x, V.z - garageRing.z); if (dg > 8) V.garageArmed = true; if (V.garageArmed !== false && !garageOpen && !jobsOpen && !mapOpen && dg < 6 && Math.abs(V.vLong) < 3 && tnow - (V.garageT || 0) > 3) { V.garageT = tnow; V.garageArmed = false; openGarage(); } }
  }
  if (timeK !== (timeMode === 'dusk' ? 1 : 0)) { timeK += (timeMode === 'dusk' ? 1 : -1) * dt / 2; timeK = clamp(timeK, 0, 1); applyTime(); }
  syncCarMesh(dt); updateCamera(dt);
  const px = V.onFoot ? charState.x : V.x, pz = V.onFoot ? charState.z : V.z; const tex = 170 / SHADOW; const off = timeMix.off || TIMES.afternoon.sunOff;
  sun.position.set(Math.round((px + off[0]) / tex) * tex, off[1], Math.round((pz + off[2]) / tex) * tex); sun.target.position.set(Math.round(px / tex) * tex, 0, Math.round(pz / tex) * tex); sun.target.updateMatrixWorld();

  renderer.render(scene, camera); updateHUD(dt);

  if (dt > 0) { fpsAcc += dt; fpsN++; if (fpsAcc >= 3) { const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; if (fps < 45 && tier < 4 && !LOCK) { tier++; if (tier <= 2 && DPR > 0.75) { DPR = Math.max(0.75, DPR - 0.25); renderer.setPixelRatio(DPR); } else if (tier === 3 && SHADOW > 1024) { SHADOW = 1024; sun.shadow.mapSize.set(1024, 1024); sun.shadow.map && sun.shadow.map.dispose(); sun.shadow.map = null; } else if (tier === 4) { renderer.shadowMap.enabled = false; shadowsOn = false; } document.documentElement.classList.add('low'); } if (DEBUG) $('dbg').textContent = `fps ${fps.toFixed(0)}  calls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles / 1000).toFixed(0)}k  pos ${V.x.toFixed(0)},${V.z.toFixed(0)}  tier ${tier} dpr ${DPR}  bld ${nBuildings}`; } }
}

  charMesh = buildChar(P.ink, true); charMesh.visible = false; scene.add(charMesh);
  selectCar(S.carsOwned.includes(S.selected) ? S.selected : 'kestrel'); V.hp = S.health[carDef.id] != null ? S.health[carDef.id] : carStats().HP; if (V.hp <= 0) { V.hp = 20; S.health[carDef.id] = 20; }
  applyTime(); setMode(); updateStars(); renderJobs(); updateHUD(0);
  $('introLoad').textContent = ''; if (S.raceBest) $('introSt').innerHTML = fmtCash(S.cash) + ' · ' + t('best') + ' <span class="num">' + fmtTime(S.raceBest) + '</span>'; else if (S.cash !== 800) $('introSt').textContent = fmtCash(S.cash);
  const go = () => { if (started) return; started = true; sfx.init(); sfx.resume(); $('intro').classList.add('gone'); document.documentElement.classList.remove('pre'); setTimeout(() => { $('intro').style.display = 'none'; }, 600); $('c').focus(); setTimeout(() => toast(t(COARSE ? 'driveTouch' : 'drive')), 300); setTimeout(() => toast(t(COARSE ? 'jobsHintTouch' : 'jobsHint')), 6000); };
  $('start').onclick = go; addEventListener('keydown', go, { once: true }); $('c').addEventListener('pointerdown', go, { once: true });
  if (DEBUG) { $('dbg').style.display = 'block'; window.__marsa = { V, S, keys, scene, renderer, camera, car, startJob, JOBS, traffic, peds, leaveCar, enterCar, go, get job() { return job; }, nBuildings, toggleTime, sfx, TOGGLES, openJobs, openGarage, closeDrawers, openBigMap, closeBigMap, cancelJob, charState, get camMode() { return camMode; }, set camMode(v) { camMode = v; },
    snapCam() { camInit = false; },
    setTimeNow(mode) { timeMode = mode; timeK = mode === 'dusk' ? 1 : 0; applyTime(); },
    // محاكاة بلا رسم (الفحص بلا GPU بطيء جدًّا): ثوانٍ من الفيزياء والزحمة والمهام
    sim(sec) { for (let i = 0, n = Math.round(sec / DT); i < n; i++) { tnow += DT; if (V.onFoot) stepChar(DT); else { offRoad = !isRoad(V.x, V.z) && !onSidewalk(V.x, V.z); stepCar(DT); } stepTraffic(DT, tnow); stepPeds(DT); stepJob(DT); } }, resolvePoint, get tnow() { return tnow; } }; }
  renderer.setAnimationLoop(loop);
}
