<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مدينتك الحقيقيّة</title>
<!-- v-real3d (المالك ٩ أكتوبر: «ثلاثيّة الأبعاد لعب أطفال، السيّارات والمباني»): صفحة إثبات — المدينة مصوَّرة
     ثلاثيّة الأبعاد كما هي (Photorealistic 3D Tiles) بدل صناديق الخرائط المفتوحة. المفتاح من /api/system?action=maps-key،
     مقيَّد في Google بـMap Tiles API وبنطاقات الموقع. المشهد يملأ الشاشة، والتحكّم شريط صغير لا يغطّيه. -->
<style>
html,body{margin:0;height:100%;background:#0b0f17;color:#eef;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#bar{position:fixed;top:12px;inset-inline-start:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 24px);z-index:2}
#bar button{border:1px solid rgba(255,255,255,.18);background:rgba(10,14,22,.62);color:#fff;border-radius:999px;padding:7px 13px;font:600 13px inherit;font-family:inherit;cursor:pointer;backdrop-filter:blur(6px)}
#bar button.on{background:#f2a33a;color:#1a1206;border-color:#f2a33a}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;line-height:1.7;pointer-events:none;z-index:1}
#msg:empty{display:none}
#credit{position:fixed;bottom:6px;inset-inline-end:8px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;opacity:.9;z-index:2;direction:ltr;max-width:70vw;text-align:right}
#diag{position:fixed;top:56px;left:8px;max-width:min(560px,calc(100vw - 16px));max-height:60vh;overflow:auto;background:rgba(0,0,0,.78);color:#cfe;font:11px/1.5 ui-monospace,monospace;padding:8px 10px;border-radius:8px;z-index:3;direction:ltr;white-space:pre-wrap;display:none}
#hint{position:fixed;bottom:6px;inset-inline-start:8px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;opacity:.75;z-index:2}
</style>
<script type="importmap">{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
"3d-tiles-renderer/":"https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.2/build/"
}}</script>
</head><body>
<div id="bar"></div><div id="msg"></div><div id="credit"></div><div id="hint"></div><div id="diag"></div>
<script>
/* ?debug=1: شريط تشخيص على الشاشة — أوّل الأخطاء والتحذيرات وعدّادات البلاطات والصور، فلقطة واحدة تكفي بلا أدوات المطوّر. */
window.__diag = { on: /[?&]debug=1/.test(location.search), log: [] };
(function () {
  if (!window.__diag.on) return;
  const push = (k, a) => { const t = k + ': ' + Array.prototype.map.call(a, (x) => (x && x.message) || String(x)).join(' ').slice(0, 240); if (window.__diag.log.length < 12 && window.__diag.log.indexOf(t) < 0) window.__diag.log.push(t); };
  ['error', 'warn'].forEach((k) => { const o = console[k]; console[k] = function () { push(k, arguments); return o.apply(console, arguments); }; });
  addEventListener('error', (e) => push('onerror', [e.message || (e.target && e.target.src) || 'resource']), true);
  addEventListener('unhandledrejection', (e) => push('reject', [e.reason]));
  addEventListener('securitypolicyviolation', (e) => push('csp', [e.violatedDirective + ' ' + e.blockedURI]));
})();
</script>
<script type="module">
import * as THREE from 'three';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { TilesRenderer, EnvironmentControls } from '3d-tiles-renderer/index.three.js';
import { GoogleCloudAuthPlugin } from '3d-tiles-renderer/index.core-plugins.js';
import { GLTFExtensionsPlugin, ReorientationPlugin, TilesFadePlugin } from '3d-tiles-renderer/index.three-plugins.js';

const AR = /^ar/i.test(document.documentElement.lang || navigator.language || 'ar');
const T = (a, e) => (AR ? a : e);
document.documentElement.lang = AR ? 'ar' : 'en'; document.documentElement.dir = AR ? 'rtl' : 'ltr';
// كلّ مكان: نقطة الهدف، وارتفاع الكاميرا وبعدها عن الهدف بالأمتار، واتّجاهها (درجات من الشمال).
const PLACES = [
  { ar: 'دبي — المارينا', en: 'Dubai Marina', lat: 25.0790, lon: 55.1390, h: 380, d: 900, az: 210 },
  { ar: 'دبي — برج خليفة', en: 'Downtown Dubai', lat: 25.1972, lon: 55.2744, h: 520, d: 1300, az: 230 },
  { ar: 'أبوظبي — الكورنيش', en: 'Abu Dhabi Corniche', lat: 24.4700, lon: 54.3400, h: 300, d: 900, az: 160 },
  { ar: 'الرياض — العليا', en: 'Riyadh — Olaya', lat: 24.7113, lon: 46.6744, h: 350, d: 1000, az: 200 },
  { ar: 'الدوحة — الخليج الغربي', en: 'Doha West Bay', lat: 25.3220, lon: 51.5310, h: 320, d: 950, az: 250 },
];
const $ = (id) => document.getElementById(id);
const say = (t) => { $('msg').textContent = t || ''; };
$('hint').textContent = T('اسحب للدوران · العجلة أو إصبعين للتقريب', 'Drag to orbit · wheel or pinch to zoom');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x9fc3e6);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 1));
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 1e6);
const controls = new EnvironmentControls(scene, camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 30; controls.maxAltitude = Math.PI / 2 - 0.05;
const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/gltf/');

let key = '', tiles = null;
function place(i) {
  const p = PLACES[i];
  [...$('bar').children].forEach((b, j) => b.classList.toggle('on', j === i));
  if (tiles) { scene.remove(tiles.group); tiles.dispose(); }
  tiles = new TilesRenderer();
  tiles.registerPlugin(new GoogleCloudAuthPlugin({ apiToken: key, autoRefreshToken: true }));
  tiles.registerPlugin(new GLTFExtensionsPlugin({ dracoLoader: draco }));
  tiles.registerPlugin(new TilesFadePlugin());
  // المكان المختار يصير أصل المشهد ومحور Y عموديًّا عليه — فالكاميرا تُوضع بالأمتار مباشرة.
  tiles.registerPlugin(new ReorientationPlugin({ lat: p.lat * THREE.MathUtils.DEG2RAD, lon: p.lon * THREE.MathUtils.DEG2RAD, recenter: true }));
  tiles.setCamera(camera); tiles.setResolutionFromRenderer(camera, renderer);
  tiles.addEventListener('load-error', (e) => {
    const s = String((e && (e.error && e.error.message)) || '');
    if (/40[013]/.test(s)) say(T('المفتاح مرفوض من الخرائط — تأكّد من قيود المفتاح (النطاق وMap Tiles API).', 'The maps key was refused — check its restrictions.'));
  });
  scene.add(tiles.group);
  const a = p.az * THREE.MathUtils.DEG2RAD;
  // ReorientationPlugin: الشمال +Z والغرب +X (فالشرق −X).
  camera.position.set(-Math.sin(a) * p.d, p.h, Math.cos(a) * p.d);
  camera.lookAt(0, 40, 0);
  say(T('يحمّل المدينة…', 'Loading the city…'));
}

PLACES.forEach((p, i) => { const b = document.createElement('button'); b.textContent = T(p.ar, p.en); b.onclick = () => place(i); $('bar').appendChild(b); });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (tiles) tiles.setResolutionFromRenderer(camera, renderer);
});

let lastCredit = '', lastDiag = 0;
function diag() {
  const d = window.__diag; if (!d || !d.on || !tiles) return;
  const now = performance.now(); if (now - lastDiag < 1000) return; lastDiag = now;
  let meshes = 0, maps = 0; tiles.group.traverse((o) => { if (o.isMesh) { meshes++; if (o.material && o.material.map) maps++; } });
  const st = tiles.stats || {};
  const el = $('diag'); el.style.display = 'block';
  el.textContent = 'meshes ' + meshes + ' · with texture ' + maps + ' · gpu textures ' + renderer.info.memory.textures
    + '\ndownloading ' + (st.downloading || 0) + ' · parsing ' + (st.parsing || 0) + ' · visible ' + (st.visible || 0) + ' · failed ' + (st.failed || 0)
    + '\ncam y ' + camera.position.y.toFixed(0) + ' · ' + navigator.userAgent.replace(/^.*?\) /, '').slice(0, 80)
    + (d.log.length ? '\n— ' + d.log.join('\n— ') : '\n(no errors)');
}
renderer.setAnimationLoop(() => {
  controls.update();
  camera.updateMatrixWorld();
  if (tiles) {
    tiles.update();
    if (tiles.stats && (tiles.stats.visible || 0) > 0 && $('msg').textContent === T('يحمّل المدينة…', 'Loading the city…')) say('');
    const c = (tiles.getAttributions() || []).filter((x) => x.type === 'string').map((x) => x.value).join(' · ');
    const txt = 'Google' + (c ? ' · ' + c : '');
    if (txt !== lastCredit) { lastCredit = txt; $('credit').textContent = txt; }
  }
  renderer.render(scene, camera);
  diag();
});

(async () => {
  say(T('يحمّل المدينة…', 'Loading the city…'));
  try {
    const r = await fetch('/api/system?action=maps-key', { cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    key = j.key || '';
  } catch (e) { console.warn('maps-key', e); }
  if (!key) { say(T('مفتاح الخرائط غير مضبوط على الخادم بعد.', 'The maps key is not set on the server yet.')); return; }
  const q = new URLSearchParams(location.search);
  const i = Math.max(0, Math.min(PLACES.length - 1, parseInt(q.get('p') || '0', 10) || 0));
  place(i);
})();
</script>
</body></html>
