    { ar: 'الدوحة — الخليج الغربيّ', en: 'Doha West Bay', lat: 25.3215, lon: 51.5280 },
    { ar: 'أبوظبي — الكورنيش', en: 'Abu Dhabi Corniche', lat: 24.4760, lon: 54.3550 },
    { ar: 'المنامة', en: 'Manama', lat: 26.2350, lon: 50.5770 },
    { ar: 'جدّة — الكورنيش', en: 'Jeddah Corniche', lat: 21.5430, lon: 39.1730 },

  // ── البيانات ──
  function timed(url, init, ms) {

  }
  CK.geocode = async function (q) {

      const r = await timed('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=' + (AR ? 'ar' : 'en') + '&q=' + encodeURIComponent(q), {}, 12000);

      if (j && j[0]) return { lat: +j[0].lat, lon: +j[0].lon, name: j[0].display_name || q };

  };
  CK.query = function (lat, lon, r) {

  };
  CK.fetchArea = async function (lat, lon, r) {

  function heightOf(tags, id) {
    const h = parseFloat(String(tags.height || '').replace(',', '.'));

    if (lv > 0 && lv < 250) return lv * 3.2 + 1;

  CK.parse = function (osm, lat0, lon0) {

      const t = Math.min(1, b.h / 180); cA.copy(t < 0.25 ? cLow : cMid).lerp(t < 0.25 ? cMid : cHigh, t < 0.25 ? t / 0.25 : (t - 0.25) / 0.75);
      let area = 0; for (let i = 0; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; area += p[0] * q[1] - q[0] * p[1]; }
      const ccw = area > 0;
      for (let i = 0; i < n; i++) {

  }

  // ── الواجهة ──
  const CSS = `
  .ck-ui{position:fixed;top:12px;right:12px;left:auto;z-index:5;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;

  CK.ui = function (title, sub) {

    async function load(lat, lon, name) {

        const hl = v.len / mx * Hh, hs = v.sun / mx * Hh;
        h += '<rect x="' + x + '" y="' + (Hh - hl + 2) + '" width="14" height="' + hl + '" rx="3" fill="#2b4252"/>';
        h += '<rect x="' + x + '" y="' + (Hh - hs + 2) + '" width="14" height="' + hs + '" rx="3" fill="' + (m === m0 ? '#ffc94a' : '#d79a3a') + '"/>';
      } else h += '<rect x="' + x + '" y="' + (Hh - 6) + '" width="14" height="8" rx="3" fill="#22333f"/>';
      if (m === m0) h += '<rect x="' + (x - 2) + '" y="0.5" width="18" height="' + (Hh + 3) + '" rx="4" fill="none" stroke="#ffe3a3" stroke-width="1"/>';
      h += '<text x="' + (x + 7) + '" y="82" text-anchor="middle" font-size="9" fill="' + (m === m0 ? '#ffe3a3' : '#7f9aa1') + '">' + (m + 1) + '</text></g>';
    }
    el.snYear.innerHTML = h + '</svg>';
    const v = yr[m0], done = yr.filter(Boolean).length;
    el.snYearCap.innerHTML = done < 12 ? T('أحسب السنة… ', 'Computing the year… ') + done + '/12'
      : (AR ? MON_AR[m0] : MON_EN[m0]) + ': <b>' + v.sun.toFixed(1) + '</b> ' + T('من ', 'of ') + v.len.toFixed(1) + T(' ساعة · أشمس شهر: ', ' h · sunniest: ') + (AR ? MON_AR : MON_EN)[S.bestM] + ' (' + yr[S.bestM].sun.toFixed(1) + ')';
  }
  function startYear() { // 12 شهرًا على دفعات حتّى لا تتجمّد الصفحة
    const gen = ++S.yearGen, St = S, P = S.P; St.year = new Array(12).fill(null); St.bestM = 0;
    let m = 0;
    const step = () => {
      if (S !== St || St.yearGen !== gen) return;
      const doy = mdToDoy(m, 21), info = dayInfo(doy), r = sunHours(P, doy, info, 10);
      St.year[m] = { len: r1(info.len), sun: r1(r.hours) };
      if (St.year[m].sun > St.year[St.bestM].sun) St.bestM = m;
      m++; renderYear(); pub();
      if (m < 12) setTimeout(step, 0);
    };
    renderYear(); setTimeout(step, 0);
  }
  function pub(s) {
    if (!S || !S.P) return;
    s = s || sunAt(S.doy, S.t);
    const [m, d] = doyToMD(S.doy), i = S.info, r = S.res, P = S.P;
    window.__inspire_state = {
      id: 'sun', city: S.name, lat: +S.lat.toFixed(4), lon: +S.lon.toFixed(4), tz: S.tz,
      date: Y + '-' + pad(m + 1) + '-' + pad(d), doy: S.doy, time: fmt(S.t), minutes: S.t,
      picked: { x: r1(P.x), y: r1(P.y), z: r1(P.z), kind: P.kind, buildingH: r1(P.bh || 0) },
      sunrise: i.polar ? null : fmt(i.rise), sunset: i.polar ? null : fmt(i.set), sunriseMin: i.rise == null ? null : r1(i.rise), sunsetMin: i.set == null ? null : r1(i.set),
      dayLengthH: r1(i.len), directSunHours: r1(r.hours), shadeHours: r1(Math.max(0, i.len - r.hours)), samples: r.N, litSamples: r.lit, sunPct: i.len ? Math.round(100 * r.hours / i.len) : 0,
      solarNoon: fmt(i.noon), peakAltDeg: r1(i.peak / DEG), sunAltDeg: r1(s.alt / DEG), sunAzDeg: r1(((s.az / DEG) % 360 + 360) % 360),
      litNow: !!S.litNow, blockerH: S.blk ? r1(S.blk.b.h) : null, blockerDist: S.blk ? Math.round(S.blk.d) : null,
      year: S.year.map((v) => (v ? v.sun : null)), yearDaylight: S.year.map((v) => (v ? v.len : null)), yearDone: S.year.filter(Boolean).length,
      arcRadius: Math.round(S.RA), maxH: r1(S.maxH), playing: !!S.playing, flying: !!S.fly,
    };
  }

  // ── لكلّ مدينة ──
  function onCity(c, city) {
    ctx = c;
    if (S) { S.playing = false; clearGroup(S.gPick); clearGroup(S.gArc); } // تحرير مواد ونسيج المدينة السابقة
    const maxH = city.buildings.length ? city.buildings[0].h : 0; // مرتّبة تنازليًّا في النواة
    const now0 = { tz: Math.round(city.lon / 15) };
    S = { city, idx: city.idx, name: city.name, lat: city.lat, lon: city.lon, tz: now0.tz, maxH, Rd: c.R + 90, RA: Math.max(200, Math.min(380, maxH * 1.15)),
      doy: 1, t: 15 * 60 + 30, playing: false, dirtyDay: false, P: null, info: null, res: null, year: new Array(12).fill(null), yearGen: 0, bestM: 0, fly: null };
    const n = nowLocal(); S.doy = n.doy;
    setPlayBtn(false);
    el.snTz.textContent = '(UTC' + (S.tz >= 0 ? '+' : '−') + Math.abs(S.tz) + T(' تقريبًا)', ' approx.)');
    S.sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), skyMat); S.sky.renderOrder = -10; S.sky.frustumCulled = false; city.group.add(S.sky);
    S.gPick = new THREE.Group(); S.gArc = new THREE.Group(); city.group.add(S.gPick, S.gArc);
    syncInputs();
    // نقطة البداية: مركز الحيّ (سطح إن كان فيه مبنى)
    pickWorld(0, 0, true);
    const St = S;
    c.onFrame((dt, now) => {
      if (S !== St) return;
      S.sky.position.copy(c.camera.position);
      c.scene.fog.near = Math.max(c.R * 1.2, c.orbit.dist * 0.95); c.scene.fog.far = c.scene.fog.near + c.R * 2.6;
      if (S.dirtyDay) recomputeDay();
      const rdt = Math.min(0.5, (now - (S.lastNow || now)) / 1000); S.lastNow = now; // سرعة التشغيل لا تتبع عدد الإطارات
      if (S.playing) {
        const i = S.info; let t = S.t + rdt * 80;
        if (!i.up) t = t % 1440; else if (i.polar) t = t % 1440; else if (t > i.set + 30) t = Math.max(0, i.rise - 40);
        if (t > 1435) t = 0;
        S.t = t; applyTime();
      }
      if (S.fly) {
        const f = S.fly; if (!f.s) f.s = now; f.k = Math.min(1, (now - f.s) / 1300); /* بالزمن الحقيقيّ لا بعدد الإطارات */ const e = f.k < 0.5 ? 4 * f.k * f.k * f.k : 1 - Math.pow(-2 * f.k + 2, 3) / 2, o = c.orbit;
        o.target.lerpVectors(f.t0, f.t1, e); o.dist = f.d0 + (f.d1 - f.d0) * e; o.theta = f.th0 + (f.th1 - f.th0) * e; o.phi = f.ph0 + (f.ph1 - f.ph0) * e; o.apply();
        if (f.k >= 1) S.fly = null;
      }
      if (S.markRing) { const p = 1 + ((now / 1400) % 1) * 1.6; S.markRing.scale.set(p, p, 1); S.markRing.material.opacity = 0.95 * (1 - ((now / 1400) % 1)) + 0.1; }
      if (S.sunGlow) { const q = S.RA * (0.4 + 0.03 * Math.sin(now / 300)); S.sunGlow.scale.set(q, q, 1); }
    });
  }

  window.__sun = {
    tap, pick: (x, z, full) => pickWorld(x, z, !!full),
    setDate: (m, d) => setDoy(mdToDoy(m - 1, d)),
    setTime: (hm) => { const t = typeof hm === 'string' ? (+hm.split(':')[0]) * 60 + (+hm.split(':')[1]) : +hm; S.t = Math.max(0, Math.min(1435, t)); S.playing = false; setPlayBtn(false); applyTime(); },
    play: (on) => play(on !== false),
    check: (x, z, m, d, hm) => { // للاختبار: نفس الحساب لنقطة وتاريخ بلا تغيير المشهد
      const doy = mdToDoy(m - 1, d), info = dayInfo(doy), t = (+hm.split(':')[0]) * 60 + (+hm.split(':')[1]);
      const P = { x, y: (S.idx.heightAt(x, z) || 0) + 0.3, z }, s = sunAt(doy, t), bk = blocker(P, s);
      return { rise: fmt(info.rise), set: fmt(info.set), lenH: r1(info.len), hours: r1(sunHours(P, doy, info, 10).hours), alt: r1(s.alt / DEG), los: s.alt > H0 && clearTo(P, s), blocker: bk ? r1(bk.b.h) : null };
    },
  };

  CK.start({
    title: T('شمس بيتك ساعة بساعة', 'Your home\'s sun, hour by hour'),
    sub: T('المس سطحك أو أيّ نقطة، وحرّك التاريخ والساعة: الشمس والظلال حقيقيّة لمكانك.', 'Tap your roof or any spot, then move the date and hour: the sun and shadows are real for your place.'),
    shadows: true, panel, onCity,
  });
})();
</script></body></html>
