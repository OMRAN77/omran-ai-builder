    { ar: 'الدوحة — الخليج الغربيّ', en: 'Doha West Bay', lat: 25.3215, lon: 51.5280 },
    { ar: 'أبوظبي — الكورنيش', en: 'Abu Dhabi Corniche', lat: 24.4760, lon: 54.3550 },
    { ar: 'المنامة', en: 'Manama', lat: 26.2350, lon: 50.5770 },
    { ar: 'جدّة — الكورنيش', en: 'Jeddah Corniche', lat: 21.5430, lon: 39.1730 },

  // ── البيانات ──
  function timed(url, init, ms) {

      if (j && j[0]) return { lat: +j[0].lat, lon: +j[0].lon, name: j[0].display_name || q };

  };
  CK.query = function (lat, lon, r) {

  };
  CK.fetchArea = async function (lat, lon, r) {

  function heightOf(tags, id) {

    if (lv > 0 && lv < 250) return lv * 3.2 + 1;

      const t = Math.min(1, b.h / 180); cA.copy(t < 0.25 ? cLow : cMid).lerp(t < 0.25 ? cMid : cHigh, t < 0.25 ? t / 0.25 : (t - 0.25) / 0.75);
      let area = 0; for (let i = 0; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; area += p[0] * q[1] - q[0] * p[1]; }

  }

  // ── الواجهة ──
  const CSS = `
  .ck-ui{position:fixed;top:12px;right:12px;left:auto;z-index:5;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;

    async function load(lat, lon, name) {

      row(T('أقرب حاجب قدّامك', 'Nearest blocker ahead'), ahead && !ahead.open ? Math.round(ahead.d) + M : T('لا شيء', 'none')) +
      row(T('أقرب ماء يبان', 'Nearest visible water'), cur.wdirs ? Math.round(cur.nearW) + M : '—') +
      row(T('واجهتك تنفتح كاملة من', 'Facing fully open from'), clearF ? T('الطابق ', 'floor ') + clearF : T('فوق ٩٠', 'above 90')) +
      row(T('الماء يبان من', 'Water visible from'), waterF ? T('الطابق ', 'floor ') + waterF : (S.inWater.count ? T('ما يبان', 'never') : T('لا ماء قريب', 'no water nearby')));
    setModeVis();
    window.__inspire_state = {
      city: S.city.name, buildings: S.city.buildings.length, mode: S.mode,
      spot: { x: r1(S.spot.x), z: r1(S.spot.z) }, onExistingBuilding: !!S.spot.self,
      floor: f, floorElevM: r1(elevOf(f)), eyeHeightM: r1(cur.eye), dirs: DIRS, rangeM: RANGE,
      openDirs: cur.open, openPct: cur.openPct, losAgree: cur.agree,
      facingDeg: wrap(S.facing), facingName: dirName(S.facing), facingOpenPct: fs.pct,
      waterVisible: cur.wdirs > 0, waterDirs: cur.wdirs, waterInFacing: wFacing, nearestWaterM: Math.round(cur.nearW),
      blockers: cur.blockers.size, nearestBlockAheadM: ahead && !ahead.open ? Math.round(ahead.d) : null, nearestBlockAheadH: ahead && ahead.b ? Math.round(ahead.b.h) : null,
      facingClearFloor: clearF, waterFromFloor: waterF,
      nearestBlockByDir: cur.dirs.map((d) => d.open ? 0 : Math.round(d.d)),
      openPctByFloor: S.sw.total.slice(1).map((n) => Math.round(n / DIRS * 100))
    };
  }

  // ── الأفعال ──
  function pickAt(x, z, quiet) {
    if (!S.city) return false;
    if (Math.hypot(x, z) > ctx.R * 0.97) { ctx.ui.status(T('اختر نقطة داخل الحيّ المحمّل.', 'Pick a spot inside the loaded area.')); return false; }
    const self = S.city.idx.at(x, z);
    S.spot = { x, z, self };
    S.fp = footprint(S.spot);
    S.P = profile(S.spot); S.sw = sweep(S.P);
    computeFloor(); rebuildTower(); render();
    if (!quiet) { ctx.ui.status(T('اخترت الموقع — حرّك الطابق والواجهة وشوف الفرق.', 'Plot picked — move the floor and facing to compare.')); S.glide = frameTarget(x, z, ctx.orbit.theta); }
    return true;
  }
  function setFloor(f) {
    f = Math.max(1, Math.min(MAXF, Math.round(f))); if (!S.ready) { S.floor = f; return; }
    if (f === S.floor && S.cur && S.cur.f === f) return;
    S.floor = f; computeFloor(); rebuildTower(); render();
  }
  function setFacing(a) {
    a = wrap(Math.round(a / 5) * 5); if (!S.ready) { S.facing = a; return; }
    S.facing = a;
    if (S.mode === 'view') S.yawT = S.yaw + rel(a - S.yaw);
    render();
  }
  // مركز الإطار: على الحاسوب نزيح الهدف يمينًا (اللوحة يمين الشاشة)، وعلى الجوّال نقرّبه للكاميرا فيعلو الموقع فوق اللوحة السفليّة
  function frameTarget(x, z, th) {
    const mob = window.innerWidth <= 640, k = mob ? 130 : 150;
    return mob ? new THREE.Vector3(x + Math.sin(th) * k, 0, z + Math.cos(th) * k) : new THREE.Vector3(x + Math.cos(th) * k, 0, z - Math.sin(th) * k);
  }
  const fwd = (yaw, pitch) => new THREE.Vector3(Math.sin(yaw * DEG) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw * DEG) * Math.cos(pitch));
  function fly(toView) {
    const cam = ctx.camera, p0 = cam.position.clone(), dir = new THREE.Vector3(); cam.getWorldDirection(dir);
    const l0 = p0.clone().addScaledVector(dir, Math.max(80, p0.distanceTo(new THREE.Vector3(S.spot.x, 0, S.spot.z))));
    let p1, l1, fov1, lift; const fl = { toView };
    if (toView) {
      S.yaw = S.yawT = S.facing; S.pitch = S.pitchT = -0.2; S.camY = S.cur.eye;
      p1 = new THREE.Vector3(S.spot.x, S.cur.eye, S.spot.z); l1 = p1.clone().add(fwd(S.yaw, S.pitch).multiplyScalar(220));
      fov1 = 70; lift = Math.min(160, 0.15 * p0.distanceTo(p1)); ctx.orbit.enabled = false;
    } else {
      fl.th = -S.facing * DEG + 0.45; fl.ph = 0.66; fl.D = 900; fl.tg = frameTarget(S.spot.x, S.spot.z, fl.th);
      p1 = new THREE.Vector3(fl.tg.x + fl.D * Math.sin(fl.ph) * Math.sin(fl.th), fl.D * Math.cos(fl.ph), fl.tg.z + fl.D * Math.sin(fl.ph) * Math.cos(fl.th));
      l1 = fl.tg.clone(); fov1 = 50; lift = 60;
    }
    Object.assign(fl, { t: 0, dur: toView ? 2.6 : 2.0, p0, p1, l0, l1, f0: cam.fov, f1: fov1, lift });
    S.flight = fl; S.mode = 'flying'; setModeVis(); render();
  }
  const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const tmpL = new THREE.Vector3(), tmpP = new THREE.Vector3();
  function frame(dt, now) {
    if (!S.ready) return;
    const cam = ctx.camera;
    if (C.pin.visible) { const k = 1 + 0.12 * Math.sin(now * 0.005); C.pin.scale.set(k, k, k); C.pin.material.opacity = 0.65 + 0.3 * Math.sin(now * 0.005); }
    if (C.beacons.count) C.beacons.material.color.setHSL(0.57, 1, 0.6 + 0.12 * Math.sin(now * 0.006));
    const fl = S.flight;
    if (fl) {
      if (!fl.start) fl.start = now;
      fl.t = Math.min(1, (now - fl.start) / 1000 / fl.dur); const e = ease(fl.t); // بالزمن الحقيقيّ: تصل في موعدها حتّى على جهاز بطيء
      cam.position.lerpVectors(fl.p0, fl.p1, e); cam.position.y += fl.lift * Math.sin(Math.PI * e);
      tmpL.lerpVectors(fl.l0, fl.l1, Math.min(1, e * 1.15)); cam.lookAt(tmpL);
      cam.fov = fl.f0 + (fl.f1 - fl.f0) * e; cam.updateProjectionMatrix();
      if (fl.t >= 1) {
        S.flight = null;
        if (fl.toView) { S.mode = 'view'; }
        else { const o = ctx.orbit; o.target.copy(fl.tg); o.theta = fl.th; o.phi = fl.ph; o.dist = fl.D; o.apply(); o.enabled = true; S.mode = 'map'; }
        render();
      }
      return;
    }
    if (S.mode === 'view') {
      const k = Math.min(1, dt * 5);
      S.yaw += (S.yawT - S.yaw) * k; S.pitch += (S.pitchT - S.pitch) * k; S.camY += (S.cur.eye - S.camY) * Math.min(1, dt * 3);
      tmpP.set(S.spot.x, S.camY, S.spot.z); cam.position.copy(tmpP); cam.lookAt(tmpL.copy(tmpP).add(fwd(S.yaw, S.pitch)));
      if (Math.abs(S.yaw - S.stripYaw) > 0.4) { const el = $('vwStrip'); if (el) el.innerHTML = stripHtml(S.yaw); S.stripYaw = S.yaw; }
    } else if (S.mode === 'map' && S.glide) {
      const o = ctx.orbit, k = Math.min(1, dt * 4); o.target.lerp(S.glide, k); o.apply();
      if (o.target.distanceTo(S.glide) < 0.5) S.glide = null;
    }
  }

  ctx = CK.start({
    title: T('إطلالة الطابق قبل البناء', 'Floor view before it is built'),
    sub: T('اختر قطعة وطابقًا: نحسب كم من الأفق مفتوح، وهل يبان الماء، ووش يحجبك — من مباني حيّك الحقيقيّة.', 'Pick a plot and a floor: how much horizon is open, whether water is visible, and what blocks you — from your real buildings.'),
    shadows: true,
    panel(c) { ctx = c; THREE = c.THREE; buildPanel(c); },
    onCity(c, city) {
      ctx = c; THREE = c.THREE;
      S.ready = false; S.city = city; S.mode = 'map'; S.flight = null; S.glide = null; S.cur = null;
      c.orbit.enabled = true; c.camera.fov = 50; c.camera.updateProjectionMatrix();
      S.inWater = makeWater(city);
      makeObjects(city);
      // نقطة البداية: أقرب أرض فاضية إلى المركز
      let sx = 0, sz = 0;
      outer: for (let r = 0; r <= 120; r += 6) for (let a = 0; a < 360; a += 30) { const x = Math.sin(a * DEG) * r, z = -Math.cos(a * DEG) * r; if (!city.idx.at(x, z)) { sx = x; sz = z; break outer; } }
      pickAt(sx, sz, true);
      S.ready = true;
      setFacing(bestFacing());
      const o = c.orbit; o.theta = -S.facing * DEG + 0.45; o.target.copy(frameTarget(sx, sz, o.theta)); o.phi = 0.66; o.dist = 960; o.apply();
      c.onFrame(frame);
    }
  });
  window.__view = {
    pick: (x, z) => pickAt(x, z), tap: (cx, cy) => tapAt(cx, cy), floor: (f) => setFloor(f), facing: (a) => setFacing(a), best: () => setFacing(bestFacing()),
    fly: () => { if (S.mode !== 'view' && !S.flight) fly(true); }, back: () => { if (S.mode === 'view' && !S.flight) fly(false); },
    state: () => window.__inspire_state
  };
})();
</script></body></html>
