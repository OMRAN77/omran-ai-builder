<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اسمع الشقّة قبل التوقيع</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* CityKit — نواة «مدينتك الحقيقيّة» (v-inspire). تُلصق داخل كلّ تجربة فتبقى كلّ تجربة ملفّ HTML واحدًا مستقلًّا.
   البحث عن المكان (Nominatim ثمّ Photon) ← مباني وطرق وماء وحدائق من OpenStreetMap (Overpass بمرايا احتياطيّة) ←
   أمتار محلّيّة ← مشهد three.js (المباني دفعة واحدة) + خطّ رؤية سريع على شبكة + تحكّم بالكاميرا للفأرة واللمس.
   تحتاج THREE العامّ (three@0.160.0/build/three.min.js) قبلها. */
(function () {
  'use strict';
  const CK = {};
  // اللغة من وسم الصفحة (التطبيق يكتبه بلغة المستخدم عند الفتح)، ثمّ لغة المتصفّح: العربيّة لمن لغته عربيّة، والإنجليزيّة لغيره.
  const AR = /^ar/i.test(document.documentElement.lang || navigator.language || 'ar');

  CK.PRESETS = [
    { ar: 'دبي — المارينا', en: 'Dubai Marina', lat: 25.0805, lon: 55.1403 },
    { ar: 'الرياض — العليا', en: 'Riyadh Olaya', lat: 24.6990, lon: 46.6850 },
    { ar: 'الكويت — شرق', en: 'Kuwait Sharq', lat: 29.3780, lon: 47.9900 },
    { ar: 'الدوحة — الخليج الغربيّ', en: 'Doha West Bay', lat: 25.3215, lon: 51.5280 },
    { ar: 'أبوظبي — الكورنيش', en: 'Abu Dhabi Corniche', lat: 24.4760, lon: 54.3550 },
    { ar: 'المنامة', en: 'Manama', lat: 26.2350, lon: 50.5770 },
    { ar: 'جدّة — الكورنيش', en: 'Jeddah Corniche', lat: 21.5430, lon: 39.1730 },
    { ar: 'مسقط — القرم', en: 'Muscat Qurum', lat: 23.5880, lon: 58.4080 },
  ];
  CK.OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];

  // ── البيانات ──
  function timed(url, init, ms) {

  }
  CK.geocode = async function (q) {
    q = String(q || '').trim(); if (!q) throw new Error('empty');

      const r = await timed('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=' + (AR ? 'ar' : 'en') + '&q=' + encodeURIComponent(q), {}, 12000);
      const j = await r.json();
      if (j && j[0]) return { lat: +j[0].lat, lon: +j[0].lon, name: j[0].display_name || q };
    } catch (e) { /* المرآة التالية */ }

    const j2 = await r2.json();
    const f = j2 && j2.features && j2.features[0];
    if (!f) throw new Error('notfound');
    return { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], name: (f.properties && f.properties.name) || q };
  };
  CK.query = function (lat, lon, r) {
    const a = '(around:' + Math.round(r) + ',' + lat.toFixed(6) + ',' + lon.toFixed(6) + ')';
    return '[out:json][timeout:25];(way["building"]' + a + ';way["highway"]' + a + ';way["natural"="water"]' + a + ';way["water"]' + a + ';way["leisure"~"park|garden"]' + a + ';way["landuse"="grass"]' + a + ';);out geom;';
  };
  // كاش المناطق: التجربة تعمل داخل معاينة التطبيق بنفس الأصل، فـlocalStorage مشترك مع مشاريع المستخدم (aiapp_projects) —
  // منطقة واحدة قد تبلغ ١٫٥ مليون حرف فتملأ حصّته بعد ٢–٣ مناطق ويفشل حفظ التطبيق. لذلك: ذاكرة الصفحة + Cache API في مخزن
  // خاصّ (حصّة القرص لا حصّة localStorage) بآخر KEEP مناطق فقط، ومسح أيّ «ck1:» قديم من localStorage.
  const AREA_CACHE = 'ck-osm-1', KEEP = 6, MEM = new Map();
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.indexOf('ck1:') === 0) localStorage.removeItem(k); } } catch (e) { /* بلا تخزين */ }
  async function areaGet(key) {
    if (MEM.has(key)) return MEM.get(key);
    try { if (!window.caches) return null; const r = await (await caches.open(AREA_CACHE)).match(key); return r ? await r.json() : null; } catch (e) { return null; }
  }
  async function areaPut(key, j) {
    MEM.set(key, j); while (MEM.size > 3) MEM.delete(MEM.keys().next().value);

      if (!window.caches) return;

      await c.put(key, new Response(JSON.stringify(j), { headers: { 'Content-Type': 'application/json' } }));
      const ks = await c.keys(); for (let i = 0; i < ks.length - KEEP; i++) await c.delete(ks[i]);
    } catch (e) { /* بلا كاش: نكمل من الشبكة */ }
  }
  CK.fetchArea = async function (lat, lon, r) {
    const key = 'https://citykit.cache/' + lat.toFixed(4) + ',' + lon.toFixed(4) + ',' + Math.round(r);
    const hit = await areaGet(key); if (hit) return hit;
    let last = null;
    for (const url of CK.OVERPASS) {
      try {
        const res = await timed(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(CK.query(lat, lon, r)) }, 30000);

        const j = await res.json();
        await areaPut(key, j);

  const ROAD_W = { motorway: 16, trunk: 14, primary: 12, secondary: 10, tertiary: 8, residential: 6, unclassified: 6, living_street: 5, service: 4, pedestrian: 4, footway: 2.5, path: 2.5, cycleway: 2.5, steps: 2 };
  function heightOf(tags, id) {
    const h = parseFloat(String(tags.height || '').replace(',', '.'));
    if (h > 0 && h < 1000) return h;
    const lv = parseFloat(tags['building:levels']);
    if (lv > 0 && lv < 250) return lv * 3.2 + 1;
    const b = tags.building;
    const j = ((id * 2654435761) % 1000) / 1000; // ثابت لكلّ مبنى
    if (/house|detached|villa|bungalow|semidetached/.test(b)) return 6 + j * 3;
    if (/apartments|residential|dormitory/.test(b)) return 12 + j * 12;
    if (/commercial|office|hotel|retail/.test(b)) return 14 + j * 16;
    if (/industrial|warehouse|garage|shed/.test(b)) return 7 + j * 5;
    if (/mosque|church/.test(b)) return 12;

  CK.parse = function (osm, lat0, lon0) {
    const mx = Math.cos(lat0 * Math.PI / 180) * 111320, mz = 110540;
    const P = (g) => [(g.lon - lon0) * mx, -(g.lat - lat0) * mz];
    const out = { buildings: [], roads: [], water: [], parks: [], lat: lat0, lon: lon0 };
    for (const e of (osm && osm.elements) || []) {

      const t = e.tags || {};

      const closed = pts.length > 3 && Math.abs(pts[0][0] - pts[pts.length - 1][0]) < 0.01 && Math.abs(pts[0][1] - pts[pts.length - 1][1]) < 0.01;
      if (t.building && closed) {
        const poly = pts.slice(0, -1);
        let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
        for (const [x, z] of poly) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (z < z0) z0 = z; if (z > z1) z1 = z; }
        out.buildings.push({ id: e.id, poly, h: heightOf(t, e.id), kind: t.building, name: t.name || '', box: [x0, z0, x1, z1] });
      } else if (t.highway && ROAD_W[t.highway]) {
        out.roads.push({ id: e.id, pts, kind: t.highway, w: ROAD_W[t.highway], name: t.name || '' });
      } else if ((t.natural === 'water' || t.water) && closed) out.water.push(pts.slice(0, -1));
      else if ((t.leisure || t.landuse) && closed) out.parks.push(pts.slice(0, -1));
    }

  };

  // ── الهندسة والفهرس ──
  CK.inPoly = function (x, z, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], zi = poly[i][1], xj = poly[j][0], zj = poly[j][1];
      if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi) + xi)) c = !c;
    }
    return c;
  };
  CK.index = function (data, cell) {
    cell = cell || 24; const grid = new Map();
    const k = (i, j) => i + ',' + j;
    for (const b of data.buildings) {
      for (let i = Math.floor(b.box[0] / cell); i <= Math.floor(b.box[2] / cell); i++)
        for (let j = Math.floor(b.box[1] / cell); j <= Math.floor(b.box[3] / cell); j++) {
          const kk = k(i, j); if (!grid.has(kk)) grid.set(kk, []); grid.get(kk).push(b);
        }
    }
    const near = (x, z) => grid.get(k(Math.floor(x / cell), Math.floor(z / cell))) || [];
    const at = (x, z) => { for (const b of near(x, z)) if (x >= b.box[0] && x <= b.box[2] && z >= b.box[1] && z <= b.box[3] && CK.inPoly(x, z, b.poly)) return b; return null; };
    const heightAt = (x, z) => { const b = at(x, z); return b ? b.h : 0; };

    const los = (a, b, step) => {
      step = step || 3;
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, L = Math.hypot(dx, dz);
      const n = Math.max(1, Math.ceil(L / step));
      for (let s = 1; s < n; s++) {

        const hb = at(x, z); if (hb && hb.h > y) return false;
      }
      return true;
    };
    return { at, heightAt, los, near, cell };
  };

  function buildingGeometry(THREE, data) {
    const pos = [], nor = [], col = [];
    const cA = new THREE.Color(), cLow = new THREE.Color(0xd9cdb8), cMid = new THREE.Color(0xb9c4cc), cHigh = new THREE.Color(0x7fa6bd);
    for (const b of data.buildings) {
      const ring = b.poly; const n = ring.length; if (n < 3) continue;
      const t = Math.min(1, b.h / 180); cA.copy(t < 0.25 ? cLow : cMid).lerp(t < 0.25 ? cMid : cHigh, t < 0.25 ? t / 0.25 : (t - 0.25) / 0.75);
      let area = 0; for (let i = 0; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; area += p[0] * q[1] - q[0] * p[1]; }
      const ccw = area > 0;
      for (let i = 0; i < n; i++) {
        const p = ring[i], q = ring[(i + 1) % n];
        const ex = q[0] - p[0], ez = q[1] - p[1], L = Math.hypot(ex, ez) || 1;
        let nx = ez / L, nz = -ex / L; if (!ccw) { nx = -nx; nz = -nz; }
        const v = [[p[0], 0, p[1]], [q[0], 0, q[1]], [q[0], b.h, q[1]], [p[0], 0, p[1]], [q[0], b.h, q[1]], [p[0], b.h, p[1]]];
        const order = ccw ? [0, 2, 1, 3, 5, 4] : [0, 1, 2, 3, 4, 5];
        for (const o of order) { pos.push(v[o][0], v[o][1], v[o][2]); nor.push(nx, 0, nz); col.push(cA.r * 0.92, cA.g * 0.92, cA.b * 0.92); }
      }
      const tri = THREE.ShapeUtils.triangulateShape(ring.map((p) => new THREE.Vector2(p[0], p[1])), []);
      for (const f of tri) {
        const idx = ccw ? [f[0], f[2], f[1]] : [f[0], f[1], f[2]];
        for (const k of idx) { pos.push(ring[k][0], b.h, ring[k][1]); nor.push(0, 1, 0); col.push(cA.r, cA.g, cA.b); }
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeBoundingSphere();
    return g;
  }
  function ribbonGeometry(THREE, roads, y) {
    const pos = [];
    for (const r of roads) {
      const hw = r.w / 2;
      for (let i = 0; i < r.pts.length - 1; i++) {
        const p = r.pts[i], q = r.pts[i + 1];
        const dx = q[0] - p[0], dz = q[1] - p[1], L = Math.hypot(dx, dz) || 1, nx = -dz / L * hw, nz = dx / L * hw;
        pos.push(p[0] + nx, y, p[1] + nz, q[0] - nx, y, q[1] - nz, q[0] + nx, y, q[1] + nz,
          p[0] + nx, y, p[1] + nz, p[0] - nx, y, p[1] - nz, q[0] - nx, y, q[1] - nz);

    }
    return grp;
  }

  // ── تحكّم الكاميرا (بلا OrbitControls: البناء العامّ لـthree لا يحويه) ──
  CK.orbit = function (camera, dom, o) {
    const s = { target: new CK.THREE.Vector3(0, 0, 0), dist: 900, theta: 0.6, phi: 0.9, min: 30, max: 3000, enabled: true };
    Object.assign(s, o || {});

  // ── الواجهة ──
  const CSS = `
  .ck-ui{position:fixed;top:12px;right:12px;left:auto;z-index:5;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;
    background:rgba(12,22,28,.86);color:#e8f1f3;border:1px solid rgba(120,200,210,.25);border-radius:14px;padding:12px 14px;
    font:14px/1.6 "IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;direction:${AR ? 'rtl' : 'ltr'};backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .ck-ui h1{font-size:17px;margin:0 0 2px;font-weight:700}.ck-ui .sub{margin:0 0 8px;color:#a9c1c7;font-size:13px}
  .ck-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
  .ck-ui input,.ck-ui select{font:inherit;flex:1 1 140px;min-width:0;background:#0d1a20;color:#e8f1f3;border:1px solid #2b4650;border-radius:9px;padding:6px 9px}
  .ck-ui button{font:inherit;background:#1f8a93;color:#fff;border:0;border-radius:9px;padding:6px 12px;cursor:pointer}
  .ck-ui button.ghost{background:transparent;border:1px solid #2b4650;color:#cfe3e7}
  .ck-ui button:disabled{opacity:.5;cursor:default}
  .ck-ui label{display:block;font-size:13px;color:#a9c1c7;margin-top:6px}

  .ck-status{font-size:12.5px;color:#9fd8de;min-height:1.4em}

  .ck-stat b{color:#fff}
  .ck-toggle{position:fixed;top:12px;right:12px;z-index:6;display:none}
  @media (max-width:640px){.ck-ui{top:auto;bottom:10px;right:10px;left:10px;width:auto;max-height:46vh}}
  .ck-hud{position:fixed;left:12px;top:12px;z-index:4;font:600 15px/1.4 "IBM Plex Sans Arabic",Tahoma,sans-serif;color:#fff;text-shadow:0 1px 3px #000;direction:${AR ? 'rtl' : 'ltr'};pointer-events:none}
  `;
  CK.ui = function (title, sub) {
    const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
    const box = document.createElement('div'); box.className = 'ck-ui';
    box.innerHTML = '<h1></h1><p class="sub"></p><div class="ck-row"><input id="ckq" type="search"><button id="ckgo"></button></div>' +
      '<div class="ck-row"><select id="ckpre"></select><button class="ghost" id="ckme"></button></div><div class="ck-status" id="ckst"></div><div id="ckpanel"></div>';
    box.querySelector('h1').textContent = title; box.querySelector('.sub').textContent = sub || '';
    box.querySelector('#ckq').placeholder = T('اكتب اسم حيّك أو مدينتك', 'Type your neighbourhood or city');
    box.querySelector('#ckgo').textContent = T('ابنِ', 'Build');
    box.querySelector('#ckme').textContent = T('موقعي', 'My location');
    const sel = box.querySelector('#ckpre');
    sel.innerHTML = '<option value="">' + T('أو اختر مدينة…', 'or pick a city…') + '</option>' + CK.PRESETS.map((p, i) => '<option value="' + i + '">' + (AR ? p.ar : p.en) + '</option>').join('');

    const hud = document.createElement('div'); hud.className = 'ck-hud'; document.body.appendChild(hud);
    return { box, panel: box.querySelector('#ckpanel'), status: (s) => { box.querySelector('#ckst').textContent = s || ''; }, hud: (s) => { hud.innerHTML = s || ''; } };
  };
  CK.el = function (html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };

  // ── التشغيل ──
  CK.start = function (opt) {
    const THREE = window.THREE; CK.THREE = THREE;
    const R = opt.radius || 600;
    document.documentElement.dir = AR ? 'rtl' : 'ltr';
    document.body.style.cssText = 'margin:0;overflow:hidden;background:#0b1419';
    const ui = CK.ui(opt.title, opt.sub);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: !!opt.keepBuffer });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = !!opt.shadows; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

  }

  // ── الواجهة ──
  const ICON = {
    play: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',
    stop: '<svg width="16" height="16" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor"/></svg>',
    sun: '<svg width="15" height="15" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></g></svg>',
    moon: '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M10.5 1.8A6.5 6.5 0 1 0 14.2 11 5.3 5.3 0 0 1 10.5 1.8z" fill="currentColor"/></svg>',
    tap: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#7fd6dd" stroke-width="1.4"><circle cx="8" cy="8" r="2.4" fill="#7fd6dd"/><circle cx="8" cy="8" r="5.6"/></svg>',
  };
  function gaugeSvg() {
    const cx = 110, cy = 112, r = 80; let ticks = '';
    for (const v of [40, 50, 60, 70, 80]) {
      const a = Math.PI * (1 - (v - 30) / 55), x1 = cx + 92 * Math.cos(a), y1 = cy - 92 * Math.sin(a), x2 = cx + 99 * Math.cos(a), y2 = cy - 99 * Math.sin(a), tx = cx + 108 * Math.cos(a), ty = cy - 108 * Math.sin(a);
      ticks += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#5d7a82" stroke-width="1.5"/><text x="' + tx.toFixed(1) + '" y="' + (ty + 3).toFixed(1) + '" fill="#7f9aa1" font-size="9" text-anchor="middle">' + v + '</text>';
    }
    const arc = 'M' + (cx - r) + ',' + cy + ' A' + r + ',' + r + ' 0 0 1 ' + (cx + r) + ',' + cy;
    return '<svg viewBox="0 0 220 128"><defs><linearGradient id="nzgr" x1="0" x2="1"><stop offset="0" stop-color="#3fbf7f"/><stop offset=".36" stop-color="#96cd5a"/><stop offset=".5" stop-color="#f2c83c"/><stop offset=".65" stop-color="#f08232"/><stop offset=".8" stop-color="#e0453a"/><stop offset="1" stop-color="#aa285a"/></linearGradient></defs>' +
      '<path d="' + arc + '" stroke="url(#nzgr)" stroke-opacity=".28" stroke-width="13" fill="none" stroke-linecap="round"/>' +
      '<path id="nzArc" d="' + arc + '" stroke="#3fbf7f" stroke-width="13" fill="none" stroke-linecap="round" stroke-dasharray="0 999" style="transition:stroke-dasharray .5s,stroke .5s"/>' + ticks +
      '<circle id="nzNeedle" cx="30" cy="112" r="5.5" fill="#fff" stroke="#0b1419" stroke-width="2"/>' +
      '<text id="nzVal" x="110" y="100" fill="#fff" font-size="40" font-weight="800" text-anchor="middle" font-family="Tahoma,system-ui">--</text></svg>';
  }
  function buildPanel(ctx) {
    const el = CK.el('<div class="nz">' +
      '<div class="nz-hint">' + ICON.tap + '<span>' + T('انقر أيّ مبنى — أو جداره مباشرة — لتختار شقّتك، ثمّ حدّد الدور واسمع الشارع.', 'Tap any building — or its wall — to pick your flat, choose the floor and listen.') + '</span></div>' +
      '<div class="nz-gauge">' + gaugeSvg() + '<div class="nz-verdict"><span id="nzVer">—</span><span class="nz-est">' + T('تقدير', 'estimate') + '</span></div><div class="nz-sub" id="nzSub"></div></div>' +
      '<div class="nz-seg"><button id="nzDay" class="on">' + ICON.sun + T('نهارًا', 'Day') + '</button><button id="nzNight">' + ICON.moon + T('ليلًا', 'Night') + '</button></div>' +
      '<div class="nz-row"><button id="nzPlay" class="nz-play grow">' + ICON.play + '<span>' + T('اسمع الشقّة', 'Hear the flat') + '</span></button><button id="nzWin" class="ghost">' + T('النافذة مفتوحة', 'Window open') + '</button></div>' +
      '<div class="nz-h"><span>' + T('الدور', 'Floor') + '</span><span id="nzFl"></span></div>' +
      '<div class="nz-floor"><button id="nzDn" class="ghost" aria-label="-">−</button><input id="nzRange" type="range" min="0" max="10" step="1" value="0"><button id="nzUp" class="ghost" aria-label="+">+</button></div>' +
      '<div class="nz-in"><div>' + T('داخل الغرفة، النافذة مفتوحة', 'Indoors, window open') + '<b id="nzInO">—</b></div><div>' + T('داخل الغرفة، النافذة مغلقة', 'Indoors, window closed') + '<b id="nzInC">—</b></div></div>' +
      '<div class="nz-h"><span>' + T('أقوى مصادر الضجيج', 'Loudest sources') + '</span><span id="nzN"></span></div><div class="nz-src" id="nzSrc"></div>' +
      '<div class="nz-h"><span>' + T('الضجيج في كلّ دور', 'Noise by floor') + '</span></div><div class="nz-prof" id="nzProf"></div><div class="nz-q" id="nzQ"></div>' +
      '<label class="nz-chk"><input type="checkbox" id="nzHeat" checked> ' + T('خريطة ضجيج الشوارع (عند مستوى الرصيف)', 'Street noise map (pavement level)') + '</label>' +
      '<p class="nz-note">' + T('الرقم تقدير تقريبيّ من نوع الشارع والمسافة وحجب المباني فقط — ليس قياسًا. الزحمة والسرعة والمطبّات وعزل النوافذ تغيّره؛ قِس بنفسك قبل التوقيع.', 'An approximate estimate from street type, distance and building shielding only — not a measurement. Traffic, speed and glazing change it; measure on site before signing.') + '</p></div>');
    ctx.ui.panel.appendChild(el);
    const $ = (id) => el.querySelector('#' + id);
    Object.assign(UI, { range: $('nzRange'), play: $('nzPlay'), win: $('nzWin'), day: $('nzDay'), nightB: $('nzNight'), fl: $('nzFl'), src: $('nzSrc'), prof: $('nzProf'), profQ: $('nzQ'), heat: $('nzHeat'), arc: $('nzArc'), needle: $('nzNeedle'), val: $('nzVal'), ver: $('nzVer'), sub: $('nzSub'), inO: $('nzInO'), inC: $('nzInC'), nSrc: $('nzN') });
    UI.range.addEventListener('input', () => { G.wantFloor = +UI.range.value; });
    $('nzDn').addEventListener('click', () => S && S.pick && setFloor(S.pick.floor - 1));
    $('nzUp').addEventListener('click', () => S && S.pick && setFloor(S.pick.floor + 1));
    UI.play.addEventListener('click', () => { if (AU.on) audioStop(); else audioStart(); });
    UI.win.addEventListener('click', () => { G.closed = !G.closed; renderUI(); audioUpdate(); publish(); });
    UI.day.addEventListener('click', () => setNight(false));
    UI.nightB.addEventListener('click', () => setNight(true));
    UI.heat.addEventListener('change', () => { G.heat = UI.heat.checked; if (S && S.heat) S.heat.mesh.visible = G.heat; });
    UI.prof.addEventListener('click', (e) => { const g = e.target.closest('[data-f]'); if (g) setFloor(+g.getAttribute('data-f')); });
    UI.labels = document.body.appendChild(CK.el('<div class="nz-labels"></div>'));
  }
  function setNight(on) {
    G.night = !!on; applyLight();
    repaintHeat();
    if (S && S.res) { buildFx(); renderUI(); renderProfile(); publish(); audioUpdate(); }
  }
  function renderUI() {
    if (!UI.play) return;
    UI.play.classList.toggle('stop', AU.on);
    UI.play.innerHTML = (AU.on ? ICON.stop : ICON.play) + '<span>' + (AU.on ? T('أوقف الصوت', 'Stop sound') : T('اسمع الشقّة', 'Hear the flat')) + '</span>';
    UI.win.textContent = G.closed ? T('النافذة مغلقة', 'Window closed') : T('النافذة مفتوحة', 'Window open');
    UI.day.classList.toggle('on', !G.night); UI.nightB.classList.toggle('on', G.night);
    if (!S || !S.res || !S.pick) { C.ui.hud(''); return; }
    const p = S.pick, res = S.res, L = G.night ? res.db - NIGHT_DROP : res.db, Lr = Math.round(L), col = cssOf(L);
    const f = Math.max(0, Math.min(1, (L - 30) / 55));
    UI.arc.setAttribute('stroke-dasharray', (f * Math.PI * 80).toFixed(1) + ' 999'); UI.arc.setAttribute('stroke', col);
    const na = Math.PI * (1 - f); UI.needle.setAttribute('cx', (110 + 80 * Math.cos(na)).toFixed(1)); UI.needle.setAttribute('cy', (112 - 80 * Math.sin(na)).toFixed(1));
    UI.val.textContent = res.sources.length ? Lr : '—'; UI.ver.textContent = verdict(L, G.night); UI.ver.style.color = col;
    const side = p.b ? T('واجهة ', 'facade ') + compass(p.nx, p.nz) : (p.floor ? T('برج افتراضيّ هنا', 'imagined tower here') : T('على الرصيف', 'at street level'));
    UI.sub.textContent = 'dB(A) · ' + (G.night ? T('ليلًا', 'night') : T('نهارًا', 'day')) + ' · ' + side;
    UI.fl.textContent = T('الدور ', 'Floor ') + floorName(p.floor) + T(' من ', ' of ') + p.maxFloor + ' · ' + T('ارتفاع ', 'height ') + Math.round(res.y) + T(' م', ' m');
    UI.inO.textContent = Math.round(L - 10) + ' dB'; UI.inC.textContent = Math.round(L - 25) + ' dB';
    UI.nSrc.textContent = T('من ', 'of ') + S.seg.n + T(' مقطع شارع', ' street segments');
    UI.src.innerHTML = res.sources.length ? res.sources.map((s) => { const sl = G.night ? s.db - NIGHT_DROP : s.db; return '<div class="nz-s"><i style="background:' + cssOf(sl) + '"></i><span class="n">' + esc(s.name) + (s.blocked ? '<em>' + T('محجوب', 'shielded') + '</em>' : '') + '</span><span class="d">' + s.dist + T(' م', ' m') + ' · ' + s.share + '%</span><b>' + Math.round(sl) + ' dB</b></div>'; }).join('')
      : '<div class="nz-s"><i></i><span class="n">' + T('ما فيه شوارع سيّارات قريبة', 'No car streets nearby') + '</span></div>';
    const pct = (f * 100).toFixed(1);
    C.ui.hud('<div class="nz-hud"><div class="v" style="color:' + col + '">' + (res.sources.length ? Lr : '—') + '<small>dB(A)</small></div><div class="l">' + verdict(L, G.night) + ' · ' + (G.night ? T('ليلًا', 'night') : T('نهارًا', 'day')) + ' · ' + T('تقدير', 'estimate') + '</div><div class="f">' + T('الدور ', 'Floor ') + floorName(p.floor) + ' · ' + side + '</div><div class="bar"><span style="left:calc(' + pct + '% - 1px)"></span></div></div>');
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function publish() {
    const res = S && S.res, p = S && S.pick, pr = S && S.prof;
    let q = null; if (pr && pr.done) for (const r of pr.out) if (!q || r.db < q.db) q = r;
    window.__inspire_state = {
      dbDay: res ? r1(res.db) : null, dbNight: res ? r1(res.db - NIGHT_DROP) : null,
      topSources: res ? res.sources.map((s) => ({ name: s.name, kind: s.kind, db: s.db, dist: s.dist, blocked: s.blocked, share: s.share })) : [],
      floor: p ? p.floor : null, maxFloor: p ? p.maxFloor : null, buildingId: p && p.b ? p.b.id : null, buildingH: p && p.b ? r1(p.b.h) : null,
      receiver: p && res ? { x: r1(p.x), y: r1(res.y), z: r1(p.z) } : null, facade: p && p.b ? compass(p.nx, p.nz) : null,
      segments: S ? S.seg.n : 0, losChecks: res ? res.los : 0, calcMs: res ? Math.round(res.ms) : 0,
      profile: pr ? pr.out.slice() : [], profileDone: !!(pr && pr.done), quietestFloor: q ? q.floor : null,
      night: G.night, windowClosed: G.closed, playing: AU.on, audioGain: r1(AU.gain * 1000) / 1000, heatDone: !!(S && S.heat && S.heat.done), city: S ? S.city.name : '',
    };
  }

  // ── النقر لاختيار الشقّة (مع عتبة حركة حتّى لا يُحسب السحب نقرًا) ──
  function bindPick(ctx) {
    const dom = ctx.renderer.domElement, ray = new ctx.THREE.Raycaster(), ndc = new ctx.THREE.Vector2();
    let down = null;
    dom.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; fly = null; });
    dom.addEventListener('pointerup', (e) => {
      if (!down || e.pointerId !== down.id) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
      if (moved < 7 && dt < 700) tapAt(e.clientX, e.clientY);
    });
    function tapAt(cx, cy) {
      if (!S) return;
      const r = dom.getBoundingClientRect(); ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, ctx.camera);
      const hit = ray.intersectObjects([S.city.buildingsMesh, S.city.ground], false)[0]; if (!hit) return;
      const p = hit.point, idx = S.city.idx;
      if (hit.object === S.city.buildingsMesh && hit.face) {
        const n = hit.face.normal;
        if (Math.abs(n.y) > 0.5) { const b = idx.at(p.x, p.z); if (b) return pickBuilding(b, p.x, p.z); }
        else { const b = idx.at(p.x - n.x * 0.4, p.z - n.z * 0.4); if (b) return pickBuilding(b, p.x, p.z, Math.floor(Math.max(0, p.y - 0.3) / FLOOR_H), { x: n.x, z: n.z }); }
      }
      if (Math.hypot(p.x, p.z) > ctx.R * 1.02) { ctx.ui.status(T('هذا خارج المنطقة المحمّلة — اختر نقطة أقرب.', 'Outside the loaded area — pick a closer spot.')); return; }
      const b = idx.at(p.x, p.z); if (b) pickBuilding(b, p.x, p.z); else pickGround(p.x, p.z);
    }
    window.__noise_tap = tapAt;
  }
  // الجوّال: اللوحة تشغل أسفل الشاشة، فنرفع مركز المشهد إلى النصف العلويّ
  function viewOffset() {
    const W = window.innerWidth, H = window.innerHeight, cam = C.camera;
    if (W <= 640) cam.setViewOffset(W, H, 0, Math.round(H * 0.2), W, H); // الجوّال: اللوحة أسفل
    else if (W >= 900) cam.setViewOffset(W, H, Math.round(Math.min(380, W * 0.33) / 2), 0, W, H); // الحاسوب: اللوحة يمينًا
    else cam.clearViewOffset();
    cam.updateProjectionMatrix();
  }

  function autoPick(city) {
    let best = null, bd = Infinity;
    for (const b of city.buildings) { if (b.h < 9) continue; const cx = (b.box[0] + b.box[2]) / 2, cz = (b.box[1] + b.box[3]) / 2, d = cx * cx + cz * cz; if (d < bd) { bd = d; best = b; } }
    if (!best) for (const b of city.buildings) { const cx = (b.box[0] + b.box[2]) / 2, cz = (b.box[1] + b.box[3]) / 2, d = cx * cx + cz * cz; if (d < bd) { bd = d; best = b; } }
    if (!best) { pickGround(0, 0, 0); return; }
    const cx = (best.box[0] + best.box[2]) / 2, cz = (best.box[1] + best.box[3]) / 2, g = S.seg;
    let q = [cx, cz], qd = Infinity;
    for (let i = 0; i < g.n; i++) {
      const ex = g.bx[i] - g.ax[i], ez = g.bz[i] - g.az[i]; let t = ((cx - g.ax[i]) * ex + (cz - g.az[i]) * ez) / (ex * ex + ez * ez); t = Math.max(0, Math.min(1, t));
      const x = g.ax[i] + ex * t, z = g.az[i] + ez * t, d = (x - cx) ** 2 + (z - cz) ** 2; if (d < qd) { qd = d; q = [x, z]; }
    }
    pickBuilding(best, q[0], q[1], Math.round(maxFloorOf(best) * 0.45));
  }

  CK.start({
    title: T('اسمع الشقّة قبل التوقيع', 'Hear the flat before you sign'),
    sub: T('ضجيج الشوارع الحقيقيّة عند أيّ شقّة وأيّ دور في حيّك — بالأرقام وبالصوت.', 'Real street noise at any flat and floor in your area — in numbers and sound.'),
    shadows: true,
    panel(ctx) {
      C = ctx;
      UI.def = { bg: ctx.scene.background.getHex(), hemi: ctx.hemi.intensity, hemiC: ctx.hemi.color.getHex(), sun: ctx.sun.intensity };
      buildPanel(ctx); bindPick(ctx); viewOffset(); renderUI();
      window.addEventListener('resize', viewOffset);
      window.__noise = { pickAt, setFloor, setNight, play: audioStart, stop: audioStop, evaluate: (x, y, z) => evaluate(x, y, z, true), tap: (x, y) => window.__noise_tap(x, y), toggleWindow: () => UI.win.click() };
    },
    onCity(ctx, city) {
      C = ctx; audioStop(); fly = null;
      S = { city, seg: buildSegments(city), pick: null, res: null, fx: null, prof: null, heat: null };
      G.floor = null; UI.labels.innerHTML = '';
      applyLight(); startHeat();
      ctx.onFrame((dt, now) => {
        if (G.wantFloor != null) { const k = G.wantFloor; G.wantFloor = null; setFloor(k); }
        tickFly(now); tickFx(dt, now); tickProfile(); tickHeat();
      });
      autoPick(city);
    },
  });
})();
</script></body></html>
