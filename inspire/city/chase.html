<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مطاردة في شوارعك</title>

  // منطقة واحدة قد تبلغ ١٫٥ مليون حرف فتملأ حصّته بعد ٢–٣ مناطق ويفشل حفظ التطبيق. لذلك: ذاكرة الصفحة + Cache API في مخزن

  function drawMap() {
    const g = G, m = g.map, cv = D.map, c = g.car, x = D.mapCtx; if (!m || !cv.width) return;
    const W = cv.width, half = W / 2, pxm = half / 170, th = c.h - Math.PI, k = pxm / m.sc, dpr = W / (cv.clientWidth || W);
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, W, W);
    x.save(); x.beginPath(); x.arc(half, half, half, 0, Math.PI * 2); x.clip();
    x.fillStyle = '#1b2a31'; x.fillRect(0, 0, W, W);
    x.translate(half, half); x.rotate(th); x.scale(k, k); x.translate(-(c.x + m.E) * m.sc, -(c.z + m.E) * m.sc);
    x.drawImage(m.c, 0, 0);
    x.setTransform(1, 0, 0, 1, 0, 0);
    const cs = Math.cos(th), sn = Math.sin(th);
    const toS = (px, pz) => { const dx = (px - c.x) * pxm, dz = (pz - c.z) * pxm; return [half + dx * cs - dz * sn, half + dx * sn + dz * cs]; };
    const u = Math.max(1, dpr);
    for (let i = g.cps.length - 1; i >= g.passed; i--) {
      const cp = g.cps[i], act = i === g.passed && g.st !== 'done'; let [sx, sy] = toS(cp.x, cp.z);
      const dx = sx - half, dy = sy - half, L = Math.hypot(dx, dy), lim = half - 8 * u;
      if (L > lim) { if (!act) continue; sx = half + dx / L * lim; sy = half + dy / L * lim; }
      if (act) { x.strokeStyle = 'rgba(63,240,255,.55)'; x.lineWidth = 2 * u; x.setLineDash([4 * u, 4 * u]); x.beginPath(); x.moveTo(half, half); x.lineTo(sx, sy); x.stroke(); x.setLineDash([]); }
      x.beginPath(); x.arc(sx, sy, (act ? 6 : 4) * u, 0, Math.PI * 2);
      x.fillStyle = i === g.cps.length - 1 ? '#ffc93c' : act ? '#3ff0ff' : 'rgba(63,240,255,.45)'; x.fill();
      if (act) { x.lineWidth = 2 * u; x.strokeStyle = '#fff'; x.stroke(); }
    }
    x.fillStyle = '#ff5a2a'; x.strokeStyle = '#fff'; x.lineWidth = 1.5 * u;
    x.beginPath(); x.moveTo(half, half - 8 * u); x.lineTo(half - 5.5 * u, half + 6 * u); x.lineTo(half, half + 3 * u); x.lineTo(half + 5.5 * u, half + 6 * u); x.closePath(); x.fill(); x.stroke();
    x.restore();
  }

  function frame(cdt, now) {
    const g = G; if (!g || !g.car || g.city !== X.city) return;
    const dt = realDt(cdt, now), inp = input(); // الفيزياء والمؤقّت والعدّ التنازليّ بالزمن الحقيقيّ، بخطوات ١/٦٠ ث
    if (g.st === 'race') { let left = dt; while (left > 1e-6 && g.st === 'race') { const h = Math.min(HZ, left); step(h, inp, true); left -= h; } }
    else if (g.st === 'count') {
      g.count -= dt; const n = Math.ceil(g.count);
      if (n !== g.countShown && n > 0) { g.countShown = n; showCount(String(n)); }
      if (g.count <= 0) { g.st = 'race'; showCount(T('انطلق!', 'Go!')); sync(); }
    } else {
      if (g.st === 'intro') { g.intro.t += dt; if (g.intro.t >= 2.8) { g.st = 'ready'; sync(); } }
      for (let left = dt; left > 1e-6 && Math.abs(g.car.v) > 0.01; left -= HZ) step(Math.min(HZ, left), inp, false);
    }
    carMesh(inp, dt); camUpdate(dt); gates(now, dt); arrowUpd(now); sunFollow(); drawMap();
    g.glowT = (g.glowT || 0) + dt; g.carObj.glow.material.opacity = 0.45 + 0.12 * Math.sin(g.glowT * 3);
    g.hudT -= dt; if (g.hudT <= 0) { g.hudT = 1 / 12; hud(); }
    g.stT -= dt; if (g.stT <= 0) { g.stT = 0.25; sync(); }
    g.layT -= dt; if (g.layT <= 0) { g.layT = 0.5; placeHud(); }
  }

  function setupScene(ctx) { // غروب ذهبيّ: سماء متدرّجة وضباب دافئ وشمس منخفضة
    const THREE = ctx.THREE;
    ctx.scene.background = canvasTex(4, 256, (g) => {
      const gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, '#2f63a0'); gr.addColorStop(0.42, '#8fb9dc'); gr.addColorStop(0.7, '#f1d3ae'); gr.addColorStop(1, '#efbf90');
      g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
    });
    ctx.scene.fog = new THREE.Fog(0xe9d3b6, 180, 1250);
    ctx.sun.color.setHex(0xffe1bd); ctx.sun.intensity = 1.55;
    ctx.hemi.color.setHex(0xd2e4ff); ctx.hemi.groundColor.setHex(0x86705a); ctx.hemi.intensity = 0.8;
    ctx.sun.shadow.bias = -0.0004; ctx.sun.shadow.normalBias = 0.4;
    const sc = ctx.sun.shadow.camera; sc.near = 10; sc.far = 1600; sc.updateProjectionMatrix();
    TEX = {
      glow: radial('rgba(63,240,255,0.9)', 'rgba(63,240,255,0)'),
      blob: radial('rgba(0,0,0,0.85)', 'rgba(0,0,0,0)'),
      beam: canvasTex(64, 128, (g) => { const gr = g.createLinearGradient(0, 128, 0, 0); gr.addColorStop(0, 'rgba(255,240,200,0.9)'); gr.addColorStop(1, 'rgba(255,240,200,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(22, 128); g.lineTo(42, 128); g.lineTo(64, 0); g.lineTo(0, 0); g.closePath(); g.fill(); }),
    };
    camPos = new THREE.Vector3(); camLook = new THREE.Vector3(); tmpPos = new THREE.Vector3(); tmpLook = new THREE.Vector3();
  }

  function onCity(ctx, city) {
    X = ctx; const THREE = ctx.THREE;
    ctx.orbit.enabled = false;
    document.body.classList.add('cz-compact');
    const ae = document.activeElement; if (ae && ae.blur && /^(SELECT|INPUT)$/.test(ae.tagName)) ae.blur(); // الأسهم للقيادة لا لتغيير القائمة
    hideOverlays();
    if (G) for (const cp of G.cps) if (cp.obj) cp.obj.g.traverse((o) => { const m = o.material; if (m) { if (m.map) m.map.dispose(); m.dispose(); } }); // أرقام البوّابات وموادّها لا تتراكم مع كلّ مدينة (النواة تحرّر الهندسة فقط)
    lastNow = -1;
    const g = G = { city, idx: city.idx, st: 'none', t: 0, passed: 0, collisions: 0, cps: [], samples: [], car: null, best: 0, newRec: false, lastRun: null,
      shake: 0, hudT: 0, stT: 0, layT: 0, lim2: (R * 0.95) * (R * 0.95), routeLen: 0, camH: 0, orbA: 0, snap: true };
    g.raster = buildRaster(city);
    g.samples = sampleRoads(city);
    if (g.samples.length < 8) {
      ctx.ui.status(T('الشوارع هنا قليلة على السباق — جرّب مكانًا فيه طرق أكثر.', 'Too few streets here for a race — try a busier spot.'));
      ctx.ui.hud(''); g.car = null; sync(); return;
    }
    const course = pickCourse(g.samples);
    g.start = course.start; g.cps = course.cps; g.routeLen = course.len;
    city.group.add(dashMesh(THREE, city));
    g.lamps = lampMesh(THREE, city); city.group.add(g.lamps);
    g.carObj = makeCar(THREE); city.group.add(g.carObj.g);
    g.arrow = makeArrow(THREE); city.group.add(g.arrow);
    g.cps.forEach((cp, i) => { cp.obj = makeGate(THREE, cp, i, i === g.cps.length - 1); city.group.add(cp.obj.g); });
    g.map = buildMap(city);
    hudTemplate();
    reset();
    g.best = readBest();
    D.len.textContent = (g.routeLen / 1000).toFixed(1) + T(' كم', ' km');
    g.st = 'intro'; g.intro = { t: 0, from: ctx.camera.position.clone(), look: new THREE.Vector3(0, 0, 0) }; g.snap = false;
    ctx.ui.status(T('جاهز: ', 'Ready: ') + g.cps.length + T(' نقاط على شوارع حقيقيّة · ', ' checkpoints on real streets · ') + city.buildings.length + T(' مبنى حقيقيّ', ' real buildings'));
    ctx.onFrame(frame);
    hud(); sync(); placeHud();
  }

  // ── لوحة المفاتيح (مرّة واحدة) ──
  const KMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'hand' };
  function onKey(e, v) {
    const tg = e.target; if (tg && /^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName)) return;
    const k = KMAP[e.code] || KMAP[e.key];
    if (k) { KEYS[k] = v; e.preventDefault(); if (v && k === 'up') wake(); return; }
    if (v && !e.repeat && (e.code === 'KeyR' || e.key === 'r' || e.key === 'R')) beginCount(true);
    if (v && !e.repeat && (e.code === 'KeyC' || e.key === 'c' || e.key === 'C')) { camMode = (camMode + 1) % 2; if (G) G.snap = true; }
  }
  window.addEventListener('keydown', (e) => onKey(e, 1));
  window.addEventListener('keyup', (e) => onKey(e, 0));
  window.addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = 0; for (const k in TOUCH) TOUCH[k] = 0; });

  // ── واجهة اختبار: محاكاة حتميّة بخطوة ١/٦٠ ث على الفيزياء نفسها ──
  window.__chase = {
    go() { if (!G || !G.car) return null; reset(); G.st = 'race'; sync(); return window.__inspire_state; },
    restart() { beginCount(true); return window.__inspire_state; },
    place(x, z, h, v) { const c = G.car; c.x = x; c.z = z; c.h = h; c.v = v || 0; c.steer = 0; G.snap = true; sync(); return !blocked(x, z, h); },
    sim(sec, inp) {
      const g = G, p0 = g.passed, n = Math.round(sec / HZ); inp = Object.assign({ thr: 0, brk: 0, steer: 0 }, inp || {});
      for (let k = 0; k < n && g.st === 'race'; k++) { step(HZ, inp, true); if (g.passed !== p0) break; }
      sync(); return window.__inspire_state;
    },
    wall() { // أقرب جدار مبنى حقيقيّ عموديّ على طريق، مع موضع قبله بـ٩ م
      const g = G, ss = g.samples.slice().sort((a, b) => (a.x * a.x + a.z * a.z) - (b.x * b.x + b.z * b.z));
      for (const s of ss) for (const side of [1, -1]) {
        const h = s.a + side * Math.PI / 2, fx = Math.sin(h), fz = Math.cos(h);
        for (let k = 4; k <= 45; k++) {
          if (!g.idx.at(s.x + fx * k, s.z + fz * k)) continue;
          if (k >= 13) { const d = k - 9, x = s.x + fx * d, z = s.z + fz * d; if (!blocked(x, z, h)) return { x, z, h, wallAt: k - d }; }
          break;
        }
      }
      return null;
    },
    get cps() { return G ? G.cps.map((c) => ({ x: c.x, z: c.z, r: c.r, w: c.w, app: c.app.slice() })) : []; },
    cam(m) { camMode = m ? 1 : 0; if (G) G.snap = true; return camMode; },
    get start() { return G && G.start; },
  };

  const TITLE = T('مطاردة في شوارعك', 'Street Chase');
  document.title = TITLE; // وسم <title> عربيّ في المصدر؛ بالإنجليزيّة يتبع لغة الصفحة
  CK.start({
    title: TITLE,
    sub: T('سباق ستّ نقاط على شوارع حيّك الحقيقيّة — المباني جدران فعليّة، والزمن يُحسب.', 'A six-checkpoint race on your real streets — buildings are solid walls.'),
    radius: R, shadows: true,
    panel(ctx) { X = ctx; setupScene(ctx); buildUi(ctx); },
    onCity,
  });
})();
</script></body></html>
