</head><body><script>
(function () {
  'use strict';
  const THREE = window.THREE, T = CityKit.T;
  document.title = T('وين أشوف الألعاب الناريّة', 'Where to watch the fireworks');
  const EYE = 1.6, STEP = 15, LOS_STEP = 3, COMFORT = 60, SEP = 60, MAX_SAMPLES = 15000;
  const PAL = [[[1, .28, .34], [1, .82, .38]], [[.35, .7, 1], [1, 1, 1]], [[.72, .42, 1], [1, .45, .85]], [[.35, 1, .55], [1, .95, .6]],
    [[1, .6, .18], [1, .32, .18]], [[.25, .95, 1], [.65, .38, 1]], [[1, .9, .5], [1, 1, 1]]];
  const GOLD = [1, .72, .32], TRAIL = [1, .58, .24], WHITE = [1, 1, 1];
  const C_VIS = [.25, 1, .52], C_HID = [1, .16, .24], C_PEND = [.22, .3, .4];
  const ICON_EYE = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICON_UP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  const ICON_STAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3.5 3.5M15.5 15.5L19 19M19 5l-3.5 3.5M8.5 15.5L5 19"/></svg>';
  const ICON_PLAY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
  const ICON_PAUSE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  const M = T('م', 'm');
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const r1 = (v) => Math.round(v * 10) / 10;
  let S = null, CTX = null, alt = 60, showOn = true, gen = 0;
  const UI = {};

  // ── قوام ومواد تُنشأ مرّة واحدة ──
  function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
  function radial(stops) { return canvasTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); for (const [o, c] of stops) gr.addColorStop(o, c); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }); }
  let MAT = null;
  function mats() {
    if (MAT) return MAT;
    const sky = canvasTex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#02040c'); gr.addColorStop(0.42, '#08122b'); gr.addColorStop(0.74, '#171a3a'); gr.addColorStop(0.9, '#2e2445'); gr.addColorStop(1, '#45304a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
    sky.colorSpace = THREE.SRGBColorSpace;
    const dot = radial([[0, 'rgba(255,255,255,1)'], [0.22, 'rgba(255,255,255,.9)'], [0.55, 'rgba(255,255,255,.2)'], [1, 'rgba(255,255,255,0)']]);
    const glow = radial([[0, 'rgba(255,255,255,1)'], [0.12, 'rgba(255,255,255,.75)'], [0.4, 'rgba(255,255,255,.18)'], [1, 'rgba(255,255,255,0)']]);
    const moon = canvasTex(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 10, 64, 64, 64); gr.addColorStop(0, 'rgba(220,230,255,.5)'); gr.addColorStop(1, 'rgba(220,230,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); g.beginPath(); g.arc(64, 64, 17, 0, Math.PI * 2); g.fillStyle = '#f4f1e6'; g.fill(); g.beginPath(); g.arc(71, 59, 15, 0, Math.PI * 2); g.fillStyle = 'rgba(200,205,215,.35)'; g.fill(); });
    moon.colorSpace = THREE.SRGBColorSpace;
    const nums = [1, 2, 3].map((n) => { const t = canvasTex(128, 128, (g) => { g.beginPath(); g.arc(64, 64, 52, 0, Math.PI * 2); g.fillStyle = '#ffcf5a'; g.shadowColor = '#ffcf5a'; g.shadowBlur = 12; g.fill(); g.shadowBlur = 0; g.lineWidth = 7; g.strokeStyle = '#2a1a06'; g.stroke(); g.fillStyle = '#2a1a06'; g.font = 'bold 70px Tahoma, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), 64, 69); }); t.colorSpace = THREE.SRGBColorSpace; return t; });
    const add = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending };
    MAT = {
      sky, dot, glow, nums,
      spots: new THREE.PointsMaterial(Object.assign({ size: 21, map: dot, vertexColors: true, sizeAttenuation: true }, add)),
      stars: new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true, fog: false, transparent: true, depthWrite: false }),
      moon: new THREE.SpriteMaterial({ map: moon, fog: false, depthWrite: false, transparent: true }),
      ring: new THREE.MeshBasicMaterial(Object.assign({ color: 0x7fe9ff, opacity: 0.85, side: THREE.DoubleSide }, add)),
      pad: new THREE.MeshBasicMaterial(Object.assign({ color: 0xffcf5a, opacity: 0.9, side: THREE.DoubleSide }, add)),
      beacon: new THREE.SpriteMaterial(Object.assign({ map: glow, color: 0xffd27a, fog: false }, add)),
      sight: new THREE.LineDashedMaterial({ color: 0xffd36a, dashSize: 7, gapSize: 5, transparent: true, opacity: 0.8, depthWrite: false }),
      stem: new THREE.LineDashedMaterial({ color: 0xffe9b0, dashSize: 4, gapSize: 4, transparent: true, opacity: 0.6, depthWrite: false }),
      labels: nums.map((t) => new THREE.SpriteMaterial({ map: t, depthTest: false, depthWrite: false, sizeAttenuation: false, transparent: true, fog: false })),
      flash: [0, 1, 2, 3, 4, 5].map(() => new THREE.SpriteMaterial(Object.assign({ map: glow, color: 0xffffff, fog: false, opacity: 0 }, add))),
      pillar: new THREE.ShaderMaterial(Object.assign({
        uniforms: { uC: { value: new THREE.Color(0xffcf5a) } },
        vertexShader: 'varying float vH; void main(){ vH = position.y / 70.0 + 0.5; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: 'uniform vec3 uC; varying float vH; void main(){ gl_FragColor = vec4(uC, pow(1.0 - vH, 1.7) * 0.9); }',
        side: THREE.DoubleSide,
      }, add)),
      fw: new THREE.ShaderMaterial(Object.assign({
        uniforms: { uScale: { value: 800 } },
        vertexShader: 'attribute float aSize; attribute float aAlpha; attribute vec3 aCol; uniform float uScale; varying vec3 vC; varying float vA;' +
          'void main(){ vC = aCol; vA = aAlpha; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;' +
          ' float s = aSize * uScale / max(1.0, -mv.z); gl_PointSize = aAlpha <= 0.0 ? 0.0 : clamp(s, 1.6, 96.0); }',
        fragmentShader: 'varying vec3 vC; varying float vA; void main(){ float d = length(gl_PointCoord - 0.5) * 2.0; if (d > 1.0) discard;' +
          ' float a = pow(1.0 - d, 1.7); vec3 c = mix(vC, vec3(1.0), pow(max(0.0, 1.0 - d * 2.4), 2.0) * 0.75); gl_FragColor = vec4(c * 1.3, a * vA); }',
      }, add)),
    };
    return MAT;
  }

  // نوافذ مضاءة ليلًا: نحقن في مادّة المباني نمط نوافذ من إحداثيّات العالم (بلا UV ولا قوام)
  function windowShader(sh) {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;\nvarying vec3 vWN;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvWN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;\nvarying vec3 vWN;')
      .replace('#include <emissivemap_fragment>', [
        '#include <emissivemap_fragment>',
        '{ float side = 1.0 - smoothstep(0.3, 0.7, abs(vWN.y));',
        '  float u = dot(vWP.xz, normalize(vec2(-vWN.z, vWN.x) + 1e-5));',
        '  vec2 g = vec2(u / 3.6, (vWP.y - 1.0) / 3.3); vec2 f = fract(g); vec2 c = floor(g);',
        '  float w = step(0.2, f.x) * step(f.x, 0.8) * step(0.25, f.y) * step(f.y, 0.78);',
        '  float r = fract(sin(dot(c, vec2(12.9898, 78.233)) + floor(vWP.x * 0.04) * 7.31 + floor(vWP.z * 0.04) * 3.17) * 43758.5453);',
        '  vec3 wc = mix(vec3(1.0, 0.58, 0.24), vec3(1.0, 0.88, 0.66), fract(r * 7.13));',
        '  totalEmissiveRadiance += side * w * step(0.6, r) * step(1.0, vWP.y) * wc * 0.8; }',
      ].join('\n'));
  }

  function night(ctx, city) {
    const m = mats(), R = ctx.R;
    ctx.scene.background = m.sky;
    ctx.scene.fog.color.set(0x0c1228); ctx.scene.fog.near = R * 1.3; ctx.scene.fog.far = R * 4.2;
    ctx.hemi.color.set(0x6474b8); ctx.hemi.groundColor.set(0x2a2018); ctx.hemi.intensity = 0.6;
    ctx.sun.color.set(0xa4b6ff); ctx.sun.intensity = 0.5;
    const bm = city.buildingsMesh.material; bm.onBeforeCompile = windowShader; bm.needsUpdate = true;
    city.ground.material.color.set(0x34322f);
    city.roadsMesh.material.color.set(0x4a4f57); city.roadsMesh.material.emissive.set(0x2a1806);
  }

  function roadLabel(r) {
    if (r.name) return r.name;
    const k = r.kind || '';
    if (/foot|path|pedestrian|cycle|steps/.test(k)) return T('ممشى', 'Walkway');
    if (/motorway|trunk/.test(k)) return T('طريق سريع', 'Highway');
    if (/primary|secondary/.test(k)) return T('شارع رئيسيّ', 'Main street');
    return T('شارع فرعيّ', 'Side street');
  }

  // ── نقاط المشاهدة: كلّ ١٥م على كلّ طريق داخل المنطقة المحمّلة، خارج المباني ──
  // لا وقوف على الطرق السريعة والشريانيّة ولا على الوصلات (منحدرات ومخارج): تخرج من العيّنات فلا تُقترح ولا تدخل نسبة الرؤية
  const NO_STAND = /^(motorway|trunk)$/;
  function buildSamples(city, R) {
    const xs = [], zs = [], rs = [], lim2 = (R * 0.97) * (R * 0.97);
    for (const r of city.roads) {
      if (r.link || NO_STAND.test(r.kind)) continue;
      let next = STEP / 2;
      for (let i = 0; i < r.pts.length - 1; i++) {
        const p = r.pts[i], q = r.pts[i + 1], L = Math.hypot(q[0] - p[0], q[1] - p[1]);
        while (next <= L) {
          const t = next / L, x = p[0] + (q[0] - p[0]) * t, z = p[1] + (q[1] - p[1]) * t; next += STEP;
          if (x * x + z * z > lim2 || city.idx.at(x, z)) continue;
          xs.push(x); zs.push(z); rs.push(r);
        }
        next -= L;
      }
    }
    let keep = xs.map((_, i) => i);
    if (keep.length > MAX_SAMPLES) { const k = keep.length / MAX_SAMPLES; keep = Array.from({ length: MAX_SAMPLES }, (_, i) => Math.floor(i * k)); }
    const n = keep.length;
    S.n = n; S.sx = new Float32Array(n); S.sz = new Float32Array(n); S.sd = new Float32Array(n); S.vis = new Int8Array(n); S.sroad = new Array(n);
    keep.forEach((j, i) => { S.sx[i] = xs[j]; S.sz[i] = zs[j]; S.sroad[i] = rs[j]; });
    const pos = new Float32Array(n * 3); S.col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { pos[i * 3] = S.sx[i]; pos[i * 3 + 1] = 0.8; pos[i * 3 + 2] = S.sz[i]; }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    S.colAttr = new THREE.BufferAttribute(S.col, 3); g.setAttribute('color', S.colAttr);
    S.spots = new THREE.Points(g, MAT.spots); S.spots.renderOrder = 2; city.group.add(S.spots);
  }

  function makeSky(group, ctx) {
    const n = 1100, R = ctx.R * 3.2, p = new Float32Array(n * 3), c = new Float32Array(n * 3);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < n; i++) {
      const el = Math.asin(0.05 + 0.95 * Math.pow(rnd(), 0.8)), az = rnd() * Math.PI * 2, b = 0.25 + 0.75 * Math.pow(rnd(), 3);
      p[i * 3] = Math.cos(el) * Math.sin(az) * R; p[i * 3 + 1] = Math.sin(el) * R; p[i * 3 + 2] = Math.cos(el) * Math.cos(az) * R;
      c[i * 3] = b * (0.85 + 0.15 * rnd()); c[i * 3 + 1] = b * 0.92; c[i * 3 + 2] = b;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(c, 3));
    group.add(new THREE.Points(g, MAT.stars));
    const moon = new THREE.Sprite(MAT.moon); moon.position.set(-R * 0.5, R * 0.42, -R * 0.6); moon.scale.set(260, 260, 1); group.add(moon);
  }

  // ── الألعاب الناريّة: مخزن جسيمات واحد (Points) + صواريخ + ومضات تضيء المباني ──
  function makeFireworks(group) {
    const N = 9000;
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), sz = new Float32Array(N), al = new Float32Array(N);
    const vel = new Float32Array(N * 3), life = new Float32Array(N), max = new Float32Array(N), drg = new Float32Array(N), grv = new Float32Array(N), s0 = new Float32Array(N), kd = new Uint8Array(N), em = new Float32Array(N);
    const geo = new THREE.BufferGeometry();
    const attrs = [['position', pos, 3], ['aCol', col, 3], ['aSize', sz, 1], ['aAlpha', al, 1]].map(([k, a, s]) => { const b = new THREE.BufferAttribute(a, s); b.setUsage(THREE.DynamicDrawUsage); geo.setAttribute(k, b); return b; });
    const pts = new THREE.Points(geo, MAT.fw); pts.frustumCulled = false; pts.renderOrder = 6; group.add(pts);
    const light = new THREE.PointLight(0xffffff, 0, 0, 2); light.position.set(0, -500, 0); group.add(light);
    const flashes = MAT.flash.map((m) => { const s = new THREE.Sprite(m); s.visible = false; s.renderOrder = 7; group.add(s); return { s, t: 9 }; });
    let head = 0, fi = 0, lightT = 9, lightPeak = 0;
    const fw = { queue: [], rockets: [], bursts: 0, alive: 0, launched: 0 };
    function spawn(x, y, z, vx, vy, vz, c, size, lf, dr, gr, k) {
      const i = head; head = (head + 1) % N; const j = i * 3;
      pos[j] = x; pos[j + 1] = y; pos[j + 2] = z; vel[j] = vx; vel[j + 1] = vy; vel[j + 2] = vz;
      col[j] = c[0]; col[j + 1] = c[1]; col[j + 2] = c[2];
      s0[i] = size; sz[i] = size; life[i] = lf; max[i] = lf; drg[i] = dr; grv[i] = gr; kd[i] = k; em[i] = Math.random() * 0.07; al[i] = 1;
    }
    const U = [0, 0, 0];
    function unit(o) { const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u); o[0] = s * Math.cos(th); o[1] = u; o[2] = s * Math.sin(th); return o; }
    const jit = (a) => a * (0.93 + Math.random() * 0.14);
    function sphere(x, y, z, n, speed, colors, size, lf, dr, gr, k) {
      for (let i = 0; i < n; i++) { unit(U); const v = jit(speed); spawn(x, y, z, U[0] * v, U[1] * v, U[2] * v, colors[i % colors.length], size, lf * (0.85 + Math.random() * 0.3), dr, gr, k); }
    }
    fw.burst = function (x, y, z, type, pal) {
      const P = PAL[pal % PAL.length]; fw.bursts++;
      if (type === 'willow') sphere(x, y, z, 120, 90, [GOLD], 4, 3.4, 1.15, 9, 1);
      else if (type === 'ring') {
        const n = unit([0, 0, 0]); n[1] = Math.abs(n[1]) * 0.5 + 0.5;
        const a = new THREE.Vector3(n[0], n[1], n[2]).normalize(), u = new THREE.Vector3(1, 0, 0).cross(a).normalize(), v = a.clone().cross(u);
        for (let i = 0; i < 110; i++) { const t = i / 110 * Math.PI * 2, s = jit(125), c = Math.cos(t), d = Math.sin(t); spawn(x, y, z, (u.x * c + v.x * d) * s, (u.y * c + v.y * d) * s, (u.z * c + v.z * d) * s, P[0], 4.6, 2.1 + Math.random() * 0.4, 1.7, 6, 0); }
        sphere(x, y, z, 60, 50, [P[1]], 3.4, 1.6, 1.7, 6, 4);
      } else if (type === 'palm') {
        for (let i = 0; i < 9; i++) { unit(U); U[1] = Math.abs(U[1]) * 0.6 + 0.35; const l = Math.hypot(U[0], U[1], U[2]), v = jit(130) / l; spawn(x, y, z, U[0] * v, U[1] * v, U[2] * v, P[0], 7, 2.3, 1.25, 9, 1); }
        sphere(x, y, z, 70, 70, [WHITE, P[1]], 3, 1.5, 1.8, 6, 4);
      } else if (type === 'crackle') sphere(x, y, z, 180, 110, [WHITE, GOLD, P[0]], 3.3, 1.8, 1.8, 7, 4);

    if (!hit) return false;
    const p = hit.point.clone().addScaledVector(ray.ray.direction, 0.6);
    if (Math.hypot(p.x, p.z) > CTX.R * 0.92) { CTX.ui.status(T('اختر نقطة داخل الحيّ المحمّل.', 'Pick a point inside the loaded area.')); return false; }
    const b = S.city.idx.at(p.x, p.z);
    setShow(p.x, p.z, b ? b.h : 0, b && b.name ? b.name : T('نقطة اخترتها', 'Your chosen point'));
    S.tallest = S.city.buildings[0] || null;
    const v = airView(); const o = CTX.orbit; v.dist = o.dist; v.phi = o.phi; tweenOrbit(v, 1.2);
    return true;
  }

  CityKit.start({
    title: T('وين أوقف عشان أشوف الألعاب الناريّة؟', 'Where to stand for the fireworks?'),
    sub: T('نفحص من كلّ شارع في حيّك: تشوف الألعاب أو تحجبها المباني؟ انقر الخريطة لتنقل مكان العرض.', 'We test every street in your area: can you see the show, or do buildings block it? Tap the map to move it.'),
    radius: 600,
    panel(ctx) {
      CTX = ctx; mats();
      const p = ctx.ui.panel;
      p.innerHTML =
        '<div class="fw-legend"><span><i class="fw-dot fw-g"></i>' + T('تشوف العرض', 'Clear view') + '</span><span><i class="fw-dot fw-r"></i>' + T('محجوب بالمباني', 'Blocked') + '</span><span><i class="fw-dot fw-y"></i>' + T('أفضل ٣ مواقف', 'Top 3 spots') + '</span></div>' +
        '<div class="fw-prog"><i></i></div>' +
        '<div class="ck-stat"><span>' + T('نقاط مشاهدة على الشوارع', 'Street spots tested') + '</span><b data-k="n">—</b>' +
        '<span>' + T('تشوف العرض', 'With a clear view') + '</span><b data-k="v">—</b>' +
        '<span>' + T('مكان الإطلاق', 'Launch site') + '</span><b data-k="s">—</b>' +
        '<span>' + T('ارتفاع الانفجار', 'Burst height') + '</span><b data-k="h">—</b></div>' +
        '<label>' + T('ارتفاع الألعاب فوق السطح: ', 'Height above the roof: ') + '<b data-k="altv">60</b> ' + M + '</label>' +
        '<input type="range" min="20" max="250" step="10" value="60" data-k="alt">' +
        '<div class="ck-row fw-btns"><button data-k="toggle"></button><button class="gold" data-k="finale">' + ICON_STAR + T('الختام', 'Grand finale') + '</button><button class="ghost" data-k="tall">' + ICON_UP + T('فوق أعلى برج', 'Above tallest') + '</button></div>' +
        '<div class="fw-hint">' + T('انقر أيّ مكان على الخريطة لتنقل مكان الإطلاق.', 'Tap anywhere on the map to move the launch site.') + '</div>' +
        '<div class="fw-h">' + T('أفضل ٣ مواقف (تشوف وأقرب)', 'Best 3 spots (clear and closest)') + '</div><div data-k="best"></div>';
      const q = (k) => p.querySelector('[data-k="' + k + '"]');
      Object.assign(UI, { n: q('n'), v: q('v'), s: q('s'), h: q('h'), alt: q('alt'), altV: q('altv'), toggle: q('toggle'), best: q('best'), prog: p.querySelector('.fw-prog i') });
      UI.alt.addEventListener('input', () => { UI.altV.textContent = UI.alt.value; });
      UI.alt.addEventListener('change', () => setAlt(+UI.alt.value));
      UI.toggle.addEventListener('click', () => { showOn = !showOn; renderAll(); });
      q('finale').addEventListener('click', () => { if (S && S.fw) S.fw.finale(); });
      q('tall').addEventListener('click', () => { if (S && S.mode === 'air') { setShowDefault(); const v = airView(); v.dist = CTX.orbit.dist; v.phi = CTX.orbit.phi; tweenOrbit(v, 1.2); } });
      UI.best.addEventListener('click', (e) => { const b = e.target.closest('.fw-spot'); if (b && S) { if (S.mode === 'street' && S.pick === +b.dataset.i) return; flyTo(+b.dataset.i); } });
      UI.back = CityKit.el('<button class="fw-back" hidden>' + ICON_UP + T('ارجع للمنظر العلوي', 'Back to the aerial view') + '</button>');
      UI.back.addEventListener('click', () => S && back());
      document.body.appendChild(UI.back);
      // النقر لاختيار نقطة العرض (بعتبة حركة كي لا يلتقط السحب)، والسحب في الشارع يلفّ النظر
      const dom = ctx.renderer.domElement, active = new Map(); let down = null;
      dom.addEventListener('pointerdown', (e) => {
        active.set(e.pointerId, [e.clientX, e.clientY]);
        down = active.size === 1 ? { id: e.pointerId, x: e.clientX, y: e.clientY } : null;
        if (S) S.tween = null;
      });
      dom.addEventListener('pointermove', (e) => {
        const last = active.get(e.pointerId); if (!last) return;
        if (S && S.mode === 'street' && active.size === 1) { S.look.yaw -= (e.clientX - last[0]) * 0.004; S.look.pitch = Math.max(-0.9, Math.min(0.9, S.look.pitch + (e.clientY - last[1]) * 0.004)); }
        active.set(e.pointerId, [e.clientX, e.clientY]);
      });
      const up = (e) => {
        const ok = down && down.id === e.pointerId && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 7 && e.type === 'pointerup';
        active.delete(e.pointerId); if (ok) pickAt(e.clientX, e.clientY); down = null;
      };
      dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
      window.addEventListener('resize', viewOffset);
      viewOffset();
      // واجهة للاختبار الآليّ
      window.__fw = {
        wait: () => new Promise((res) => { const t = setInterval(() => { if (S && S.done && !S.flight) { clearInterval(t); pub(); res(window.__inspire_state); } }, 60); }),
        tap: (x, y) => pickAt(x, y), setShow: (x, z) => { const b = S.city.idx.at(x, z); setShow(x, z, b ? b.h : 0, T('نقطة اخترتها', 'Your chosen point')); },
        setAlt, fly: (i) => flyTo(i || 0), back: () => back(), finale: () => S.fw.finale(), tallest: () => setShowDefault(),
        losCheck: () => S.best.every((b) => S.city.idx.los({ x: b.x, y: EYE, z: b.z }, S.show, LOS_STEP)),
      };
    },
    onCity(ctx, city) {
      CTX = ctx; mats(); night(ctx, city);
      S = { city, gen: ++gen, mode: 'air', look: { yaw: 0, pitch: 0 }, flight: null, tween: null, done: false, best: [], pick: -1, markObjs: [], lastNow: performance.now(), next: 0.4, visCount: 0, ji: 0, pct: 0 };
      ctx.orbit.enabled = true; ctx.camera.fov = 50; viewOffset();
      makeSky(city.group, ctx);
      buildSamples(city, ctx.R);
      S.ring = new THREE.Mesh(new THREE.RingGeometry(0.975, 1, 160), MAT.ring); S.ring.rotation.x = -Math.PI / 2; S.ring.position.y = 1.2; city.group.add(S.ring);
      S.marks = new THREE.Group(); city.group.add(S.marks);
      S.beacon = new THREE.Group(); city.group.add(S.beacon);
      S.fw = makeFireworks(city.group);
      setShowDefault();
      ctx.onFrame(frame);
      tweenOrbit(airView(), 2.6);
      ctx.ui.status(T('جاهز: ', 'Ready: ') + fmt(city.buildings.length) + T(' مبنى · ', ' buildings · ') + fmt(S.n) + T(' نقطة مشاهدة على الشوارع', ' street spots'));
      pub();
    },
  });
})();
</script></body></html>
