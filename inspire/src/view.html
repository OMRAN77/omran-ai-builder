<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إطلالة الطابق قبل البناء</title>

<style>
.vw-p{margin-top:4px}
.vw-hint{font-size:12.5px;line-height:1.55;color:#bcd3d8;background:rgba(47,211,193,.08);border:1px solid rgba(47,211,193,.25);border-radius:10px;padding:6px 9px;margin:4px 0 8px}
.vw-fl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px}
.vw-fl .t{font-size:13px;color:#a9c1c7}
.vw-fl b{font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
.vw-fl small{color:#9fd8de;font-size:13px;font-variant-numeric:tabular-nums}
.ck-ui input.vw-range{width:100%;accent-color:#2fd3c1;padding:0;margin:4px 0 2px;border:0;background:transparent}
.vw-mid{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin:8px 0 4px}
.vw-rose{direction:ltr;display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:4px}

.vw-rose .c{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;line-height:1.15;color:#e8f1f3;text-align:center;direction:rtl}
.vw-rose .c b{font-size:12px;font-variant-numeric:tabular-nums}
.vw-acts{display:flex;flex-direction:column;gap:6px;min-width:0}
.ck-ui .vw-acts button{width:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.ck-ui .vw-acts button#vwFly{background:linear-gradient(135deg,#22a3a0,#1a6f9a);font-weight:700;padding:9px 12px}
.vw-plot{font-size:12px;color:#9fb8be}
.vw-chart{direction:ltr;margin-top:8px;background:#0c1a20;border:1px solid #23404a;border-radius:10px;padding:7px 8px 5px}

.vw-ax{display:flex;justify-content:space-between;font-size:10.5px;color:#7f9fa7;font-variant-numeric:tabular-nums}

.vw-top{display:flex;gap:14px;align-items:center}

.vw-big b{font-size:44px;line-height:1;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.vw-big b small{font-size:22px;color:#2fd3c1;margin-inline-start:2px}
.vw-big span{font-size:12px;color:#9fd8de;font-weight:600}
.vw-kv{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 10px}

.vw-kv .wt b{color:#7cc8ff}.vw-kv .wt.no b{color:#c9d6da}

.vw-strip .s.o{background:linear-gradient(#5ff0dc,#22a89a)}
.vw-strip .s.b{background:linear-gradient(#ff9a72,#c4513a)}

.vw-strip .tk{position:absolute;bottom:13px;width:1px;height:5px;background:#8fb0b7}
.vw-strip .ct{position:absolute;left:50%;top:0;bottom:13px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px #fff}
.vw-vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(4,10,14,.55) 100%);opacity:0;transition:opacity .8s}

  .ck-ui .sub{display:none}
  .vw-hud{width:calc(100vw - 24px);padding:8px 10px 6px}

  .vw-strip{height:42px}
  body.vw-in .ck-ui{max-height:31vh}
}
</style>
</head><body><script>
(function () {
  'use strict';
  const CK = window.CityKit, T = CK.T, AR = CK.AR;
  const TITLE = T('إطلالة الطابق قبل البناء', 'Floor view before it is built');
  document.title = TITLE;
  const DIRS = 72, RANGE = 500, STEP = 3, FLOOR_H = 3.2, EYE_UP = 1.6, MAXF = 90, SECTOR = 45;
  const DEG = Math.PI / 180;
  const AZ = Array.from({ length: DIRS }, (_, k) => k * 360 / DIRS);
  const PCT = AR ? '٪' : '%', M = AR ? ' م' : ' m';
  const NAMES = AR ? ['شمال', 'شمال شرق', 'شرق', 'جنوب شرق', 'جنوب', 'جنوب غرب', 'غرب', 'شمال غرب'] : ['North', 'North-east', 'East', 'South-east', 'South', 'South-west', 'West', 'North-west'];
  const wrap = (a) => ((a % 360) + 360) % 360;
  const rel = (a) => { const r = wrap(a); return r >= 180 ? r - 360 : r; };
  const elevOf = (f) => f * FLOOR_H;               // منسوب بلاطة الطابق (الأرضيّ = ٠)
  const eyeOf = (f) => f * FLOOR_H + EYE_UP;        // مستوى العين داخل الطابق
  const dirName = (az) => NAMES[Math.round(wrap(az) / 45) % 8];
  const inSector = (az, facing) => Math.abs(rel(az - facing)) <= SECTOR;
  const r1 = (v) => Math.round(v * 10) / 10;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let ctx = null, THREE = window.THREE;
  const S = { ready: false, floor: 20, facing: 0, mode: 'map' };
  const $ = (id) => document.getElementById(id);

  // ── مسح الأفق: ملفّ ارتفاعات لكلّ اتّجاه (مرّة لكلّ موقع) ثمّ تقييم أيّ طابق بلا استعلام جديد ──
  function makeWater(city) {
    const polys = (city.water || []).map((p) => {
      let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
      for (const [x, z] of p) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (z < z0) z0 = z; if (z > z1) z1 = z; }
      return { p, box: [x0, z0, x1, z1] };
    });
    const memo = new Map();
    const fn = (x, z) => {
      if (!polys.length) return false;
      const cx = Math.floor(x / 4), cz = Math.floor(z / 4), key = cx * 100003 + cz;
      let v = memo.get(key); if (v !== undefined) return v;
      const px = cx * 4 + 2, pz = cz * 4 + 2; v = false;
      for (const w of polys) if (px >= w.box[0] && px <= w.box[2] && pz >= w.box[1] && pz <= w.box[3] && CK.inPoly(px, pz, w.p)) { v = true; break; }
      memo.set(key, v); return v;
    };
    fn.count = polys.length;
    fn.at = (x, z) => polys.some((w) => x >= w.box[0] && x <= w.box[2] && z >= w.box[1] && z <= w.box[3] && CK.inPoly(x, z, w.p)); // دقيق (بلا شبكة ٤م) لاختيار الموقع
    return fn;
  }
  // العيّنات نفسها التي يمشي عليها city.idx.los (من حافّة قطعة الأرض إلى ٥٠٠م، خطوة ٣م) حتّى يتطابق الحكمان حرفيًّا.
  // xd: أين يخرج الشعاع من قرص البيانات المحمّلة (نصف القطر R حول المركز). ما بعده لا مباني محمّلة فيه —
  // فالاتّجاه الذي يخرج قبل ٥٠٠م دون أن يُحجب «غير معروف»، لا «مفتوح».
  function profile(spot) {
    const idx = S.city.idx, self = spot.self, P = [], R = ctx.R;
    for (let k = 0; k < DIRS; k++) {
      const ux = Math.sin(AZ[k] * DEG), uz = -Math.cos(AZ[k] * DEG);
      const pb = spot.x * ux + spot.z * uz, xd = -pb + Math.sqrt(Math.max(0, pb * pb - (spot.x * spot.x + spot.z * spot.z - R * R)));
      let ex = 0;
      if (self) while (ex < 300 && idx.at(spot.x + ux * ex, spot.z + uz * ex) === self) ex += 0.5; // المبنى القائم في الموقع يُستبدل فلا يحجب
      const ax = spot.x + ux * ex, az = spot.z + uz * ex, bx = spot.x + ux * RANGE, bz = spot.z + uz * RANGE;
      const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz), n = Math.max(1, Math.ceil(L / STEP)), m = n - 1;
      const h = new Float64Array(m), d = new Float32Array(m), w = new Uint8Array(m), bb = new Array(m);
      for (let s = 1; s < n; s++) {
        const t = s / n, x = ax + dx * t, z = az + dz * t, hb = idx.at(x, z);
        h[s - 1] = hb ? hb.h : 0; bb[s - 1] = hb; d[s - 1] = ex + L * t; w[s - 1] = hb ? 0 : (S.inWater(x, z) ? 1 : 0);
      }
      P.push({ ex, ax, az, bx, bz, ux, uz, h, d, w, bb, n: m, xd, out: xd < RANGE });
    }
    return P;
  }
  // حجب أفقيّ: أيّ مبنى أعلى من العين على الشعاع. الماء: نقطة أرض يمرّ إليها خطّ النظر فوق كلّ ما قبلها (أفق الميل)
  function scanDir(p, eye) {
    let bi = -1, ms = -Infinity, wi = -1;
    for (let i = 0; i < p.n; i++) {
      const h = p.h[i];
      if (h > eye) { bi = i; break; }
      if (h > 0) { const sl = (h - eye) / p.d[i]; if (sl > ms) ms = sl; }
      else if (wi < 0 && p.w[i] && -eye / p.d[i] > ms) wi = i;
    }
    return [bi, wi];
  }
  // النسبة من الاتّجاهات المعروفة فقط: غير المعروف خارج البسط والمقام معًا
  const pctOf = (open, unk) => DIRS - unk > 0 ? Math.round(open / (DIRS - unk) * 100) : 0;
  function sweep(P) {
    const open = new Uint8Array((MAXF + 1) * DIRS), unk = new Uint8Array((MAXF + 1) * DIRS), water = new Uint8Array((MAXF + 1) * DIRS);
    const total = new Array(MAXF + 1).fill(0), utot = new Array(MAXF + 1).fill(0), wAny = new Array(MAXF + 1).fill(false);
    for (let f = 1; f <= MAXF; f++) {
      const eye = eyeOf(f);
      for (let k = 0; k < DIRS; k++) {
        const [bi, wi] = scanDir(P[k], eye);
        if (bi < 0) { if (P[k].out) { unk[f * DIRS + k] = 1; utot[f]++; } else { open[f * DIRS + k] = 1; total[f]++; } }
        if (wi >= 0) { water[f * DIRS + k] = 1; wAny[f] = true; }
      }
    }
    return { open, unk, water, total, utot, wAny };
  }
  // n: الاتّجاهات المعروفة في قطاع الواجهة؛ pct فارغ إن كان القطاع كلّه خارج حدود الخريطة
  function facingStats(f, facing) {
    let n = 0, o = 0, w = 0, u = 0;
    for (let k = 0; k < DIRS; k++) if (inSector(AZ[k], facing)) { if (S.sw.unk[f * DIRS + k]) u++; else { n++; o += S.sw.open[f * DIRS + k]; } w += S.sw.water[f * DIRS + k]; }
    return { n, unk: u, open: o, pct: n ? Math.round(o / n * 100) : null, water: w };
  }
  function computeFloor() {
    const f = S.floor, eye = eyeOf(f), idx = S.city.idx, dirs = [];
    let open = 0, unk = 0, agree = 0, wdirs = 0, nearW = Infinity;
    for (let k = 0; k < DIRS; k++) {
      const p = S.P[k], [bi, wi] = scanDir(p, eye);
      const losOpen = idx.los({ x: p.ax, y: eye, z: p.az }, { x: p.bx, y: eye, z: p.bz }, STEP); // حكم المفتوح من خطّ رؤية النواة
      const u = losOpen && p.out; // لم يُحجب لكنّه خرج من البيانات قبل ٥٠٠م
      if (losOpen === (bi < 0)) agree++;
      if (u) unk++; else if (losOpen) open++;
      const d = bi >= 0 ? p.d[bi] : RANGE, wd = wi >= 0 ? p.d[wi] : 0;
      if (wi >= 0) { wdirs++; if (wd < nearW) nearW = wd; }
      dirs.push({ k, az: AZ[k], open: losOpen, unk: u, xd: p.xd, d, b: bi >= 0 ? p.bb[bi] : null, water: wi >= 0, wd, ux: p.ux, uz: p.uz });
    }
    const blockers = new Set(); for (const d of dirs) if (d.b) blockers.add(d.b);
    S.cur = { f, eye, dirs, open, unk, agree, wdirs, nearW: wdirs ? nearW : 0, blockers, openPct: pctOf(open, unk) };
  }
  function bestFacing() {
    const f = S.floor; let best = S.facing, score = -1;
    for (let a = 0; a < 360; a += 5) {
      const st = facingStats(f, a), sc = st.open * 10 + st.water * 4 + (a === S.facing ? 0.5 : 0);
      if (sc > score) { score = sc; best = a; }
    }
    return best;
  }

  // ── الهندسة ──
  function prism(poly, y0, y1, pos, nor) {
    const n = poly.length; if (n < 3) return;
    let area = 0; for (let i = 0; i < n; i++) { const p = poly[i], q = poly[(i + 1) % n]; area += p[0] * q[1] - q[0] * p[1]; }
    const ccw = area > 0;
    for (let i = 0; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n], ex = q[0] - p[0], ez = q[1] - p[1], L = Math.hypot(ex, ez) || 1;
      let nx = ez / L, nz = -ex / L; if (!ccw) { nx = -nx; nz = -nz; }
      const v = [[p[0], y0, p[1]], [q[0], y0, q[1]], [q[0], y1, q[1]], [p[0], y0, p[1]], [q[0], y1, q[1]], [p[0], y1, p[1]]];
      for (const o of (ccw ? [0, 2, 1, 3, 5, 4] : [0, 1, 2, 3, 4, 5])) { pos.push(v[o][0], v[o][1], v[o][2]); nor.push(nx, 0, nz); }
    }
    const tri = THREE.ShapeUtils.triangulateShape(poly.map((p) => new THREE.Vector2(p[0], p[1])), []);
    for (const f of tri) for (const k of (ccw ? [f[0], f[2], f[1]] : [f[0], f[1], f[2]])) { pos.push(poly[k][0], y1, poly[k][1]); nor.push(0, 1, 0); }
  }
  function geo(pos, nor, col, cs) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    if (nor) g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    if (col) g.setAttribute('color', new THREE.Float32BufferAttribute(col, cs || 4));
    g.computeBoundingSphere(); return g;
  }
  function swapGeo(obj, g) { if (obj.geometry) obj.geometry.dispose(); obj.geometry = g; }
  function footprint(spot) {
    if (spot.self) {
      const poly = spot.self.poly; let cx = 0, cz = 0; for (const p of poly) { cx += p[0]; cz += p[1]; } cx /= poly.length; cz /= poly.length;
      const b = spot.self.box, s = 1 + 2.4 / Math.max(6, Math.min(b[2] - b[0], b[3] - b[1]));
      return poly.map((p) => [cx + (p[0] - cx) * s, cz + (p[1] - cz) * s]);
    }
    const h = 13; return [[spot.x - h, spot.z - h], [spot.x + h, spot.z - h], [spot.x + h, spot.z + h], [spot.x - h, spot.z + h]];
  }
  function labelSprite(text, color) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128; const g = c.getContext('2d');
    g.fillStyle = 'rgba(8,18,24,.78)'; g.beginPath(); if (g.roundRect) g.roundRect(18, 26, 220, 76, 30); else g.rect(18, 26, 220, 76); g.fill();
    g.strokeStyle = color; g.lineWidth = 4; g.stroke();
    g.fillStyle = '#fff'; g.font = '700 46px Tahoma, "IBM Plex Sans Arabic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 128, 66);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    sp.scale.set(56, 28, 1); sp.renderOrder = 10; return sp;
  }
  const C = {};
  function makeObjects(city) {
    // النواة تحرّر هندسة المدينة السابقة فقط: قوام اللافتات (CanvasTexture) ومادّتها نحرّرهما هنا وإلّا تتراكم مع كلّ مدينة
    if (C.labels) for (const s of C.labels) { if (s.material.map) s.material.map.dispose(); s.material.dispose(); }
    C.labels = null;
    C.open = new THREE.Color(0x2fd3c1); C.block = new THREE.Color(0xff7a59); C.water = new THREE.Color(0x46b4ff); C.unk = new THREE.Color(0x8a979b);
    const root = new THREE.Group(); city.group.add(root); S.root = root;
    // سماء متدرّجة تمتزج بالضباب
    const sky = new THREE.Mesh(new THREE.SphereGeometry(ctx.R * 6, 32, 16), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      vertexShader: 'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader: 'varying vec3 vP;void main(){float h=vP.y;vec3 hor=vec3(0.80,0.88,0.92);vec3 mid=vec3(0.56,0.74,0.88);vec3 top=vec3(0.24,0.45,0.70);vec3 c=h<0.0?hor:(h<0.25?mix(hor,mid,h/0.25):mix(mid,top,clamp((h-0.25)/0.75,0.0,1.0)));gl_FragColor=vec4(c,1.0);}'
    }));
    sky.renderOrder = -10; sky.frustumCulled = false; root.add(sky);
    ctx.scene.fog.color.setRGB(0.80, 0.88, 0.92, THREE.SRGBColorSpace);
    // البرج المقترح (شبح زجاجيّ) + بلاطة الطابق + سهم الواجهة
    C.ghost = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshPhongMaterial({ color: 0xa8f4ff, emissive: 0x1b7f8c, transparent: true, opacity: 0.42, depthWrite: false, side: THREE.DoubleSide, shininess: 80 }));
    C.ghost.renderOrder = 2; root.add(C.ghost);
    C.lines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xe6feff, transparent: true, opacity: 0.85 })); root.add(C.lines);
    C.slab = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: 0x8ff6ff, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false }));
    C.slab.renderOrder = 3; root.add(C.slab);
    const ag = geo([0, 0, -30, -9, 0, -12, 9, 0, -12, -9, 0, -12, 0, 0, -17, 9, 0, -12], null, null);

      row(T('أقرب حاجب قدّامك', 'Nearest blocker ahead'), ahead && !ahead.open ? Math.round(ahead.d) + M : (ahead && ahead.unk ? T('غير معروف', 'unknown') : T('لا شيء', 'none'))) +
      row(T('أقرب ماء يبان', 'Nearest visible water'), cur.wdirs ? Math.round(cur.nearW) + M : '—') +
      row(T('واجهتك تنفتح كاملة من', 'Facing fully open from'), clearF ? T('الطابق ', 'floor ') + clearF : (facingStats(MAXF, S.facing).n ? T('فوق ٩٠', 'above 90') : T('غير معروف', 'unknown'))) +
      row(T('الماء يبان من', 'Water visible from'), waterF ? T('الطابق ', 'floor ') + waterF : (S.inWater.count ? T('ما يبان', 'never') : T('لا ماء قريب', 'no water nearby')));
    setModeVis();
    window.__inspire_state = {
      city: S.city.name, buildings: S.city.buildings.length, mode: S.mode,
      spot: { x: r1(S.spot.x), z: r1(S.spot.z) }, onExistingBuilding: !!S.spot.self,
      floor: f, floorElevM: r1(elevOf(f)), eyeHeightM: r1(cur.eye), dirs: DIRS, rangeM: RANGE,
      openDirs: cur.open, unknownDirs: cur.unk, openPct: cur.openPct, losAgree: cur.agree,
      facingDeg: wrap(S.facing), facingName: dirName(S.facing), facingOpenPct: fs.pct,
      waterVisible: cur.wdirs > 0, waterDirs: cur.wdirs, waterInFacing: wFacing, nearestWaterM: Math.round(cur.nearW),
      blockers: cur.blockers.size, nearestBlockAheadM: ahead && !ahead.open ? Math.round(ahead.d) : null, nearestBlockAheadH: ahead && ahead.b ? Math.round(ahead.b.h) : null,
      facingClearFloor: clearF, waterFromFloor: waterF,
      nearestBlockByDir: cur.dirs.map((d) => d.open ? 0 : Math.round(d.d)),
      openPctByFloor: S.sw.total.slice(1).map((n, i) => pctOf(n, S.sw.utot[i + 1])),
      unknownDirsByFloor: S.sw.utot.slice(1)
    };
  }

  // ── الأفعال ──
  function pickAt(x, z, quiet, force) {
    if (!S.city) return false;
    if (Math.hypot(x, z) > ctx.R * 0.97) { ctx.ui.status(T('اختر نقطة داخل الحيّ المحمّل.', 'Pick a spot inside the loaded area.')); return false; }
    const self = S.city.idx.at(x, z);
    // ماء (قناة، بحيرة، بحر من خطّ الساحل) بلا مبنى عليه: ليس قطعة أرض
    if (!self && !force && S.inWater.at(x, z)) { ctx.ui.status(T('هذا ماء — اختر أرضًا.', "That's water — pick land.")); return false; }
    S.spot = { x, z, self };
    S.fp = footprint(S.spot);
    S.P = profile(S.spot); S.sw = sweep(S.P);
    computeFloor(); rebuildTower(); render();
    if (!quiet) { ctx.ui.status(T('اخترت الموقع — حرّك الطابق والواجهة وشوف الفرق.', 'Plot picked — move the floor and facing to compare.')); S.glide = frameTarget(x, z, ctx.orbit.theta); }
    return true;
  }
  function setFloor(f) {
    f = Math.max(1, Math.min(MAXF, Math.round(f))); if (!S.ready) { S.floor = f; return; }
    if (f === S.floor && S.cur && S.cur.f === f) return;
    S.floor = f; computeFloor(); rebuildTower(); render();
  }
  function setFacing(a) {
    a = wrap(Math.round(a / 5) * 5); if (!S.ready) { S.facing = a; return; }
    S.facing = a;
    if (S.mode === 'view') S.yawT = S.yaw + rel(a - S.yaw);
    render();
  }
  // مركز الإطار: على الحاسوب نزيح الهدف يمينًا (اللوحة يمين الشاشة)، وعلى الجوّال نقرّبه للكاميرا فيعلو الموقع فوق اللوحة السفليّة
  function frameTarget(x, z, th) {
    const mob = window.innerWidth <= 640, k = mob ? 130 : 150;
    return mob ? new THREE.Vector3(x + Math.sin(th) * k, 0, z + Math.cos(th) * k) : new THREE.Vector3(x + Math.cos(th) * k, 0, z - Math.sin(th) * k);
  }
  const fwd = (yaw, pitch) => new THREE.Vector3(Math.sin(yaw * DEG) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw * DEG) * Math.cos(pitch));
  function fly(toView) {
    const cam = ctx.camera, p0 = cam.position.clone(), dir = new THREE.Vector3(); cam.getWorldDirection(dir);
    const l0 = p0.clone().addScaledVector(dir, Math.max(80, p0.distanceTo(new THREE.Vector3(S.spot.x, 0, S.spot.z))));
    let p1, l1, fov1, lift; const fl = { toView };
    if (toView) {
      S.yaw = S.yawT = S.facing; S.pitch = S.pitchT = -0.2; S.camY = S.cur.eye;
      p1 = new THREE.Vector3(S.spot.x, S.cur.eye, S.spot.z); l1 = p1.clone().add(fwd(S.yaw, S.pitch).multiplyScalar(220));
      fov1 = 70; lift = Math.min(160, 0.15 * p0.distanceTo(p1)); ctx.orbit.enabled = false;
    } else {
      fl.th = -S.facing * DEG + 0.45; fl.ph = 0.66; fl.D = 900; fl.tg = frameTarget(S.spot.x, S.spot.z, fl.th);
      p1 = new THREE.Vector3(fl.tg.x + fl.D * Math.sin(fl.ph) * Math.sin(fl.th), fl.D * Math.cos(fl.ph), fl.tg.z + fl.D * Math.sin(fl.ph) * Math.cos(fl.th));
      l1 = fl.tg.clone(); fov1 = 50; lift = 60;
    }
    Object.assign(fl, { t: 0, dur: toView ? 2.6 : 2.0, p0, p1, l0, l1, f0: cam.fov, f1: fov1, lift });
    S.flight = fl; S.mode = 'flying'; setModeVis(); render();
  }
  const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const tmpL = new THREE.Vector3(), tmpP = new THREE.Vector3();
  function frame(dt, now) {
    if (!S.ready) return;
    const cam = ctx.camera;
    if (C.pin.visible) { const k = 1 + 0.12 * Math.sin(now * 0.005); C.pin.scale.set(k, k, k); C.pin.material.opacity = 0.65 + 0.3 * Math.sin(now * 0.005); }
    if (C.beacons.count) C.beacons.material.color.setHSL(0.57, 1, 0.6 + 0.12 * Math.sin(now * 0.006));
    const fl = S.flight;
    if (fl) {
      if (!fl.start) fl.start = now;
      fl.t = Math.min(1, (now - fl.start) / 1000 / fl.dur); const e = ease(fl.t); // بالزمن الحقيقيّ: تصل في موعدها حتّى على جهاز بطيء
      cam.position.lerpVectors(fl.p0, fl.p1, e); cam.position.y += fl.lift * Math.sin(Math.PI * e);
      tmpL.lerpVectors(fl.l0, fl.l1, Math.min(1, e * 1.15)); cam.lookAt(tmpL);
      cam.fov = fl.f0 + (fl.f1 - fl.f0) * e; cam.updateProjectionMatrix();
      if (fl.t >= 1) {
        S.flight = null;
        if (fl.toView) { S.mode = 'view'; }
        else { const o = ctx.orbit; o.target.copy(fl.tg); o.theta = fl.th; o.phi = fl.ph; o.dist = fl.D; o.apply(); o.enabled = true; S.mode = 'map'; }
        render();
      }
      return;
    }
    if (S.mode === 'view') {
      const k = Math.min(1, dt * 5);
      S.yaw += (S.yawT - S.yaw) * k; S.pitch += (S.pitchT - S.pitch) * k; S.camY += (S.cur.eye - S.camY) * Math.min(1, dt * 3);
      tmpP.set(S.spot.x, S.camY, S.spot.z); cam.position.copy(tmpP); cam.lookAt(tmpL.copy(tmpP).add(fwd(S.yaw, S.pitch)));
      if (Math.abs(S.yaw - S.stripYaw) > 0.4) { const el = $('vwStrip'); if (el) el.innerHTML = stripHtml(S.yaw); S.stripYaw = S.yaw; }
    } else if (S.mode === 'map' && S.glide) {
      const o = ctx.orbit, k = Math.min(1, dt * 4); o.target.lerp(S.glide, k); o.apply();
      if (o.target.distanceTo(S.glide) < 0.5) S.glide = null;
    }
  }

  ctx = CK.start({
    title: TITLE,
    sub: T('اختر قطعة وطابقًا: نحسب كم من الأفق مفتوح، وهل يبان الماء، ووش يحجبك — من مباني حيّك الحقيقيّة.', 'Pick a plot and a floor: how much horizon is open, whether water is visible, and what blocks you — from your real buildings.'),
    shadows: true,
    panel(c) { ctx = c; THREE = c.THREE; buildPanel(c); },
    onCity(c, city) {
      ctx = c; THREE = c.THREE;
      S.ready = false; S.city = city; S.mode = 'map'; S.flight = null; S.glide = null; S.cur = null;
      c.orbit.enabled = true; c.camera.fov = 50; c.camera.updateProjectionMatrix();
      S.inWater = makeWater(city);
      makeObjects(city);
      // نقطة البداية: أقرب أرض فاضية (لا ماء) إلى المركز، وإلّا أقرب نقطة غير مائيّة (مبنى قائم)
      const near = (maxR, ok) => { for (let r = 0; r <= maxR; r += 6) for (let a = 0; a < 360; a += 30) { const x = Math.sin(a * DEG) * r, z = -Math.cos(a * DEG) * r; if (ok(x, z)) return [x, z]; } return null; };
      const [sx, sz] = near(120, (x, z) => !city.idx.at(x, z) && !S.inWater.at(x, z)) || near(c.R * 0.9, (x, z) => !!city.idx.at(x, z) || !S.inWater.at(x, z)) || [0, 0];
      pickAt(sx, sz, true, true);
      S.ready = true;
      setFacing(bestFacing());
      const o = c.orbit; o.theta = -S.facing * DEG + 0.45; o.target.copy(frameTarget(sx, sz, o.theta)); o.phi = 0.66; o.dist = 960; o.apply();
      c.onFrame(frame);
    }
  });
  window.__view = {
    pick: (x, z) => pickAt(x, z), tap: (cx, cy) => tapAt(cx, cy), floor: (f) => setFloor(f), facing: (a) => setFacing(a), best: () => setFacing(bestFacing()),
    fly: () => { if (S.mode !== 'view' && !S.flight) fly(true); }, back: () => { if (S.mode === 'view' && !S.flight) fly(false); },
    state: () => window.__inspire_state
  };
})();
</script></body></html>
