<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برجك بين جيرانه</title>

<!--CITYKIT-->
<style>
.tw-sec{margin-top:10px;padding-top:8px;border-top:1px solid rgba(120,200,210,.18)}
.tw-sec h3{margin:0;font-size:13.5px;color:#7fe0e6;font-weight:700}
.tw-lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#a9c1c7;margin-top:5px}
.tw-lab b{color:#fff;font-variant-numeric:tabular-nums;font-weight:600}
.tw input[type=range]{width:100%;margin:2px 0 0;accent-color:#35c6cf;padding:0;border:0;background:transparent}
.tw-hint{font-size:12.5px;color:#d7eef1;background:rgba(53,198,207,.1);border:1px dashed rgba(53,198,207,.45);border-radius:9px;padding:6px 9px;margin-top:4px}
.tw-hint.bad{color:#ffd0c4;border-color:rgba(255,120,90,.6);background:rgba(255,90,60,.1)}
.tw-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ck-ui .tw-chip{background:transparent;border:1px solid #2b4650;color:#cfe3e7;padding:3px 11px;font-size:12.5px;border-radius:20px}
.ck-ui .tw-chip.on{background:#1f8a93;border-color:#1f8a93;color:#fff}
.tw-sun{font-size:12px;color:#9fc3c9;margin-top:6px;font-variant-numeric:tabular-nums}
.tw-sun.tw-clip{color:#ffb35c;margin-top:3px}.tw-clip[hidden]{display:none}
.tw-check{display:flex!important;align-items:center;gap:7px;cursor:pointer;color:#cfe3e7!important}
.tw-check input{flex:0 0 auto;accent-color:#35c6cf;width:16px;height:16px}
.tw-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tw-btns .wide{grid-column:1/-1}
.ck-ui .tw-btns button{display:flex;align-items:center;justify-content:center;gap:6px}
.tw-btns svg{width:16px;height:16px;flex:0 0 auto}
.tw-leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:#9fc3c9;margin-top:8px}
.tw-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.tw .ck-stat{font-size:13px}
.tw .ck-stat span{color:#a9c1c7}
.tw-cards{display:grid;grid-template-columns:repeat(4,auto);gap:8px;justify-content:start}
.tw-card{background:rgba(9,18,24,.74);border:1px solid rgba(120,200,210,.28);border-radius:12px;padding:6px 12px 5px;text-shadow:none;min-width:88px;backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tw-card small{display:block;font-size:11.5px;color:#9fc3c9;font-weight:500;white-space:nowrap}
.tw-card b{font-size:22px;line-height:1.2;color:#fff;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tw-card em{font-style:normal;font-size:12px;color:#9fc3c9;margin-inline-start:3px;font-weight:500}
.tw-card.acc{border-color:rgba(255,166,77,.55)}.tw-card.acc b{color:#ffb35c}
.tw-card.good b{color:#7ff0c4}
.tw-tag{position:fixed;z-index:3;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);background:rgba(9,18,24,.84);color:#fff;border:1px solid #35c6cf;border-radius:10px;padding:2px 10px;font:600 13px/1.5 "IBM Plex Sans Arabic",Tahoma,sans-serif;white-space:nowrap;direction:rtl;margin-top:-8px}
.tw-tag:after{content:"";position:absolute;left:50%;bottom:-9px;width:1px;height:8px;background:#35c6cf}
.tw-joy{position:fixed;left:22px;bottom:24px;width:128px;height:128px;border-radius:50%;background:rgba(9,18,24,.45);border:1.5px solid rgba(160,230,235,.55);z-index:7;display:none;touch-action:none;backdrop-filter:blur(4px)}

.tw-walkbar button svg{width:16px;height:16px}
.tw-walkbar span{background:rgba(9,18,24,.7);color:#cfe3e7;border-radius:16px;padding:6px 11px}
body.tw-walk .tw-joy{display:block}body.tw-walk .tw-walkbar{display:flex}body.tw-walk .tw-tag{display:none}
@media (max-width:640px){
  .tw-cards{grid-template-columns:repeat(4,minmax(0,1fr));width:calc(100vw - 24px);gap:5px}

  body.tw-walk .ck-ui,body.tw-walk .ck-toggle{display:none}
  .tw-walkbar{left:auto;right:14px;transform:none;flex-direction:column;align-items:flex-end}
}
</style>

  function heroGoal() { // إطار يحوي البرج من قاعدته لقمّته وظلّه، حسب المساحة المكشوفة خارج اللوحة
    const h = H(), s = S.sun, sv = S.shadowVec, W = window.innerWidth, Hh = window.innerHeight, r = ctx.ui.box.getBoundingClientRect();
    const th = s && s.alt > 0.5 * DEG ? Math.atan2(s.x, s.z) + 1.15 : 0.75; // من جهة الشمس بزاوية: الواجهة مضاءة والظلّ يمتدّ عرضيًّا
    let visW = W, visH = Hh;

  function hero(instant) {

  function updateViewOffset() { // الجوّال: اللوحة في الأسفل فنرفع مركز المشهد إلى المساحة المكشوفة

    for (const [dx, dz] of [[0, 0], [0.5, 0], [-0.5, 0], [0, 0.5], [0, -0.5]]) if (city.idx.at(x + dx, z + dz)) return false;

  // ── الإطار ──

    const setSlider = (id, v) => { const s = q(id); s.value = v; s.dispatchEvent(new Event('input', { bubbles: true })); };
