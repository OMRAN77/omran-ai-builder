<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اسمع الشقّة قبل التوقيع</title>

<!--CITYKIT-->
<style>
.nz{margin-top:6px;border-top:1px solid rgba(120,200,210,.18);padding-top:8px}
.nz-hint{font-size:12.5px;color:#cfe3e7;background:rgba(31,138,147,.16);border:1px solid rgba(31,138,147,.35);border-radius:10px;padding:6px 9px;margin:0 0 8px;display:flex;gap:7px;align-items:flex-start}
.nz-hint svg{flex:0 0 16px;margin-top:3px}
.nz-gauge{position:relative;text-align:center;margin:0 auto;max-width:260px}
.nz-gauge svg{width:100%;height:auto;display:block}
.nz-verdict{font-weight:700;font-size:15px;margin-top:-4px}
.nz-est{display:inline-block;font-size:11px;color:#0b1419;background:#f2c94c;border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:2px;font-weight:700}
.nz-sub{font-size:12px;color:#a9c1c7;text-align:center;margin-top:2px}
.nz-seg{display:flex;background:#0d1a20;border:1px solid #2b4650;border-radius:10px;padding:3px;gap:3px;margin:8px 0 6px}
.nz-seg button{flex:1;background:transparent!important;color:#cfe3e7!important;padding:5px 8px!important;display:flex;gap:6px;align-items:center;justify-content:center}
.nz-seg button.on{background:#1f8a93!important;color:#fff!important}
.nz-row{display:flex;gap:6px;align-items:center;margin:6px 0}
.nz-row .grow{flex:1}
.nz-play{display:flex;gap:7px;align-items:center;justify-content:center;font-weight:700!important}
.nz-play.stop{background:#c0473a!important}
.nz-floor{display:flex;gap:6px;align-items:center}
.nz-floor button{width:34px;height:34px;padding:0!important;font-size:20px!important;line-height:1;flex:0 0 34px}
.nz-floor input{flex:1}
.nz-fl{font-variant-numeric:tabular-nums;font-size:13px;color:#cfe3e7;display:flex;justify-content:space-between;margin-top:4px}
.nz-h{font-size:12.5px;color:#a9c1c7;margin:10px 0 4px;font-weight:700;display:flex;justify-content:space-between}
.nz-src{display:grid;gap:3px}
.nz-s{display:grid;grid-template-columns:10px 1fr auto auto;gap:7px;align-items:center;font-size:12.5px;background:rgba(255,255,255,.035);border-radius:8px;padding:4px 8px}
.nz-s i{width:10px;height:10px;border-radius:50%;display:block}
.nz-s .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nz-s .d{color:#9fb6bc;font-size:11.5px;font-variant-numeric:tabular-nums}
.nz-s b{font-variant-numeric:tabular-nums;min-width:44px;text-align:left}
.nz-s em{font-style:normal;font-size:10.5px;color:#0b1419;background:#9fb6bc;border-radius:5px;padding:0 4px;margin-inline-start:4px}
.nz-in{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.nz-in div{background:rgba(255,255,255,.04);border-radius:9px;padding:5px 8px;font-size:11.5px;color:#a9c1c7}
.nz-in b{display:block;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.nz-pr{display:grid;grid-template-columns:44px 1fr 74px;gap:6px;align-items:center;height:13px;font-size:10.5px;color:#9fb6bc;cursor:pointer;font-variant-numeric:tabular-nums}
.nz-pr .t{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;display:block}
.nz-pr .t span{display:block;height:100%;border-radius:4px;opacity:.7}
.nz-pr .v em{font-style:normal;color:#9fe0b8;margin-inline-start:5px}
.nz-pr.on{color:#fff;font-weight:700}.nz-pr.on .t span{opacity:1;box-shadow:0 0 0 1.5px #fff inset}
.nz-pr:hover{color:#fff}
.nz-q{font-size:12px;color:#9fe0b8;margin-top:2px}
.nz-chk{display:flex!important;gap:8px;align-items:center;cursor:pointer;color:#cfe3e7!important;margin-top:10px!important}
.ck-ui .nz-chk input{flex:0 0 auto;width:16px;height:16px;margin:0;accent-color:#1f8a93}
.nz-note{font-size:11.5px;color:#93aab0;margin:10px 0 2px;line-height:1.55}
.nz-hud{direction:rtl;background:rgba(10,18,24,.72);border:1px solid rgba(120,200,210,.22);border-radius:14px;padding:8px 14px 9px;backdrop-filter:blur(6px);min-width:150px}

.nz-hud .l{font-size:13px;color:#e8f1f3;margin-top:3px}
.nz-hud .f{font-size:12px;color:#a9c1c7}

@media (max-width:640px){.nz-gauge{display:none}.nz-hud{min-width:120px;padding:6px 10px}.nz-hud .v{font-size:30px}}

</head><body><script>
(function () {

  const PASS_RATE = { motorway: 0.9, trunk: 0.6, primary: 0.4, secondary: 0.28, tertiary: 0.16, residential: 0.06 };
  const STOPS = [[40, [63, 191, 127]], [50, [150, 205, 90]], [58, [242, 200, 60]], [66, [240, 130, 50]], [74, [224, 69, 58]], [82, [170, 40, 90]]];

  }

  const hexOf = (db) => { const c = rgbOf(db); return (c[0] << 16) | (c[1] << 8) | c[2]; };

    return db < 50 ? T('هادئ', 'Quiet') : db < 58 ? T('مقبول', 'Acceptable') : db < 65 ? T('مسموع بوضوح', 'Clearly audible') : db < 72 ? T('مزعج', 'Noisy') : T('صاخب جدًّا', 'Very loud');
  }
  function compass(nx, nz) {
    const a = (Math.atan2(nx, -nz) * 180 / Math.PI + 360) % 360, i = Math.round(a / 45) % 8;
    return [T('شماليّة', 'north'), T('شماليّة شرقيّة', 'north-east'), T('شرقيّة', 'east'), T('جنوبيّة شرقيّة', 'south-east'), T('جنوبيّة', 'south'), T('جنوبيّة غربيّة', 'south-west'), T('غربيّة', 'west'), T('شماليّة غربيّة', 'north-west')][i];
  }
  const floorName = (k) => (k === 0 ? T('الأرضيّ', 'Ground') : String(k));
  const r1 = (v) => Math.round(v * 10) / 10;

  let C = null, S = null; // C: سياق النواة، S: حالة المدينة الحاليّة (تُبنى من جديد مع كلّ مدينة)

  const UI = {};

  // ── تجهيز المقاطع مرّة لكلّ مدينة (مصفوفات مسطّحة؛ لا حلقات على المباني في كلّ إطار) ──
  function buildSegments(city) {
    const roads = [], A = { ax: [], az: [], bx: [], bz: [], e: [], r2: [], road: [] }, byName = new Map();

  }

  // مستوى الضجيج عند نقطة: لكلّ مقطع أقرب نقطة، ٣ dB لكلّ مضاعفة مسافة (مصدر خطّيّ) × حصّة زاوية الرؤية
  // (حتّى لا يتضاعف الشارع المقسوم لمقاطع كثيرة)، و−١٠ dB إن حجب مبنى خطّ الرؤية (city.idx.los)، ثمّ جمع طاقيّ.
  function evaluate(rx, ry, rz, top) {
    const g = S.seg, idx = S.city.idx, nR = g.roads.length;
    const rE = top ? new Float64Array(nR) : null, bE = top ? new Float64Array(nR) : null, bI = top ? new Int32Array(nR).fill(-1) : null;
    const bX = top ? new Float64Array(nR) : null, bZ = top ? new Float64Array(nR) : null, bD = top ? new Float64Array(nR) : null, bB = top ? new Uint8Array(nR) : null;
    const ay = SRC_Y - ry, ay2 = ay * ay, A = { x: rx, y: ry, z: rz }, B = { x: 0, y: SRC_Y, z: 0 };
    let tot = 0, los = 0;
    for (let i = 0; i < g.n; i++) {
      const ax = g.ax[i] - rx, az = g.az[i] - rz, bx = g.bx[i] - rx, bz = g.bz[i] - rz, ex = bx - ax, ez = bz - az, L2 = ex * ex + ez * ez;
      let t = -(ax * ex + az * ez) / L2; t = t < 0 ? 0 : t > 1 ? 1 : t;
      const nx = ax + ex * t, nz = az + ez * t, d2 = nx * nx + nz * nz;
      if (d2 > g.r2[i]) continue;

      const th = Math.atan2(Math.sqrt(cx * cx + cy * cy + cz * cz), ax * bx + ay2 + az * bz);
      let e = g.e[i] * (10 / Math.max(d, 5)) * (th / Math.PI);
      if (!(e > 0)) continue;
      let blk = 1;
      if (e > 1000) { B.x = rx + nx; B.z = rz + nz; los++; blk = idx.los(A, B, LOS_STEP) ? 0 : 1; } // أضعف من ٣٠ dB: يُعدّ محجوبًا بلا فحص (أثره على المجموع لا يُذكر)
      if (blk) e *= Math.pow(10, -BLOCK_DB / 10);

      if (top) { const r = g.road[i]; rE[r] += e; if (e > bE[r]) { bE[r] = e; bI[r] = i; bX[r] = rx + nx; bZ[r] = rz + nz; bD[r] = d; bB[r] = blk; } }
    }
    const db = tot > 0 ? 10 * Math.log10(tot) : 0;
    if (!top) return { db, los };
    const order = []; for (let r = 0; r < nR; r++) if (bI[r] >= 0) order.push(r);
    order.sort((a, b) => rE[b] - rE[a]);
    const sources = order.slice(0, 5).map((r) => ({ name: g.roads[r].name || KIND_NAME[g.roads[r].kind] || T('شارع', 'Street'), kind: g.roads[r].kind, db: r1(10 * Math.log10(rE[r])), dist: Math.round(bD[r]), blocked: !!bB[r], share: Math.round(100 * rE[r] / tot), x: bX[r], z: bZ[r] }));
    return { db, los, sources };
  }

  // ── اختيار الشقّة ──
  function nearestFacade(b, px, pz) {
    let best = null;
    const P = b.poly, n = P.length;
    for (let i = 0; i < n; i++) {
      const p = P[i], q = P[(i + 1) % n], ex = q[0] - p[0], ez = q[1] - p[1], L2 = ex * ex + ez * ez || 1;
      let t = ((px - p[0]) * ex + (pz - p[1]) * ez) / L2; t = Math.max(0.08, Math.min(0.92, t));
      const x = p[0] + ex * t, z = p[1] + ez * t, d = (x - px) ** 2 + (z - pz) ** 2;
      if (!best || d < best.d) { const L = Math.sqrt(L2); best = { d, x, z, nx: ez / L, nz: -ex / L }; }
    }
    if (CK.inPoly(best.x + best.nx * 0.5, best.z + best.nz * 0.5, b.poly)) { best.nx = -best.nx; best.nz = -best.nz; }
    return { x: best.x + best.nx * 0.6, z: best.z + best.nz * 0.6, nx: best.nx, nz: best.nz };
  }
  const maxFloorOf = (b) => Math.max(0, Math.floor((b.h - 2.2) / FLOOR_H));
  function pickBuilding(b, px, pz, floor, wall) {
    let f;

  function pickGround(x, z, floor) {

  function pickAt(x, z, floor) { // للاختبار ولزرّ الوسط: يختار المبنى عند النقطة أو الأرض

  function afterPick() {

  function setFloor(k) {

  function recompute() {

  // ── المؤثّرات ثلاثيّة الأبعاد ──
  function disposeTree(o) { o.traverse((m) => { if (m.geometry) m.geometry.dispose(); if (m.material) m.material.dispose(); }); }
  function haloTexture() {

    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

  }
  function beam(THREE, a, b, radius, color, opacity) {

  function buildFx() {
    const THREE = C.THREE, p = S.pick, res = S.res;
    if (S.fx) { S.city.group.remove(S.fx.group); disposeTree(S.fx.group); }

    S.fx = fx; S.city.group.add(grp);
    const R = new THREE.Vector3(p.x, res.y, p.z), lvl = G.night ? res.db - NIGHT_DROP : res.db;
    // الشقّة: كرة مضيئة + هالة + عمود إلى الأرض
    const core = new THREE.Mesh(new THREE.SphereGeometry(2.6, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));

    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTexture(), color: hexOf(lvl), transparent: true, depthWrite: false, depthTest: false }));
    halo.scale.set(26, 26, 1); halo.position.copy(R); halo.renderOrder = 6; grp.add(halo); fx.halo = halo;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, R.y, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }));
    stem.position.set(R.x, R.y / 2, R.z); grp.add(stem);
    // شريط الدور المختار حول المبنى
    if (p.b) {
      const poly = p.b.poly; let cx = 0, cz = 0; for (const q of poly) { cx += q[0]; cz += q[1]; } cx /= poly.length; cz /= poly.length;
      const span = Math.max(4, Math.max(p.b.box[2] - p.b.box[0], p.b.box[3] - p.b.box[1]) / 2), s = 1 + 0.7 / span;

        edge.push(ax, y0, az, bx, y0, bz, ax, y1, az, bx, y1, bz);
      }
      const eg = new THREE.BufferGeometry(); eg.setAttribute('position', new THREE.Float32BufferAttribute(edge, 3));

    ctx.ui.panel.appendChild(el);
    const $ = (id) => el.querySelector('#' + id);
    Object.assign(UI, { range: $('nzRange'), play: $('nzPlay'), win: $('nzWin'), day: $('nzDay'), nightB: $('nzNight'), fl: $('nzFl'), src: $('nzSrc'), prof: $('nzProf'), profQ: $('nzQ'), heat: $('nzHeat'), arc: $('nzArc'), needle: $('nzNeedle'), val: $('nzVal'), ver: $('nzVer'), sub: $('nzSub'), inO: $('nzInO'), inC: $('nzInC'), nSrc: $('nzN') });
    UI.range.addEventListener('input', () => { G.wantFloor = +UI.range.value; });
    $('nzDn').addEventListener('click', () => S && S.pick && setFloor(S.pick.floor - 1));
    $('nzUp').addEventListener('click', () => S && S.pick && setFloor(S.pick.floor + 1));
    UI.play.addEventListener('click', () => { if (AU.on) audioStop(); else audioStart(); });
    UI.win.addEventListener('click', () => { G.closed = !G.closed; renderUI(); audioUpdate(); publish(); });
    UI.day.addEventListener('click', () => setNight(false));
    UI.nightB.addEventListener('click', () => setNight(true));
    UI.heat.addEventListener('change', () => { G.heat = UI.heat.checked; if (S && S.heat) S.heat.mesh.visible = G.heat; });
    UI.prof.addEventListener('click', (e) => { const g = e.target.closest('[data-f]'); if (g) setFloor(+g.getAttribute('data-f')); });
    UI.labels = document.body.appendChild(CK.el('<div class="nz-labels"></div>'));
  }
  function setNight(on) {
    G.night = !!on; applyLight();
    repaintHeat();
    if (S && S.res) { buildFx(); renderUI(); renderProfile(); publish(); audioUpdate(); }
  }
  function renderUI() {
    if (!UI.play) return;
    UI.play.classList.toggle('stop', AU.on);
    UI.play.innerHTML = (AU.on ? ICON.stop : ICON.play) + '<span>' + (AU.on ? T('أوقف الصوت', 'Stop sound') : T('اسمع الشقّة', 'Hear the flat')) + '</span>';
    UI.win.textContent = G.closed ? T('النافذة مغلقة', 'Window closed') : T('النافذة مفتوحة', 'Window open');
    UI.day.classList.toggle('on', !G.night); UI.nightB.classList.toggle('on', G.night);
    if (!S || !S.res || !S.pick) { C.ui.hud(''); return; }
    const p = S.pick, res = S.res, L = G.night ? res.db - NIGHT_DROP : res.db, Lr = Math.round(L), col = cssOf(L);
    const f = Math.max(0, Math.min(1, (L - 30) / 55));
    UI.arc.setAttribute('stroke-dasharray', (f * Math.PI * 80).toFixed(1) + ' 999'); UI.arc.setAttribute('stroke', col);
    const na = Math.PI * (1 - f); UI.needle.setAttribute('cx', (110 + 80 * Math.cos(na)).toFixed(1)); UI.needle.setAttribute('cy', (112 - 80 * Math.sin(na)).toFixed(1));
    UI.val.textContent = res.sources.length ? Lr : '—'; UI.ver.textContent = verdict(L, G.night); UI.ver.style.color = col;
    const side = p.b ? T('واجهة ', 'facade ') + compass(p.nx, p.nz) : (p.floor ? T('برج افتراضيّ هنا', 'imagined tower here') : T('على الرصيف', 'at street level'));
    UI.sub.textContent = 'dB(A) · ' + (G.night ? T('ليلًا', 'night') : T('نهارًا', 'day')) + ' · ' + side;
    UI.fl.textContent = T('الدور ', 'Floor ') + floorName(p.floor) + T(' من ', ' of ') + p.maxFloor + ' · ' + T('ارتفاع ', 'height ') + Math.round(res.y) + T(' م', ' m');
    UI.inO.textContent = Math.round(L - 10) + ' dB'; UI.inC.textContent = Math.round(L - 25) + ' dB';
    UI.nSrc.textContent = T('من ', 'of ') + S.seg.n + T(' مقطع شارع', ' street segments');
    UI.src.innerHTML = res.sources.length ? res.sources.map((s) => { const sl = G.night ? s.db - NIGHT_DROP : s.db; return '<div class="nz-s"><i style="background:' + cssOf(sl) + '"></i><span class="n">' + esc(s.name) + (s.blocked ? '<em>' + T('محجوب', 'shielded') + '</em>' : '') + '</span><span class="d">' + s.dist + T(' م', ' m') + ' · ' + s.share + '%</span><b>' + Math.round(sl) + ' dB</b></div>'; }).join('')
      : '<div class="nz-s"><i></i><span class="n">' + T('ما فيه شوارع سيّارات قريبة', 'No car streets nearby') + '</span></div>';
    const pct = (f * 100).toFixed(1);
    C.ui.hud('<div class="nz-hud"><div class="v" style="color:' + col + '">' + (res.sources.length ? Lr : '—') + '<small>dB(A)</small></div><div class="l">' + verdict(L, G.night) + ' · ' + (G.night ? T('ليلًا', 'night') : T('نهارًا', 'day')) + ' · ' + T('تقدير', 'estimate') + '</div><div class="f">' + T('الدور ', 'Floor ') + floorName(p.floor) + ' · ' + side + '</div><div class="bar"><span style="left:calc(' + pct + '% - 1px)"></span></div></div>');
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function publish() {
    const res = S && S.res, p = S && S.pick, pr = S && S.prof;
    let q = null; if (pr && pr.done) for (const r of pr.out) if (!q || r.db < q.db) q = r;
    window.__inspire_state = {
      dbDay: res ? r1(res.db) : null, dbNight: res ? r1(res.db - NIGHT_DROP) : null,
      topSources: res ? res.sources.map((s) => ({ name: s.name, kind: s.kind, db: s.db, dist: s.dist, blocked: s.blocked, share: s.share })) : [],
      floor: p ? p.floor : null, maxFloor: p ? p.maxFloor : null, buildingId: p && p.b ? p.b.id : null, buildingH: p && p.b ? r1(p.b.h) : null,
      receiver: p && res ? { x: r1(p.x), y: r1(res.y), z: r1(p.z) } : null, facade: p && p.b ? compass(p.nx, p.nz) : null,
      segments: S ? S.seg.n : 0, losChecks: res ? res.los : 0, calcMs: res ? Math.round(res.ms) : 0,
      profile: pr ? pr.out.slice() : [], profileDone: !!(pr && pr.done), quietestFloor: q ? q.floor : null,
      night: G.night, windowClosed: G.closed, playing: AU.on, audioGain: r1(AU.gain * 1000) / 1000, heatDone: !!(S && S.heat && S.heat.done), city: S ? S.city.name : '',
    };
  }

  // ── النقر لاختيار الشقّة (مع عتبة حركة حتّى لا يُحسب السحب نقرًا) ──
  function bindPick(ctx) {
    const dom = ctx.renderer.domElement, ray = new ctx.THREE.Raycaster(), ndc = new ctx.THREE.Vector2();
    let down = null;
    dom.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; fly = null; });
    dom.addEventListener('pointerup', (e) => {
      if (!down || e.pointerId !== down.id) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
      if (moved < 7 && dt < 700) tapAt(e.clientX, e.clientY);
    });
    function tapAt(cx, cy) {
      if (!S) return;
      const r = dom.getBoundingClientRect(); ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, ctx.camera);
      const hit = ray.intersectObjects([S.city.buildingsMesh, S.city.ground], false)[0]; if (!hit) return;
      const p = hit.point, idx = S.city.idx;
      if (hit.object === S.city.buildingsMesh && hit.face) {
        const n = hit.face.normal;
        if (Math.abs(n.y) > 0.5) { const b = idx.at(p.x, p.z); if (b) return pickBuilding(b, p.x, p.z); }
        else { const b = idx.at(p.x - n.x * 0.4, p.z - n.z * 0.4); if (b) return pickBuilding(b, p.x, p.z, Math.floor(Math.max(0, p.y - 0.3) / FLOOR_H), { x: n.x, z: n.z }); }
      }
      if (Math.hypot(p.x, p.z) > ctx.R * 1.02) { ctx.ui.status(T('هذا خارج المنطقة المحمّلة — اختر نقطة أقرب.', 'Outside the loaded area — pick a closer spot.')); return; }
      const b = idx.at(p.x, p.z); if (b) pickBuilding(b, p.x, p.z); else pickGround(p.x, p.z);
    }
    window.__noise_tap = tapAt;
  }
  // الجوّال: اللوحة تشغل أسفل الشاشة، فنرفع مركز المشهد إلى النصف العلويّ
  function viewOffset() {
    const W = window.innerWidth, H = window.innerHeight, cam = C.camera;
    if (W <= 640) cam.setViewOffset(W, H, 0, Math.round(H * 0.2), W, H); // الجوّال: اللوحة أسفل
    else if (W >= 900) cam.setViewOffset(W, H, Math.round(Math.min(380, W * 0.33) / 2), 0, W, H); // الحاسوب: اللوحة يمينًا
    else cam.clearViewOffset();
    cam.updateProjectionMatrix();
  }

  function autoPick(city) {
    let best = null, bd = Infinity;
    for (const b of city.buildings) { if (b.h < 9) continue; const cx = (b.box[0] + b.box[2]) / 2, cz = (b.box[1] + b.box[3]) / 2, d = cx * cx + cz * cz; if (d < bd) { bd = d; best = b; } }
    if (!best) for (const b of city.buildings) { const cx = (b.box[0] + b.box[2]) / 2, cz = (b.box[1] + b.box[3]) / 2, d = cx * cx + cz * cz; if (d < bd) { bd = d; best = b; } }
    if (!best) { pickGround(0, 0, 0); return; }
    const cx = (best.box[0] + best.box[2]) / 2, cz = (best.box[1] + best.box[3]) / 2, g = S.seg;
    let q = [cx, cz], qd = Infinity;
    for (let i = 0; i < g.n; i++) {
      const ex = g.bx[i] - g.ax[i], ez = g.bz[i] - g.az[i]; let t = ((cx - g.ax[i]) * ex + (cz - g.az[i]) * ez) / (ex * ex + ez * ez); t = Math.max(0, Math.min(1, t));
      const x = g.ax[i] + ex * t, z = g.az[i] + ez * t, d = (x - cx) ** 2 + (z - cz) ** 2; if (d < qd) { qd = d; q = [x, z]; }
    }
    pickBuilding(best, q[0], q[1], Math.round(maxFloorOf(best) * 0.45));
  }

  CK.start({
    title: T('اسمع الشقّة قبل التوقيع', 'Hear the flat before you sign'),
    sub: T('ضجيج الشوارع الحقيقيّة عند أيّ شقّة وأيّ دور في حيّك — بالأرقام وبالصوت.', 'Real street noise at any flat and floor in your area — in numbers and sound.'),
    shadows: true,
    panel(ctx) {
      C = ctx;
      UI.def = { bg: ctx.scene.background.getHex(), hemi: ctx.hemi.intensity, hemiC: ctx.hemi.color.getHex(), sun: ctx.sun.intensity };
      buildPanel(ctx); bindPick(ctx); viewOffset(); renderUI();
      window.addEventListener('resize', viewOffset);
      window.__noise = { pickAt, setFloor, setNight, play: audioStart, stop: audioStop, evaluate: (x, y, z) => evaluate(x, y, z, true), tap: (x, y) => window.__noise_tap(x, y), toggleWindow: () => UI.win.click() };
    },
    onCity(ctx, city) {
      C = ctx; audioStop(); fly = null;
      if (S) { // المدينة السابقة: النواة تحرّر الأشكال فقط، فنحرّر قوام خريطة الضجيج ومادّتها ومواد المؤثّرات
        if (S.heat) { S.heat.tex.dispose(); S.heat.mesh.material.dispose(); }
        if (S.fx) disposeTree(S.fx.group);
      }
      S = { city, seg: buildSegments(city), pick: null, res: null, fx: null, prof: null, heat: null };
      G.floor = null; UI.labels.innerHTML = '';
      applyLight(); startHeat();
      ctx.onFrame((dt, now) => {
        if (G.wantFloor != null) { const k = G.wantFloor; G.wantFloor = null; setFloor(k); }
        tickFly(now); tickFx(dt, now); tickProfile(); tickHeat();
      });
      autoPick(city);
    },
  });
})();
</script></body></html>
