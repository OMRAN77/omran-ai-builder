  // ── عيّنات الطرق كلّ ١٠م (تُحسب مرّة لكلّ مدينة) ──
  function sampleRoads(city, R) {
    const ax = [], az = [], bx = [], bz = [], ri = [], cont = [];

    for (let i = 0; i < N; i++) {

      o.hx[i] = (o.bx[i] - o.ax[i]) / (o.len[i] || 1); o.hz[i] = (o.bz[i] - o.az[i]) / (o.len[i] || 1);

  // ── منطق الرؤية ──
  const rangeOf = (b) => Math.max(80, Math.min(900, 50 * Math.sqrt(b.w * b.h))); // مدى القراءة التقريبيّ من مساحة اللوحة
  function target(b) {

    return { x, y: b.elev + b.h / 2, z };
  }
  function ensureLOS(C, range, nx, nz) { // nx=null: كلّ الاتّجاهات (للبحث عن أفضل اتّجاه)

  function compute() {

    // والعيّنة تُعدّ لاتّجاه فقط إن كانت مرئيّة واللوحة أمامه ضمن ±٦٠°. «المقطع» = سلسلة × اتّجاه، والثواني ما يراه سائق واحد.

  // ── رسم: طرق ملوّنة + مروحة نظر + مخروط + أفضل مقطع ──
  function buildOverlay() {

    else D.d = Math.min(D.total, D.d + D.v * dt);

    const p = D.pts[k - 1], q = D.pts[k], seg = (D.cum[k] - D.cum[k - 1]) || 1, t = Math.min(1, (D.d - D.cum[k - 1]) / seg);
    const x = p[0] + (q[0] - p[0]) * t, z = p[1] + (q[1] - p[1]) * t, fx = (q[0] - p[0]) / seg, fz = (q[1] - p[1]) / seg;
    const id = D.ids[Math.min(D.ids.length - 1, k - 1)], vis = s.status[id] === 3;
    const C = target(S.board), bx = C.x - x, by = C.y - EYE, bz = C.z - z, bl = Math.hypot(bx, by, bz) || 1;
    // ننظر للأمام، ونلتفت بالقدر الذي يبقي اللوحة داخل الإطار (كما يفعل السائق بعينه)
    const vHalf = cam.fov * D2R / 2, hHalf = Math.atan(Math.tan(vHalf) * cam.aspect), yF = Math.atan2(fx, fz), yB = Math.atan2(bx, bz);
    let dl = yB - yF; while (dl > Math.PI) dl -= Math.PI * 2; while (dl < -Math.PI) dl += Math.PI * 2;
    const ahead = Math.abs(dl) < AHEAD_DEG * D2R; // الشرط نفسه في الحساب: اللوحة أمام السائق ضمن ±٦٠° من اتّجاه سيره
    if (vis && ahead && D.d < D.total) D.seen += dt;
    const allow = hHalf * 0.5; let yL = yF, pL = 0;
    if (Math.abs(dl) < 110 * D2R) {
      if (Math.abs(dl) > allow) yL = yB - Math.sign(dl) * allow;
      const pB = Math.atan2(by, Math.hypot(bx, bz)), pa = vHalf * 0.55; pL = Math.max(0, pB - pa);
    }
    let lx = Math.sin(yL) * Math.cos(pL), ly = Math.sin(pL), lz = Math.cos(yL) * Math.cos(pL);
    if (!D.look) D.look = [lx, ly, lz]; else { const kk = Math.min(1, dt * 4); D.look[0] += (lx - D.look[0]) * kk; D.look[1] += (ly - D.look[1]) * kk; D.look[2] += (lz - D.look[2]) * kk; }
    cam.position.set(x, EYE, z); cam.lookAt(x + D.look[0] * 50, EYE + D.look[1] * 50, z + D.look[2] * 50);
    D.vis = vis && ahead; D.side = vis && !ahead; D.distB = Math.hypot(bx, bz);
    if (now - D.lastHud > 120) { D.lastHud = now; renderHud(); syncState(); }
  }

  // ── الواجهة ──
  function renderHud() {
    const ui = S.ctx.ui, r = S.res; if (!r) return;
    if (S.drive) {
      const D = S.drive;
      ui.hud('<div class="bbh"><div class="k ' + (D.vis ? 'g' : (D.side ? 'y' : 'r')) + '"><span>' + (D.vis ? T('اللوحة في عينك', 'Board in view') : (D.side ? T('اللوحة خارج نظرك', 'Board out of view') : T('اللوحة محجوبة', 'Board hidden'))) + '</span><b>' + D.seen.toFixed(1) + '<small>' + T('ث', 's') + '</small></b></div>' +
        '<div class="k"><span>' + T('السرعة', 'Speed') + '</span><b>' + fmt(D.v * 3.6) + '<small>' + T('كم/س', 'km/h') + '</small></b></div>' +
        '<div class="k y"><span>' + T('المسافة للوحة', 'To board') + '</span><b>' + fmt(D.distB || 0) + '<small>' + T('م', 'm') + '</small></b></div></div>');
      return;
    }
    const br = r.bestRoad;
    ui.hud('<div class="bbh"><div class="k g"><span>' + T('طرق تشوف اللوحة', 'Road that sees it') + '</span><b>' + fmtLen(r.visibleRoadM).replace(/ (\S+)$/, '<small>$1</small>') + '</b></div>' +
      '<div class="k y"><span>' + T('يقرأها السائق', 'Driver reads it') + '</span><b>' + fmtSec(r.readingSec).replace(/ (\S+)$/, '<small>$1</small>') + '</b></div>' +
      '<div class="k"><span>' + T('أفضل مقطع', 'Best stretch') + '</span><b>' + (br ? fmtLen(br.lengthM).replace(/ (\S+)$/, '<small>$1</small>') : '—') + '</b><div class="s" dir="auto">' + (br ? esc(br.name) + ' · ' + toward(br.heading) : T('لا يوجد', 'none')) + '</div></div></div>');
  }
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function renderStats() {
    const r = S.res, U = S.ui; if (!r || !U.tab) return;
    const kinds = Object.keys(r.byKind).sort((a, b) => (r.byKind[b].s - r.byKind[a].s) || (r.byKind[b].m - r.byKind[a].m));
    const mx = (kinds.length && r.byKind[kinds[0]].s) || 1, hd = (t) => '<td style="color:#86a3aa">' + t + '</td>';
    U.tab.innerHTML = kinds.length ? '<tr>' + hd(T('نوع الشارع', 'Road type')) + hd(T('مرئيّ', 'Visible')) + hd(T('أطول قراءة', 'Longest read')) + '</tr>' + kinds.map((k) => '<tr><td>' + kindName(k) + ' <span style="color:#86a3aa">' + kmh(k) + T(' كم/س', ' km/h') + '</span><div class="bar" style="width:' + Math.max(4, 100 * r.byKind[k].s / mx).toFixed(0) + '%"></div></td><td>' + fmtLen(r.byKind[k].m) + '</td><td>' + fmtSec(r.byKind[k].s) + '</td></tr>').join('')
      : '<tr><td>' + T('ولا شارع يشوفها — جرّب ترفعها أو تلفّها.', 'No road sees it — raise or rotate it.') + '</td></tr>';
    const br = r.bestRoad;
    U.best.innerHTML = br ? T('أفضل مقطع: ', 'Best stretch: ') + '<b>' + esc(br.name) + '</b> ' + toward(br.heading) + ' — ' + fmtLen(br.lengthM) + ' · ' + fmtSec(br.seconds) + T(' بسرعة ', ' at ') + br.speedKmh + T(' كم/س', ' km/h') +
      T(' · بالاتّجاه المعاكس ', ' · opposite way ') + fmtSec(br.reverseSeconds)
      : T('ما فيه مقطع مرئيّ أمام سائق بعد.', 'No stretch sees it ahead yet.');
    const mountTxt = { ground: T('على عمود', 'on a pole'), roof: T('فوق سطح', 'on a roof'), facade: T('على واجهة', 'on a facade') }[S.board.mount];
    U.note.textContent = T('اللوحة ', 'Board ') + mountTxt + T(' · مدى القراءة ', ' · reading range ') + fmt(r.rangeM) + T(' م · ', ' m · ') + fmt(r.samples) + T(' نقطة فحص على الطرق كلّ ١٠ م', ' road checkpoints every 10 m');
    renderHud();
  }
  function syncSliders() {
    const U = S.ui, b = S.board; if (!U.w) return;
    U.w.value = b.w; U.h.value = b.h; U.e.value = b.elev; U.r.value = b.bearing;
    U.wv.textContent = b.w + ' ' + T('م', 'm'); U.hv.textContent = b.h + ' ' + T('م', 'm'); U.ev.textContent = b.elev + ' ' + T('م', 'm');
    U.rv.textContent = Math.round(b.bearing) + '° ' + card(b.bearing);
  }
  const pending = new Set();
  function later(fn) { // يجمع تحديثات المنزلقات في إطار واحد (بلا إسقاط أيّ منها)
    if (!pending.size) requestAnimationFrame(() => { const fs = [...pending]; pending.clear(); for (const f of fs) f(); });
    pending.add(fn);
  }

  function panel(ctx) {
    S.ctx = ctx;
    const p = ctx.ui.panel;
    const sl = (id, label, min, max, step) => '<label class="bb-sl"><span class="l"><span>' + label + '</span><b id="' + id + 'v"></b></span><input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '"></label>';
    p.innerHTML = '<div class="bb-hint">' + ICON.pin + '<span>' + T('اضغط على واجهة مبنى أو سطح أو أرض لتثبيت اللوحة هناك.', 'Tap a facade, roof or open ground to place the board.') + '</span></div>' +
      sl('bbw', T('العرض', 'Width'), 3, 40, 0.5) + sl('bbh', T('الارتفاع', 'Height'), 1.5, 20, 0.5) + sl('bbe', T('الارتفاع عن الأرض', 'Elevation'), 0, 200, 1) + sl('bbr', T('اتّجاه الواجهة', 'Facing'), 0, 359, 1) +
      '<div class="bb-btns"><button id="bbdrive" class="bb-gold">' + ICON.car + T('منظور السائق', 'Driver view') + '</button><button id="bbauto">' + ICON.compass + T('أفضل اتّجاه', 'Best facing') + '</button>' +
      '<button id="bbspot" class="ghost">' + ICON.spark + T('اقترح موقعًا', 'Suggest a spot') + '</button><button id="bbimg" class="ghost">' + ICON.img + T('صورة إعلانك', 'Your ad image') + '</button></div>' +
      '<input type="file" id="bbfile" accept="image/*" style="display:none">' +
      '<div class="bb-legend"><span><i style="background:linear-gradient(90deg,#a4ff3c,#12b866)"></i>' + T('مرئيّة', 'Visible') + '</span><span><i style="background:#ff4630"></i>' + T('محجوبة بمبنى', 'Blocked') + '</span><span><i style="background:#ffcf4a"></i>' + T('أفضل مقطع', 'Best stretch') + '</span><span><i style="background:rgba(94,245,156,.35)"></i>' + T('زاوية ±٧٠°', '±70° cone') + '</span></div>' +
      '<table class="bb-tab" id="bbtab"></table><div class="bb-best" id="bbbest"></div><div class="bb-note" id="bbnote"></div>' +
      '<div class="bb-note">' + T('السرعات: سريع ١٠٠ · شريانيّ ٨٠ · رئيسيّ ٦٠ · ثانويّ ٥٠ · غيرها ٤٠ كم/س. عين السائق ١٫٢ م، والزاوية من الزجاج حتّى ٣٥° للأعلى.', 'Speeds: motorway 100, trunk 80, primary 60, secondary 50, other 40 km/h. Driver eye 1.2 m; windscreen up to 35° above.') +
        T(' والثواني لسائق واحد باتّجاه سيره، وتُعدّ فقط واللوحة أمامه ضمن ±٦٠°.', ' Seconds are for one driver in one direction, counted only while the board is within ±60° ahead.') + '</div>';
    const $ = (id) => p.querySelector('#' + id);
    const U = S.ui; Object.assign(U, { w: $('bbw'), h: $('bbh'), e: $('bbe'), r: $('bbr'), wv: $('bbwv'), hv: $('bbhv'), ev: $('bbev'), rv: $('bbrv'), tab: $('bbtab'), best: $('bbbest'), note: $('bbnote'), drive: $('bbdrive') });
    syncSliders();
    const onSize = () => { const b = S.board; b.w = +U.w.value; b.h = +U.h.value; b.elev = Math.max(+U.e.value, b.mount === 'roof' ? Math.ceil(b.baseY) : 0); syncSliders(); if (!S.city) return; stopDrive(); later(rebuildAll); };
    U.w.addEventListener('input', onSize); U.h.addEventListener('input', onSize); U.e.addEventListener('input', onSize);
    U.r.addEventListener('input', () => { S.board.bearing = +U.r.value; syncSliders(); if (!S.city) return; stopDrive(); orient(); later(compute); });
    $('bbauto').addEventListener('click', () => { if (!S.city) return; stopDrive(); autoOrient(); orient(); compute(); syncSliders(); frameBoard(1.0); });
    $('bbspot').addEventListener('click', () => { if (!S.city) return; doSuggest(); });
    U.drive.addEventListener('click', () => { if (!S.city) return; S.drive ? stopDrive() : startDrive(); });
    const file = $('bbfile');
    $('bbimg').addEventListener('click', () => file.click());
    file.addEventListener('change', () => {
      const f = file.files && file.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => { const im = new Image(); im.onload = () => { S.img = im; if (S.ctx.city) { drawAd(); } ctx.ui.status(T('تمّ وضع صورتك على اللوحة.', 'Your image is on the board.')); }; im.onerror = () => ctx.ui.status(T('الصورة ما انقرت — جرّب ملفًّا آخر.', 'Could not read that image.')); im.src = fr.result; };
      fr.readAsDataURL(f); file.value = '';
    });
    // زرّ إيقاف عائم أثناء القيادة
    const stop = document.createElement('button'); stop.id = 'bbstop'; stop.innerHTML = ICON.stop + T('إنهاء منظور السائق', 'Exit driver view'); document.body.appendChild(stop);
    stop.addEventListener('click', stopDrive); U.stop = stop;
    // الالتقاط بالنقر: الضغط والرفع في مكان واحد تقريبًا (السحب للكاميرا لا يضع اللوحة)
    const dom = ctx.renderer.domElement, ptrs = new Set(); let down = null;
    dom.addEventListener('pointerdown', (e) => { ptrs.add(e.pointerId); down = ptrs.size === 1 ? { x: e.clientX, y: e.clientY, t: performance.now() } : null; S.anim = null; });
    const up = (e) => {
      ptrs.delete(e.pointerId); const d = down; down = null;
      if (!d || e.type !== 'pointerup' || S.drive || !S.city) return;
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 7 && performance.now() - d.t < 650) pickAt(e.clientX, e.clientY);
    };
    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
    window.addEventListener('resize', viewOffset); viewOffset();
    window.__billboard = { place: (o) => place(o), pickAt: (x, y) => pickAt(x, y), autoOrient: () => { autoOrient(); orient(); compute(); syncSliders(); return S.board.bearing; },
      suggest: () => doSuggest(), drive: startDrive, stop: stopDrive, frame: frameBoard, setImage: (src) => new Promise((res) => { const im = new Image(); im.onload = () => { S.img = im; drawAd(); res(true); }; im.onerror = () => res(false); im.src = src; }),
      set: (o) => { if (o.w != null) U.w.value = o.w; if (o.h != null) U.h.value = o.h; if (o.elev != null) U.e.value = o.elev; if (o.w != null || o.h != null || o.elev != null) U.w.dispatchEvent(new Event('input')); if (o.bearing != null) { U.r.value = o.bearing; U.r.dispatchEvent(new Event('input')); } },
      advance: (sec) => { const D = S.drive; if (!D) return 0; const n = Math.round(sec / 0.02); for (let k = 0; k < n && S.drive && !(D.d >= D.total); k++) stepDrive(0.02, performance.now()); renderHud(); syncState(); return +D.seen.toFixed(2); },
      flush: () => { drawAd(); buildBoard(); compute(); return window.__inspire_state; }, S };
  }
  const ray = { r: null, v: null };
  function pickAt(px, py) {
    const THREE = S.ctx.THREE, city = S.city;
    if (!ray.r) { ray.r = new THREE.Raycaster(); ray.v = new THREE.Vector2(); }
    ray.v.set(px / window.innerWidth * 2 - 1, -(py / window.innerHeight) * 2 + 1);
    ray.r.setFromCamera(ray.v, S.ctx.camera);
    const hit = ray.r.intersectObjects([city.buildingsMesh, city.ground], false)[0];
    if (!hit) return null;
    const P = hit.point;
    if (hit.object === city.buildingsMesh && hit.face) {
      const n = hit.face.normal;
      if (n.y > 0.7) { place({ x: P.x, z: P.z, mount: 'roof', baseY: P.y }); return 'roof'; }
      const L = Math.hypot(n.x, n.z) || 1, nx = n.x / L, nz = n.z / L, b = S.board;
      const elev = Math.max(0, Math.min(200, Math.round(P.y - b.h / 2)));
      place({ x: P.x + nx * 0.45, z: P.z + nz * 0.45, mount: 'facade', mnx: nx, mnz: nz, baseY: 0, elev });
      return 'facade';
    }
    place({ x: P.x, z: P.z, mount: 'ground', baseY: 0 }); return 'ground';
  }

  CK.start({ imagery: true,
    title: TITLE,
    sub: T('ثبّت لوحتك في حيّك الحقيقيّ، وشوف أيّ شوارع تشوفها وكم ثانية يقرأها السائق.', 'Place a billboard in your real neighbourhood and see which streets see it, and for how long.'),
    shadows: true,
    panel,
    onCity(ctx, city) {
      S.ctx = ctx; S.city = city; S.loads++;
      if (S.drive) { S.drive = null; ctx.orbit.enabled = true; ctx.camera.fov = 50; ctx.camera.updateProjectionMatrix(); ctx.ui.box.style.display = ''; if (S.ui.stop) S.ui.stop.style.display = 'none'; if (S.ui.drive) S.ui.drive.innerHTML = ICON.car + T('منظور السائق', 'Driver view'); }
      S.objs = {}; S.anim = null; S.res = null; S.losKey = ''; S.lastDrive = 0;
      S.smp = sampleRoads(city, ctx.R); S.los = new Uint8Array(S.smp.N);
      buildOverlay(); drawAd();
      const b = S.board; b.mount = 'ground'; b.baseY = 0; b.x = 0; b.z = 0;
      if (!doSuggest(true)) { place({ x: 0, z: 0, mount: 'ground', baseY: 0 }, true); }
      viewOffset(); frameBoard(0); ctx.orbit.dist = Math.min(ctx.orbit.max, ctx.orbit.dist * 1.6); ctx.orbit.apply(); frameBoard(2.2);
      let tt = 0;
      ctx.onFrame((dt, now) => {
        tt += dt;
        if (S.drive) stepDrive(dt, now); else stepAnim(dt);
        if (S.objs.ring) { const k = 1 + 0.25 * Math.sin(tt * 3); S.objs.ring.scale.set(k, k, k); S.objs.glow.material.opacity = 0.14 + 0.1 * Math.sin(tt * 3); }
        if (S.objs.rays) S.objs.rays.material.opacity = 0.26 + 0.1 * Math.sin(tt * 2.2);
      });
    },
  });
})();
</script></body></html>
