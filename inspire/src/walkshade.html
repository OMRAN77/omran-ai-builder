</head><body><script>
(function () {
  'use strict';
  const CK = window.CityKit, T = CK.T;
  const SNAP = 2, STEP = 8, EYE = 1.6, WALK_MPM = 5000 / 60; // ٥ كم/س
  const NO_WALK = { motorway: 1 };
  const C_SHADY = 0x14d4c4, C_SHORT = 0xff7a2f;
  const RGB_SHADE = [0.2, 0.3, 0.53], RGB_SUN = [1.0, 0.86, 0.48];
  const PAIRS = [[[-0.6, 0.45], [0.6, -0.45]], [[-0.7, -0.22], [0.66, 0.26]], [[0.18, 0.7], [-0.12, -0.7]]];
  const S = { gen: 0, jg: 0, loads: 0, hour: 12, day: 'today', map: true, job: null, ready: false, a: -1, b: -1, res: null, pair: 0 };
  let X = null, THREE = null;
  const UI = {}, MAT = {};

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function segDist(px, pz, ax, az, bx, bz) {
    const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz;
    const t = L2 ? clamp(((px - ax) * dx + (pz - az) * dz) / L2, 0, 1) : 0;
    return Math.hypot(ax + dx * t - px, az + dz * t - pz);
  }

  // ── كومة ثنائيّة صغرى لـDijkstra ──
  class Heap {
    constructor() { this.k = []; this.v = []; this.top = 0; }
    get size() { return this.k.length; }
    push(key, val) {
      const K = this.k, V = this.v; let i = K.length; K.push(key); V.push(val);
      while (i > 0) { const p = (i - 1) >> 1; if (K[p] <= key) break; K[i] = K[p]; V[i] = V[p]; i = p; }
      K[i] = key; V[i] = val;
    }
    pop() {
      const K = this.k, V = this.v, top = V[0]; this.top = K[0];
      const lk = K.pop(), lv = V.pop(), n = K.length;
      if (n) {
        let i = 0;
        for (;;) { let c = 2 * i + 1; if (c >= n) break; if (c + 1 < n && K[c + 1] < K[c]) c++; if (K[c] >= lk) break; K[i] = K[c]; V[i] = V[c]; i = c; }
        K[i] = lk; V[i] = lv;
      }
      return top;
    }
  }

  // ── شبكة المشي: تقطيع الطرق عند تقاطعاتها + دمج الأطراف المتقاربة (٢ م) ──
  function buildGraph(roads, R) {
    const ax = [], az = [], bx = [], bz = [], sw = [];
    const lim = R * 1.08;
    for (const r of roads) {
      if (NO_WALK[r.kind]) continue;
      for (let i = 0; i < r.pts.length - 1; i++) {
        const p = r.pts[i], q = r.pts[i + 1];
        if (Math.hypot(q[0] - p[0], q[1] - p[1]) < 0.05) continue;
        if (segDist(0, 0, p[0], p[1], q[0], q[1]) > lim) continue;
        ax.push(p[0]); az.push(p[1]); bx.push(q[0]); bz.push(q[1]); sw.push(r.w);
      }
    }
    const N = ax.length, sp = new Array(N);
    for (let i = 0; i < N; i++) sp[i] = [0, 1];
    const C = 48, grid = new Map(), K = (i, j) => i * 65536 + j;
    for (let s = 0; s < N; s++) {
      const i0 = Math.floor((Math.min(ax[s], bx[s]) - SNAP) / C), i1 = Math.floor((Math.max(ax[s], bx[s]) + SNAP) / C);
      const j0 = Math.floor((Math.min(az[s], bz[s]) - SNAP) / C), j1 = Math.floor((Math.max(az[s], bz[s]) + SNAP) / C);
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) { const k = K(i, j); let l = grid.get(k); if (!l) grid.set(k, (l = [])); l.push(s); }
    }
    let inters = 0;
    const endSnap = (s, t) => { // طرف s قريب من جسم t ← نقطة قطع على t
      const qx = ax[t], qz = az[t], dx = bx[t] - qx, dz = bz[t] - qz, L2 = dx * dx + dz * dz;
      for (let e = 0; e < 2; e++) {
        const px = e ? bx[s] : ax[s], pz = e ? bz[s] : az[s];
        const u = clamp(((px - qx) * dx + (pz - qz) * dz) / L2, 0, 1);
        if (Math.hypot(qx + dx * u - px, qz + dz * u - pz) < SNAP) sp[t].push(u);
      }
    };
    const mark = new Int32Array(N).fill(-1);
    for (let s = 0; s < N; s++) {
      const i0 = Math.floor((Math.min(ax[s], bx[s]) - SNAP) / C), i1 = Math.floor((Math.max(ax[s], bx[s]) + SNAP) / C);
      const j0 = Math.floor((Math.min(az[s], bz[s]) - SNAP) / C), j1 = Math.floor((Math.max(az[s], bz[s]) + SNAP) / C);
      const px = ax[s], pz = az[s], rx = bx[s] - px, rz = bz[s] - pz, Ls = Math.hypot(rx, rz);
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
        const l = grid.get(K(i, j)); if (!l) continue;
        for (const t of l) {
          if (t <= s || mark[t] === s) continue; mark[t] = s;
          const qx = ax[t], qz = az[t], sx = bx[t] - qx, sz = bz[t] - qz, Lt = Math.hypot(sx, sz);
          const den = rx * sz - rz * sx;
          if (Math.abs(den) > 1e-9 * Ls * Lt) {
            const wx = qx - px, wz = qz - pz, u = (wx * sz - wz * sx) / den, v = (wx * rz - wz * rx) / den;
            const es = SNAP / Ls, et = SNAP / Lt;
            if (u >= -es && u <= 1 + es && v >= -et && v <= 1 + et) {
              sp[s].push(clamp(u, 0, 1)); sp[t].push(clamp(v, 0, 1));
              if (u > 1e-6 && u < 1 - 1e-6 && v > 1e-6 && v < 1 - 1e-6) inters++;
            }
          }
          endSnap(s, t); endSnap(t, s);
        }
      }
    }
    // العقد: كلّ نقطة قطع ← عقدة، وما يقع ضمن ٢ م من عقدة قائمة يُدمج فيها
    const nx = [], nz = [], ng = new Map(), G4 = 4;
    const node = (x, z) => {
      const i = Math.floor(x / G4), j = Math.floor(z / G4); let best = -1, bd = SNAP * SNAP;
      for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
        const l = ng.get(K(i + di, j + dj)); if (!l) continue;
        for (const n of l) { const d = (nx[n] - x) ** 2 + (nz[n] - z) ** 2; if (d < bd) { bd = d; best = n; } }
      }
      if (best >= 0) return best;
      const id = nx.length; nx.push(x); nz.push(z);
      const k = K(i, j); let l = ng.get(k); if (!l) ng.set(k, (l = [])); l.push(id);
      return id;
    };
    const ea = [], eb = [], ew = [], seen = new Set();
    for (let s = 0; s < N; s++) {
      const ts = sp[s].sort((p, q) => p - q), rx = bx[s] - ax[s], rz = bz[s] - az[s];
      let prev = -1, lastT = -1;
      for (const t of ts) {
        if (t - lastT < 1e-7) continue; lastT = t;
        const n = node(ax[s] + rx * t, az[s] + rz * t);
        if (prev >= 0 && n !== prev) {
          const key = prev < n ? prev * 4194304 + n : n * 4194304 + prev;
          if (!seen.has(key)) { seen.add(key); ea.push(prev); eb.push(n); ew.push(sw[s]); }
        }
        prev = n;
      }
    }
    const n = nx.length, E = ea.length;
    const G = { n, E, nx: Float64Array.from(nx), nz: Float64Array.from(nz), ea: Int32Array.from(ea), eb: Int32Array.from(eb), ew: Float32Array.from(ew), elen: new Float64Array(E), segs: N, inters };
    for (let e = 0; e < E; e++) G.elen[e] = Math.hypot(G.nx[G.eb[e]] - G.nx[G.ea[e]], G.nz[G.eb[e]] - G.nz[G.ea[e]]);
    // مجاورة مضغوطة (CSR)
    const deg = new Int32Array(n + 1);
    for (let e = 0; e < E; e++) { deg[G.ea[e]]++; deg[G.eb[e]]++; }
    G.adjS = new Int32Array(n + 1); for (let i = 0; i < n; i++) G.adjS[i + 1] = G.adjS[i] + deg[i];
    G.adjE = new Int32Array(2 * E); G.adjT = new Int32Array(2 * E);
    const fill = G.adjS.slice(0, n);
    for (let e = 0; e < E; e++) {
      const a = G.ea[e], b = G.eb[e];
      G.adjE[fill[a]] = e; G.adjT[fill[a]++] = b; G.adjE[fill[b]] = e; G.adjT[fill[b]++] = a;
    }
    // المكوّنات المترابطة: نلتقط النقاط من أكبرها فقط
    G.comp = new Int32Array(n).fill(-1); let big = -1, bigN = 0, cc = 0; const stack = [];
    for (let i = 0; i < n; i++) {
      if (G.comp[i] >= 0) continue; let cnt = 0; G.comp[i] = cc; stack.push(i);
      while (stack.length) { const u = stack.pop(); cnt++; for (let j = G.adjS[u]; j < G.adjS[u + 1]; j++) { const v = G.adjT[j]; if (G.comp[v] < 0) { G.comp[v] = cc; stack.push(v); } } }
      if (cnt > bigN) { bigN = cnt; big = cc; } cc++;
    }
    G.big = big; G.bigN = bigN; G.comps = cc;
    return G;
  }

  function buildSamples(G) {
    const start = new Int32Array(G.E + 1);
    for (let e = 0; e < G.E; e++) start[e + 1] = start[e] + Math.max(1, Math.ceil(G.elen[e] / STEP));
    const M = start[G.E], x = new Float32Array(M), z = new Float32Array(M);
    for (let e = 0; e < G.E; e++) {
      const a = G.ea[e], b = G.eb[e], n = start[e + 1] - start[e];
      for (let k = 0; k < n; k++) { const t = (k + 0.5) / n; x[start[e] + k] = G.nx[a] + (G.nx[b] - G.nx[a]) * t; z[start[e] + k] = G.nz[a] + (G.nz[b] - G.nz[a]) * t; }
    }
    return { M, start, x, z };
  }

  function buildOverlay(G, smp) {
    const pos = new Float32Array(smp.M * 18), col = new Float32Array(smp.M * 18), y = 0.32;
    let q = 0;
    for (let e = 0; e < G.E; e++) {
      const a = G.ea[e], b = G.eb[e], x0 = G.nx[a], z0 = G.nz[a], x1 = G.nx[b], z1 = G.nz[b], L = G.elen[e] || 1;
      const n = smp.start[e + 1] - smp.start[e], hw = clamp(G.ew[e] * 0.3, 1.1, 3.4), px = -(z1 - z0) / L * hw, pz = (x1 - x0) / L * hw;
      for (let k = 0; k < n; k++) {
        const t0 = k / n, t1 = (k + 1) / n, sx = x0 + (x1 - x0) * t0, sz = z0 + (z1 - z0) * t0, ex = x0 + (x1 - x0) * t1, ez = z0 + (z1 - z0) * t1;
        const v = [sx + px, sz + pz, sx - px, sz - pz, ex - px, ez - pz, sx + px, sz + pz, ex - px, ez - pz, ex + px, ez + pz];
        for (let i = 0; i < 6; i++) { pos[q++] = v[i * 2]; pos[q++] = y; pos[q++] = v[i * 2 + 1]; }
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.computeBoundingSphere();
    return new THREE.Mesh(g, MAT.overlay);
  }

  function dijkstra(G, src, dst, w) {
    const dist = new Float64Array(G.n).fill(Infinity), pe = new Int32Array(G.n).fill(-1), h = new Heap();
    dist[src] = 0; h.push(0, src);
    while (h.size) {
      const u = h.pop(), d = h.top;
      if (d > dist[u]) continue;
      if (u === dst) break;
      for (let j = G.adjS[u]; j < G.adjS[u + 1]; j++) {
        const e = G.adjE[j], v = G.adjT[j], nd = d + w[e];
        if (nd < dist[v]) { dist[v] = nd; pe[v] = e; h.push(nd, v); }
      }
    }
    if (!isFinite(dist[dst])) return null;
    const nodes = [dst], edges = []; let u = dst;
    while (u !== src) { const e = pe[u]; edges.push(e); u = G.ea[e] === u ? G.eb[e] : G.ea[e]; nodes.push(u); }
    nodes.reverse(); edges.reverse();
    let len = 0, sunM = 0, shadyCost = 0;
    for (const e of edges) { len += G.elen[e]; sunM += G.elen[e] * S.frac[e]; shadyCost += G.elen[e] * (1 + 2 * S.frac[e]); }
    const pts = nodes.map((i) => [G.nx[i], G.nz[i]]);
    return { nodes, edges, pts, len, sunM, shadyCost, shadePct: len ? 100 * (1 - sunM / len) : 100, min: len / WALK_MPM, sunMin: sunM / WALK_MPM };
  }

  // ── الشمس ──
  function dayBase() {
    const n = new Date(), Y = n.getFullYear();
    const south = !!(S.city && S.city.lat < 0); // «عزّ الصيف»/«الشتاء» ينقلبان جنوب خطّ الاستواء
    if (S.day === 'summer') return Date.UTC(Y, south ? 11 : 5, 21);
    if (S.day === 'winter') return Date.UTC(Y, south ? 5 : 11, 21);
    return Date.UTC(Y, n.getMonth(), n.getDate());
  }
  function sunNow() { const c = S.city; return CK.sunDir(c.lat, c.lon, dayBase() + (S.hour - S.tz) * 3600000); }
  const SKY_HI = [0.75, 0.85, 0.9], SKY_LO = [0.96, 0.8, 0.64], SKY_NIGHT = [0.17, 0.21, 0.31];
  function sunVisual(sd) {
    const R = X.R, alt = sd.alt, up = Math.max(alt, 0.07), ca = Math.cos(alt) || 1;
    const hx = sd.x / ca, hz = sd.z / ca, D = R * 1.6;
    X.sun.position.set(hx * Math.cos(up) * D, Math.sin(up) * D, hz * Math.cos(up) * D);
    X.sun.target.position.set(0, 0, 0);
    const k = clamp(Math.sin(alt) / 0.5, 0, 1), day = alt > 0;
    X.sun.intensity = day ? 0.6 + 1.05 * k : 0.06;
    X.sun.color.setRGB(1, 0.76 + 0.24 * k, 0.55 + 0.45 * k);
    X.hemi.intensity = day ? 0.62 - 0.12 * k : 0.35;
    const m = day ? k : 0, n = day ? 0 : clamp(-alt / 0.1, 0, 1), c = [0, 0, 0];
    for (let i = 0; i < 3; i++) c[i] = (SKY_LO[i] + (SKY_HI[i] - SKY_LO[i]) * m) * (1 - n) + SKY_NIGHT[i] * n;
    X.scene.background.setRGB(c[0], c[1], c[2]); if (X.scene.fog) X.scene.fog.color.setRGB(c[0], c[1], c[2]);
    if (S.disc) { S.disc.visible = alt > -0.03; S.disc.position.set(hx * Math.cos(up) * R * 3.4, Math.sin(alt) * R * 3.4, hz * Math.cos(up) * R * 3.4); }
  }
  const DIRS_AR = ['الشمال', 'الشمال الشرقيّ', 'الشرق', 'الجنوب الشرقيّ', 'الجنوب', 'الجنوب الغربيّ', 'الغرب', 'الشمال الغربيّ'];
  const DIRS_EN = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
  function sunText(sd) {
    const deg = sd.alt * 180 / Math.PI;
    if (deg <= 0.5) return T('الشمس تحت الأفق في هذا الوقت', 'The sun is below the horizon');
    const az = ((sd.az * 180 / Math.PI) % 360 + 360) % 360, d = Math.round(az / 45) % 8;
    const sh = Math.round(30 / Math.tan(sd.alt));
    return T('ارتفاع الشمس ', 'Sun ') + Math.round(deg) + '° · ' + T('من ', 'from ') + (CK.AR ? DIRS_AR[d] : DIRS_EN[d]) + ' · ' + T('ظلّ عمارة 30 م يمتدّ ', 'a 30 m block casts ') + (sh > 999 ? '999+' : sh) + T(' م', ' m');
  }

  // ── حساب الظلّ: نقطة كلّ ٨ م × خطّ رؤية نحو الشمس، على دفعات حتّى لا تتجمّد الواجهة ──
  function recompute() {
    const jg = ++S.jg, G = S.G, smp = S.smp;
    if (!G || !G.E) { S.ready = true; return Promise.resolve(false); }
    S.ready = false;
    const sd = S.sun = sunNow(); sunVisual(sd);
    const sunlit = S.sunlit, M = smp.M, t0 = performance.now(), idx = S.city.idx;
    const p = new Promise((res) => {

    MAT.shady = new THREE.MeshBasicMaterial({ color: C_SHADY, side: THREE.DoubleSide });
    MAT.short = new THREE.MeshBasicMaterial({ color: C_SHORT, side: THREE.DoubleSide });
    MAT.shadyEdge = new THREE.MeshBasicMaterial({ color: 0x04302d, side: THREE.DoubleSide, transparent: true, opacity: 0.6, depthWrite: false });
    MAT.shortEdge = new THREE.MeshBasicMaterial({ color: 0x3a1503, side: THREE.DoubleSide, transparent: true, opacity: 0.6, depthWrite: false });
    MAT.shadyGhost = new THREE.MeshBasicMaterial({ color: C_SHADY, side: THREE.DoubleSide, transparent: true, opacity: 0.38, depthTest: false, depthWrite: false });
    MAT.shortGhost = new THREE.MeshBasicMaterial({ color: C_SHORT, side: THREE.DoubleSide, transparent: true, opacity: 0.3, depthTest: false, depthWrite: false });
    MAT.shadyDot = new THREE.MeshBasicMaterial({ color: 0xc8fff9 });
    MAT.shortDot = new THREE.MeshBasicMaterial({ color: 0xffe0c8 });
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const g2 = cv.getContext('2d'), gr = g2.createRadialGradient(64, 64, 4, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,240,1)'); gr.addColorStop(0.18, 'rgba(255,240,190,.95)'); gr.addColorStop(0.42, 'rgba(255,210,130,.35)'); gr.addColorStop(1, 'rgba(255,200,120,0)');
    g2.fillStyle = gr; g2.fillRect(0, 0, 128, 128);
    MAT.disc = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), fog: false, depthWrite: false, transparent: true });

    const p = ctx.ui.panel;
    p.innerHTML =
      '<div class="ws-step"><i id="wsN">1</i><span id="wsT"></span></div>' +
      '<div class="ws-time"><span>' + SUN_SVG + T('الوقت المحلّيّ', 'Local time') + '</span><b id="wsClock">12:00</b></div>' +
      '<input type="range" id="wsHour" min="6" max="18" step="0.25" value="12" aria-label="' + T('الوقت', 'Time') + '">' +
      '<div class="ws-ticks"><span>' + T('6 صباحًا', '6 AM') + '</span><span>' + T('الظهر', 'Noon') + '</span><span>' + T('6 مساءً', '6 PM') + '</span></div>' +
      '<div class="ws-sun" id="wsSun"></div>' +
      '<div class="ws-seg" id="wsDay"><button data-d="today">' + T('اليوم', 'Today') + '</button><button data-d="summer">' + T('عزّ الصيف', 'Midsummer') + '</button><button data-d="winter">' + T('الشتاء', 'Winter') + '</button></div>' +
      '<div class="ck-row ws-btns"><button id="wsAuto">' + T('اقترح مسارًا', 'Suggest a route') + '</button><button class="ghost" id="wsSwap">' + T('اعكس', 'Reverse') + '</button><button class="ghost" id="wsClear">' + T('مسح', 'Clear') + '</button></div>' +
      '<div class="ws-cards"><div class="ws-card" id="wsCS" style="--c:#14d4c4"></div><div class="ws-card" id="wsCL" style="--c:#ff7a2f"></div></div>' +
      '<div class="ws-leg"><span>' + T('شارع في الظلّ', 'Shaded street') + '</span><div class="ws-bar"></div><span>' + T('في الشمس', 'In sun') + '</span></div>' +
      '<label class="ws-chk"><input type="checkbox" id="wsMap" checked>' + T('لوّن الشوارع حسب الظلّ', 'Colour streets by shade') + '</label>' +
      '<div class="ws-net" id="wsNet"></div>';
    const $ = (id) => p.querySelector('#' + id);
    Object.assign(UI, { stepN: $('wsN'), stepT: $('wsT'), clock: $('wsClock'), hour: $('wsHour'), sun: $('wsSun'), day: $('wsDay'), cShady: $('wsCS'), cShort: $('wsCL'), map: $('wsMap'), net: $('wsNet') });
    setDayBtn();
    let deb = 0;
    const live = () => { UI.clock.textContent = clock(S.hour); if (S.city) { const sd = sunNow(); sunVisual(sd); UI.sun.textContent = sunText(sd); } };
    UI.hour.addEventListener('input', () => { S.hour = +UI.hour.value; live(); clearTimeout(deb); deb = setTimeout(() => { if (S.city) recompute(); }, 160); });
    UI.hour.addEventListener('change', () => { clearTimeout(deb); S.hour = +UI.hour.value; live(); if (S.city) recompute(); });
    UI.day.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.day = b.dataset.d; setDayBtn(); live(); if (S.city) recompute(); });
    $('wsAuto').addEventListener('click', () => { if (!S.G) return; S.pair = (S.pair + 1) % PAIRS.length; setPair(S.pair); routeNow(true); });
    $('wsSwap').addEventListener('click', () => { if (S.a < 0 || S.b < 0) return; const t = S.a; S.a = S.b; S.b = t; routeNow(false); });
    $('wsClear').addEventListener('click', () => { S.a = S.b = -1; S.res = null; drawRoutes(); updatePins(); render(); writeState(); });
    UI.map.addEventListener('change', () => { S.map = UI.map.checked; if (S.overlay) S.overlay.visible = S.map; });
    // لمسة قصيرة تختار نقطة؛ السحب والقرص للكاميرا
    const dom = ctx.renderer.domElement, ptrs = new Set(); let down = null;
    dom.addEventListener('pointerdown', (e) => { ptrs.add(e.pointerId); S.fly = null; down = ptrs.size === 1 && e.button === 0 ? { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), moved: false } : null; });
    dom.addEventListener('pointermove', (e) => { if (down && e.pointerId === down.id && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 7) down.moved = true; });
    dom.addEventListener('pointerup', (e) => { ptrs.delete(e.pointerId); if (down && e.pointerId === down.id && !down.moved && performance.now() - down.t < 700) pickAt(e.clientX, e.clientY); down = null; });
    dom.addEventListener('pointercancel', (e) => { ptrs.delete(e.pointerId); down = null; });
    window.addEventListener('resize', layout);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(ctx.ui.box);
    layout(); live(); render();
    // واجهة للاختبار
    const idle = async () => { let j; while ((j = S.job)) { await j; if (S.job === j) break; } return window.__inspire_state; };
    window.__walkshade = {
      idle,
      setHour: (h) => { S.hour = clamp(+h, 6, 18); UI.hour.value = S.hour; live(); recompute(); return idle(); },
      setDay: (d) => { S.day = d; setDayBtn(); live(); recompute(); return idle(); },
      route: (ax, az, bx, bz) => { S.a = nearestNode(ax, az); S.b = nearestNode(bx, bz); routeNow(true); return idle(); },
      suggest: (i) => { S.pair = i | 0; setPair(S.pair); routeNow(true); return idle(); },
      tapWorld: (x, z) => { const v = new THREE.Vector3(x, 0, z).project(X.camera); return pickAt((v.x + 1) / 2 * window.innerWidth, (1 - v.y) / 2 * window.innerHeight); },
      flyDone: () => new Promise((res) => { const w = () => (S.fly ? setTimeout(w, 50) : res(true)); w(); }),
    };
  }

  async function onCity(ctx, city) {
    S.gen++; S.jg++; S.loads++;
    S.city = city; S.a = S.b = -1; S.res = null; S.fly = null; S.walk = null; S.ready = false; S.firstFly = true; S.wantFly = false;
    S.maxH = city.buildings.length ? city.buildings[0].h : 0;
    S.tz = Math.round(city.lon / 15);
    S.G = buildGraph(city.roads, ctx.R);
    S.smp = buildSamples(S.G);
    S.sunlit = new Uint8Array(S.smp.M); S.frac = new Float32Array(S.G.E); S.netShade = 0;
    S.overlay = null;
    if (S.smp.M) { S.overlay = buildOverlay(S.G, S.smp); S.overlay.visible = S.map; city.group.add(S.overlay); }
    S.routeGroup = new THREE.Group(); city.group.add(S.routeGroup);
    S.pinA = makePin(0x39e58c); S.pinB = makePin(0xff4d6d); city.group.add(S.pinA.g, S.pinB.g);
    S.disc = new THREE.Sprite(MAT.disc); S.disc.scale.set(ctx.R * 0.45, ctx.R * 0.45, 1); city.group.add(S.disc);
    ctx.onFrame(tick);
    UI.sun.textContent = sunText(sunNow());
    if (!S.G.E) { UI.net.textContent = T('ما لقيت شوارع مشي هنا — جرّب مكانًا ثانيًا.', 'No walkable streets here — try another place.'); render(); writeState(); return; }
    S.pair = 0; setPair(0); S.wantFly = true; render();
    await recompute();
  }

  CK.start({
    title: T('أبرد طريق ظهرًا', 'Coolest walk at noon'),
    sub: T('اضغط بدايتك ونهايتك وحرّك الساعة: نظلّل كلّ شارع بالشمس الحقيقيّة ونعطيك أبرد طريق مشي.', 'Tap a start and an end, slide the clock: every street is shaded by the real sun and you get the coolest walk.'),
    shadows: true, panel, onCity,
  });
})();
</script></body></html>
