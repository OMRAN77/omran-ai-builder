<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>سباق الدرون بين الأبراج</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<!--CITYKIT-->
</head><body><script>
/* سباق الدرون بين الأبراج — حلقات مضيئة بين أطول المباني الحقيقيّة على ٦٠٪ من ارتفاعها، فيزياء طيران مبسّطة
   (دفع + سحب + تسوية تلقائيّة + تثبيت ارتفاع)، لوحة مفاتيح وعصوان للّمس، مؤقّت وأفضل وقت، وطيّار تلقائيّ يرسم المسار الآمن. */
(function () {
  'use strict';
  const CK = window.CityKit, T = CK.T;
  const G = 9.81, TILT = 0.62, LIFT = 10, VDAMP = 1.6, C1 = 0.08, INTRO = 4.2, HSTEP = 1 / 60, APP = 16;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const wrap = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  const fmt = (t) => { if (t == null || !isFinite(t)) return '—'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
  const c2For = (kmh) => { const v = kmh / 3.6; return Math.max(0.0005, (G * Math.tan(TILT) - C1 * v) / (v * v)); };
  const TOUCH = !!((window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0 || 'ontouchstart' in window);

  let ctx = null, THREE = null, S = null, C2 = c2For(110), TEX = null, EUL = null, UPV = null, FPVQ = null;
  const opts = { rings: 8, vmax: 110, cam: 'chase' };
  const keys = new Set();
  const stk = { l: { x: 0, y: 0 }, r: { x: 0, y: 0 } };
  const UI = {};

  const CSS = `
  .ck-ui h1{padding-left:36px}
  .dr-tog{position:absolute;top:10px;left:10px;width:28px;height:28px;padding:0!important;display:grid;place-items:center;background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:8px!important}
  .dr-tog svg{transition:transform .2s}
  .ck-ui.dr-min{padding:9px 14px}
  .ck-ui.dr-min>*:not(h1):not(.dr-tog){display:none}
  .ck-ui.dr-min h1{margin:0}
  .ck-ui.dr-min .dr-tog svg{transform:rotate(180deg)}
  .dr-course{margin:4px 0 8px;padding:8px 10px;border-radius:10px;background:linear-gradient(135deg,rgba(255,200,90,.13),rgba(31,138,147,.12));border:1px solid rgba(255,214,120,.22);font-size:13px;color:#e9dcc0}
  .dr-course b{color:#ffd36b;font-variant-numeric:tabular-nums}
  .dr-seg{display:flex;gap:4px;background:#0d1a20;border:1px solid #2b4650;border-radius:10px;padding:3px;margin-top:4px}
  .dr-seg button{flex:1;background:transparent!important;color:#a9c1c7!important;padding:5px 4px!important;font-size:13px!important;border-radius:7px!important}
  .dr-seg button.on{background:#1f8a93!important;color:#fff!important}
  .ck-ui button.dr-go{background:linear-gradient(135deg,#ffb238,#ff7a1a);color:#1a1006;font-weight:700}
  .dr-keys{margin-top:8px;font-size:12px;color:#a9c1c7;line-height:2}
  .dr-keys kbd{display:inline-block;min-width:18px;padding:0 5px;border:1px solid #3a5763;border-bottom-width:2px;border-radius:5px;background:#0d1a20;color:#e8f1f3;font:600 11px/17px system-ui,sans-serif;text-align:center;margin:0 1px}
  .dh{background:linear-gradient(160deg,rgba(9,16,28,.78),rgba(9,16,28,.52));border:1px solid rgba(255,214,120,.25);border-radius:16px;padding:10px 14px;min-width:270px;backdrop-filter:blur(6px);text-shadow:none;box-shadow:0 8px 28px rgba(0,0,0,.3)}
  .dh-l{font-size:11.5px;color:#9fb6c8;font-weight:500}
  .dh-t{font:700 44px/1.05 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#ffd36b;direction:ltr;text-align:right;letter-spacing:.5px}
  .dh-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}
  .dh-bar s{display:block;height:100%;width:0;background:linear-gradient(270deg,#ffd36b,#ff7a1a);transition:width .3s}
  .dh-g{display:grid;grid-template-columns:repeat(5,auto);gap:2px 14px;margin-top:8px}
  .dh-g div{display:flex;flex-direction:column;min-width:0}
  .dh-g i{font-style:normal;font-size:11px;color:#9fb6c8;font-weight:500;white-space:nowrap}
  .dh-g b{font-size:21px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dh-g u{text-decoration:none;font-size:11px;color:#9fb6c8;font-weight:500;margin-inline-start:2px}
  .dh-best{margin-top:6px;font-size:12px;color:#c9d7e2;font-weight:500}
  .dh-best b{color:#7dffbe;font-variant-numeric:tabular-nums}
  .dr-msg{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.96);z-index:4;max-width:92vw;pointer-events:none;text-align:center;font:800 40px/1.2 "IBM Plex Sans Arabic",Tahoma,sans-serif;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.65);opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap}
  .dr-msg small{display:block;font-size:16px;font-weight:600;color:#ffe2a8;margin-top:4px}
  .dr-msg.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .dr-msg.bad{color:#ff6b5b}.dr-msg.gold{color:#ffd36b}
  .dr-map{position:fixed;left:14px;bottom:14px;z-index:4;width:168px;height:168px;border-radius:50%;border:1px solid rgba(255,214,120,.4);box-shadow:0 6px 24px rgba(0,0,0,.35);pointer-events:none}
  .dr-stick{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(10,20,30,.42) 70%);border:1.5px solid rgba(255,255,255,.3);touch-action:none;user-select:none;-webkit-user-select:none}
  .dr-stick.l{left:16px}.dr-stick.r{right:16px}
  .dr-stick:before,.dr-stick:after{content:"";position:absolute;background:rgba(255,255,255,.18)}
  .dr-stick:before{left:50%;top:14px;bottom:14px;width:1px}.dr-stick:after{top:50%;left:14px;right:14px;height:1px}
  .dr-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7e0,#ffc94a 45%,#c97a12);box-shadow:0 4px 14px rgba(0,0,0,.45);pointer-events:none;z-index:1}
  .dr-stick span{position:absolute;top:-22px;left:-10px;right:-10px;text-align:center;font:600 11.5px "IBM Plex Sans Arabic",Tahoma,sans-serif;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;white-space:nowrap}
  @media (max-width:640px){
    body .ck-ui{top:8px;bottom:auto;left:8px;right:8px;width:auto;max-height:46vh}
    body .ck-hud{top:60px;left:8px;right:8px}
    .dh{min-width:0;padding:7px 10px;border-radius:13px}
    .dh-t{font-size:27px}
    .dh-g{grid-template-columns:repeat(5,1fr);gap:0 6px;margin-top:5px}
    .dh-g b{font-size:16px}.dh-g i,.dh-g u{font-size:10px}
    .dr-map{display:none}
    .dr-msg{font-size:24px;top:62%;white-space:normal;width:max-content}.dr-msg small{font-size:13px}
  }`;

  // ── أدوات رسم صغيرة ──
  function glowTex() {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.65)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  function labelTex(txt, col) {
    const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    g.beginPath(); g.arc(64, 64, 54, 0, Math.PI * 2); g.fillStyle = 'rgba(10,18,30,.82)'; g.fill();
    g.lineWidth = 7; g.strokeStyle = col; g.stroke();
    g.fillStyle = '#fff'; g.font = 'bold 62px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 64, 68);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  }
  const add = (mat) => Object.assign(mat, { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });

  // ── مرّة واحدة: المظهر والواجهة والمدخلات ──
  function setupOnce(c) {
    ctx = c; THREE = c.THREE; TEX = glowTex();
    EUL = new THREE.Euler(); UPV = new THREE.Vector3(); FPVQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), 0.32);
    const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
    const R = c.R;
    // سماء الغروب: قبّة متدرّجة + وهج الشمس، وضباب بلون الأفق
    c.scene.background = new THREE.Color(0x8fa4c8);
    c.scene.fog.color.setHex(0xcab4a6); c.scene.fog.near = R * 1.1; c.scene.fog.far = R * 3.8;
    c.sun.position.set(-R * 0.85, R * 0.6, R * 0.32); c.sun.color.setHex(0xffcf9e); c.sun.intensity = 1.7;
    c.hemi.color.setHex(0xa9bcff); c.hemi.groundColor.setHex(0x5a4638); c.hemi.intensity = 1.0;
    c.camera.far = R * 9; c.camera.fov = 62; c.camera.updateProjectionMatrix();
    const sd = c.sun.position.clone().normalize();
    const sky = new THREE.Mesh(new THREE.SphereGeometry(R * 6, 32, 16), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { sd: { value: sd } },
      vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 sd; varying vec3 vD; void main(){ vec3 d = normalize(vD); float h = d.y;' +
        'vec3 zen = vec3(0.10,0.17,0.34), up = vec3(0.33,0.45,0.70), hor = vec3(0.98,0.74,0.55), fc = vec3(0.79,0.71,0.65);' +
        'vec3 c = mix(fc, hor, smoothstep(-0.03, 0.03, h)); c = mix(c, up, smoothstep(0.03, 0.30, h)); c = mix(c, zen, smoothstep(0.30, 0.95, h));' +
        'float s = max(0.0, dot(d, sd)); c += vec3(1.0,0.62,0.32) * pow(s, 18.0) * 0.55 + vec3(1.0,0.9,0.7) * pow(s, 500.0);' +
        'gl_FragColor = vec4(c, 1.0); }',
    }));
    sky.renderOrder = -10; c.scene.add(sky);

    // اللوحة
    const P = c.ui.panel;
    P.innerHTML = '<div class="dr-course" id="drCourse">' + T('أجهّز المسار…', 'Preparing the course…') + '</div>' +
      '<div class="ck-row"><button class="dr-go" id="drRestart">' + T('سباق جديد', 'New race') + '</button><button class="ghost" id="drDemo">' + T('لفّة تلقائيّة', 'Auto lap') + '</button></div>' +
      '<label>' + T('الكاميرا', 'Camera') + '</label><div class="dr-seg" id="drCam">' +
      '<button data-m="chase" class="on">' + T('خلف الدرون', 'Chase') + '</button><button data-m="fpv">' + T('عين الطيّار', 'Pilot view') + '</button><button data-m="over">' + T('من فوق', 'Overview') + '</button></div>' +
      '<label>' + T('عدد الحلقات', 'Rings') + ': <b id="drNv">8</b></label><input type="range" id="drN" min="4" max="12" step="1" value="8">' +
      '<label>' + T('أقصى سرعة', 'Top speed') + ': <b id="drVv">110</b> ' + T('كم/س', 'km/h') + '</label><input type="range" id="drV" min="60" max="160" step="10" value="110">' +
      '<div class="ck-stat" id="drStat"></div>' +
      (TOUCH ? '<div class="dr-keys">' + T('العصا اليسرى: صعود ونزول ودوران · اليمنى: تقدّم وانزلاق', 'Left stick: climb and turn · Right stick: forward and strafe') + '</div>'
        : '<div class="dr-keys"><kbd>W</kbd><kbd>S</kbd> ' + T('تقدّم ورجوع', 'forward/back') + ' · <kbd>A</kbd><kbd>D</kbd> ' + T('دوران', 'turn') + ' · <kbd>Q</kbd><kbd>E</kbd> ' + T('صعود ونزول', 'up/down') +
          '<br><kbd>←</kbd><kbd>→</kbd> ' + T('انزلاق', 'strafe') + ' · <kbd>C</kbd> ' + T('الكاميرا', 'camera') + ' · <kbd>R</kbd> ' + T('من جديد', 'restart') + '</div>');
    UI.course = P.querySelector('#drCourse'); UI.stat = P.querySelector('#drStat'); UI.demo = P.querySelector('#drDemo');
    P.querySelector('#drRestart').addEventListener('click', () => { if (!S) return; setDemo(false); restart(); });
    UI.demo.addEventListener('click', () => { if (S) setDemo(!S.demo); });
    UI.cam = P.querySelector('#drCam');
    UI.cam.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setCam(b.dataset.m); });
    const nI = P.querySelector('#drN'), vI = P.querySelector('#drV');
    nI.addEventListener('input', () => { opts.rings = +nI.value; P.querySelector('#drNv').textContent = nI.value; });
    nI.addEventListener('change', () => { if (S) { setDemo(false); buildCourse(); restart(); } });
    vI.addEventListener('input', () => { opts.vmax = +vI.value; C2 = c2For(opts.vmax); P.querySelector('#drVv').textContent = vI.value; });
    UI.nI = nI; UI.vI = vI;

    // زرّ طيّ اللوحة (يُطوى تلقائيًّا مع الإقلاع ليظهر المشهد كاملًا)
    const tog = document.createElement('button'); tog.className = 'dr-tog'; tog.setAttribute('aria-label', T('إظهار أو إخفاء اللوحة', 'Toggle panel'));
    tog.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
    tog.addEventListener('click', () => c.ui.box.classList.toggle('dr-min'));
    c.ui.box.appendChild(tog);

    // لوحة الأرقام الحيّة
    const cell = (id, l, u) => '<div><i>' + l + '</i><b><span id="' + id + '">0</span>' + (u ? '<u>' + u + '</u>' : '') + '</b></div>';
    c.ui.hud('<div class="dh"><div class="dh-l">' + T('زمن السباق', 'Race time') + '</div><div class="dh-t" id="dhT">0:00.0</div><div class="dh-bar"><s id="dhB"></s></div><div class="dh-g">' +
      cell('dhR', T('الحلقات', 'Rings'), '') + cell('dhS', T('السرعة', 'Speed'), T('كم/س', 'km/h')) + cell('dhA', T('الارتفاع', 'Alt'), T('م', 'm')) +
      cell('dhN', T('للحلقة', 'To ring'), T('م', 'm')) + cell('dhC', T('اصطدام', 'Crashes'), '') + '</div><div class="dh-best" id="dhBest"></div></div>');
    ['dhT', 'dhB', 'dhR', 'dhS', 'dhA', 'dhN', 'dhC', 'dhBest'].forEach((k) => { UI[k] = document.getElementById(k); });

    UI.msg = document.createElement('div'); UI.msg.className = 'dr-msg'; document.body.appendChild(UI.msg);
    UI.map = document.createElement('canvas'); UI.map.className = 'dr-map'; UI.map.width = UI.map.height = 336; document.body.appendChild(UI.map);

    // عصوان للّمس (نمط ٢: اليسرى ارتفاع ودوران، اليمنى تقدّم وانزلاق)
    if (TOUCH) {
      for (const side of ['l', 'r']) {
        const el = CK.el('<div class="dr-stick ' + side + '"><span>' + (side === 'l' ? T('صعود · دوران', 'Climb · turn') : T('تقدّم · انزلاق', 'Forward · strafe')) + '</span><div class="dr-knob"></div></div>');
        document.body.appendChild(el);
        const knob = el.querySelector('.dr-knob'); let pid = null;
        const move = (e) => {
          const r = el.getBoundingClientRect(), rad = r.width / 2 - 14;
          let x = (e.clientX - r.left - r.width / 2) / rad, y = (e.clientY - r.top - r.height / 2) / rad;
          const L = Math.hypot(x, y); if (L > 1) { x /= L; y /= L; }
          stk[side].x = Math.abs(x) < 0.08 ? 0 : x; stk[side].y = Math.abs(y) < 0.08 ? 0 : y;
          knob.style.transform = 'translate(' + (x * rad) + 'px,' + (y * rad) + 'px)';
        };
        const end = (e) => { if (e.pointerId !== pid) return; pid = null; stk[side].x = stk[side].y = 0; knob.style.transform = ''; };
        el.addEventListener('pointerdown', (e) => { e.preventDefault(); pid = e.pointerId; try { el.setPointerCapture(pid); } catch (er) { /* بلا التقاط */ } move(e); });
        el.addEventListener('pointermove', (e) => { if (e.pointerId === pid) move(e); });
        el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
      }
    }

    // لوحة المفاتيح (مرّة واحدة لكلّ الصفحة)
    window.addEventListener('keydown', (e) => {
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (/^(Arrow|Space)/.test(e.code)) e.preventDefault();
      if (e.code === 'KeyR' && S) { setDemo(false); restart(); return; }
      if (e.code === 'KeyC') { const m = ['chase', 'fpv', 'over']; setCam(m[(m.indexOf(opts.cam) + 1) % 3]); return; }
      keys.add(e.code);
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));
    window.addEventListener('blur', () => keys.clear());
  }

  // ── المسار: بوّابات بين أطول المباني ──
  function centroid(b) { let x = 0, z = 0; for (const p of b.poly) { x += p[0]; z += p[1]; } return [x / b.poly.length, z / b.poly.length]; }
  function findGates(city, maxR) {
    const idx = city.idx, B = city.buildings, Hh = (x, z) => idx.heightAt(x, z);
    const cand = [];
    for (let i = 0; i < B.length && cand.length < 36; i++) {
      const b = B[i]; if (b.h < 16) break;
      const [x, z] = centroid(b); if (Math.hypot(x, z) > maxR) continue;
      if (cand.some((o) => Math.hypot(o.x - x, o.z - z) < 20)) continue;
      cand.push({ x, z, h: b.h, name: b.name });
    }
    const clear = (mx, mz, tx, tz, nx, nz, r, y) => {
      const lim = y - r - 1.2;
      for (let s = -(r + 1.5); s <= r + 1.5; s += 1.5) if (Hh(mx + tx * s, mz + tz * s) > lim) return false;
      for (const o of [-0.7 * r, 0, 0.7 * r]) for (let s = -26; s <= 26; s += 2.5) if (Hh(mx + tx * o + nx * s, mz + tz * o + nz * s) > lim) return false;
      return true;
    };
    const gates = [];
    for (let i = 0; i < cand.length; i++) for (let j = i + 1; j < cand.length; j++) {
      const A = cand[i], Bb = cand[j], dx = Bb.x - A.x, dz = Bb.z - A.z, d = Math.hypot(dx, dz);
      if (d < 24 || d > 230) continue;
      const mh = Math.min(A.h, Bb.h), y = 0.6 * mh, tx = dx / d, tz = dz / d, nx = -tz, nz = tx, mx = (A.x + Bb.x) / 2, mz = (A.z + Bb.z) / 2;
      if (Math.hypot(mx, mz) > maxR) continue;
      let r = 0;
      for (const rr of [9, 7.5, 6]) { if (mh < rr * 2.6 || y - rr - 1.2 < 3) continue; if (clear(mx, mz, tx, tz, nx, nz, rr, y)) { r = rr; break; } }
      if (!r) continue;
      gates.push({ x: mx, y, z: mz, tx, tz, nx, nz, r, mh, hA: A.h, hB: Bb.h, name: A.name || Bb.name || '', score: y * (1.25 - d / 240) - Math.hypot(mx, mz) * 0.06 });
    }
    gates.sort((a, b) => b.score - a.score);
    // اختيار متكتّل: أفضل بوّابة أوّلًا، ثمّ الأفضل مع خصم للبعد عن أقرب بوّابة مختارة — مسار متماسك لا قفزات عبر الحيّ
    const sel = [];
    while (sel.length < opts.rings) {
      let best = null, bv = -Infinity;
      for (const g of gates) {
        if (sel.includes(g)) continue;
        let dn = Infinity; for (const s of sel) dn = Math.min(dn, Math.hypot(s.x - g.x, s.z - g.z));
        if (dn < 55) continue;
        const v = g.score - (sel.length ? 0.22 * dn : 0);
        if (v > bv) { bv = v; best = g; }
      }
      if (!best) break; sel.push(best);
    }
    return sel;
  }
  function circleCourse(N) { // احتياط لحيّ بلا أبراج: دائرة فوق أعلى ما حولها
    const idx = S.city.idx, rad = Math.min(ctx.R * 0.38, 180), out = [];
    for (let k = 0; k < N; k++) {
      const a = (k / N) * Math.PI * 2, x = rad * Math.sin(a), z = -rad * Math.cos(a), nx = Math.cos(a), nz = Math.sin(a), r = 8;

  // ── المرئيّات ──

      const halo = new THREE.Mesh(new THREE.TorusGeometry(g.r, 2.4, 8, 72), add(new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.07, fog: false })));

  // نوافذ الغروب: نمط مضيء على الواجهات يُحسب في المظلّل من الموقع العالميّ (بلا إحداثيّات نسيج في هندسة النواة)
  function windows(mat) {
    mat.onBeforeCompile = (sh) => {
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP; varying vec3 vWN;')
        .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal);');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP; varying vec3 vWN;\nfloat drHash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }')
        .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n{ float side = 1.0 - step(0.5, abs(vWN.y)); float u = (abs(vWN.x) > abs(vWN.z) ? vWP.z : vWP.x) / 2.6; float v = vWP.y / 3.3;' +
          ' vec2 cl = floor(vec2(u, v)); vec2 f = fract(vec2(u, v)); float win = step(0.2, f.x) * step(f.x, 0.8) * step(0.28, f.y) * step(f.y, 0.78);' +
          ' float lit = step(0.64, drHash(cl + floor(vWP.x * 0.02) * 7.0)); totalEmissiveRadiance += side * win * step(2.5, vWP.y) * mix(vec3(0.03, 0.05, 0.08), vec3(1.0, 0.7, 0.36) * 0.72, lit); }');

  // ── لكلّ مدينة ──

      camPos: new THREE.Vector3(), camLook: new THREE.Vector3(), shake: 0, hudT: 0, mapT: 0, msgT: 0, fx: [],

  // ── السباق ──
  function placeAt(x, y, z, yaw) {
    const D = S.d; D.pos.set(x, y, z); D.prev.copy(D.pos); D.vel.set(0, 0, 0); D.yaw = yaw; D.pitch = D.roll = D.yawRate = 0;

  }

    snapCam();
  }

  function setDemo(on) {

    S.demo = !!on; UI.demo.textContent = S.demo ? T('أوقف التلقائي', 'Stop auto') : T('لفّة تلقائيّة', 'Auto lap');
  }
  function setCam(m) {

    const o = ctx.orbit; o.enabled = m === 'over';
    if (m === 'over' && S) { o.target.copy(S.d.pos); o.dist = 150; o.phi = 0.95; o.theta = S.d.yaw; o.apply(); }

    simulate(sec, until) {
      if (!S) return null;
      if (S.race.state !== 'racing') { restart(true); startRace(); }
      S.demo = true; S.race.assisted = true; S.intro = INTRO;
      let n = Math.round((sec || 180) * 60);
      while (n-- > 0) { autopilot(); step(HSTEP); if (S.race.state === 'finished') break; if (until && until(S)) break; }
      if (S.race.state === 'finished') S.demo = false; else { S.msgT = 0; UI.msg.classList.remove('on'); }
      UI.demo.textContent = S.demo ? T('أوقف التلقائي', 'Stop auto') : T('لفّة تلقائيّة', 'Auto lap');
      snapCam(); render(0, performance.now()); hud(); publish();
      return window.__inspire_state;
    },
    restart() { if (S) { setDemo(false); restart(true); publish(); } return window.__inspire_state; },
    fly(inp, sec) { // طيران يدويّ حتميّ: {fwd, strafe, lift, turn} لمدّة sec ثانية
      if (!S) return null; if (S.demo) setDemo(false); if (S.race.state === 'ready') startRace();
      const I = S.inp; I.fwd = I.strafe = I.lift = I.turn = 0; Object.assign(I, inp || {});
      let n = Math.round((sec || 1) * 60); while (n-- > 0) step(HSTEP);
      I.fwd = I.strafe = I.lift = I.turn = 0; snapCam(); render(0, performance.now()); hud(); publish();
      return Object.assign({ x: +S.d.pos.x.toFixed(1), z: +S.d.pos.z.toFixed(1) }, window.__inspire_state);
    },
    demo(on) { setDemo(on !== false); return window.__inspire_state; },
    stage(k, back) { // لقطة: يطير تلقائيًّا حتّى الحلقة k ثمّ يصطفّ على خطّ الاقتراب منها ويواصل الطيران
      if (!S) return null; k = clamp(k | 0, 0, S.rings.length - 1); back = back || 24;
      window.__drone.simulate(300, (s) => s.race.passed >= k);
      if (S.race.state !== 'racing') return window.__inspire_state;
      const g = S.rings[k], D = S.d, ci = S.wps.findIndex((w) => w.ring === k);
      D.pos.set(g.x - g.nx * back, g.y + 1, g.z - g.nz * back); D.prev.copy(D.pos); D.vel.set(g.nx * 15, 0, g.nz * 15);
      D.yaw = yawTo(g.nx, g.nz); D.pitch = 0.3; D.roll = 0; D.yawRate = 0; resetTrail();
      setDemo(true); S.ap = Math.max(0, ci - 1); snapCam(); render(0, performance.now()); hud(); publish();
      return window.__inspire_state;
    },
    cam(m) { setCam(m); return opts.cam; },
    rings(n) { UI.nI.value = n; UI.nI.dispatchEvent(new Event('input')); UI.nI.dispatchEvent(new Event('change')); return window.__inspire_state; },
    speed(v) { UI.vI.value = v; UI.vI.dispatchEvent(new Event('input')); return C2; },
    get S() { return S; },
  };

  CK.start({
    title: T('سباق الدرون بين الأبراج', 'Drone race between the towers'),
    sub: T('حلقات مضيئة بين أطول مباني حيّك الحقيقيّة — مرّ منها بالترتيب بأسرع وقت.', 'Glowing rings between the tallest real buildings of your area — fly through them in order, fast.'),
    shadows: true,
    panel(c) { setupOnce(c); },
    onCity(c, city) { setupCity(c, city); },
  });
})();
</script></body></html>
