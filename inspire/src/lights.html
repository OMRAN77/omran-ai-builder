</head><body><script>
(function () {

    ctx: null, city: null, loads: 0,
    pos: new Float32Array(N * 3), col: new Float32Array(N * 3), from: new Float32Array(N * 3), fromCol: new Float32Array(N * 3),
    perm: new Int32Array(N), delay: new Float32Array(N), arc: new Float32Array(N), seed: new Float32Array(N),
    F: null, formName: 'launch', tStart: 0, dur: 2.6, shown: 0,
    word: DEFAULT_WORD, wordSamples: 0,

    auto: true, autoIdx: -1, autoNext: 0, launchAt: 0,

  const droneMat = glowMat(5.5, 2.6, false), streetMat = glowMat(4.2, 1.4, false), beaconMat = glowMat(7, 2.2, true);

    uniforms: { uTime: SH.uTime, uK: { value: 1 } },
    vertexShader: 'attribute float aSeed; uniform float uTime, uK; varying float vA; void main(){ vA = uK*(0.45+0.55*sin(uTime*(1.0+aSeed*2.0)+aSeed*50.0)*0.5+0.3); gl_PointSize = 1.2 + aSeed*1.8; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',

  const skyMat = new THREE.ShaderMaterial({
    uniforms: { uK: { value: 1 } }, side: THREE.BackSide, transparent: true, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: [
      'uniform float uK; varying vec3 vP;',
      'void main(){ float h = normalize(vP).y;',
      ' vec3 fogc = vec3(0.043,0.078,0.15);',
      ' vec3 c = mix(fogc, vec3(0.008,0.016,0.045), smoothstep(0.0, 0.55, h));',
      ' c += vec3(0.30,0.14,0.06) * smoothstep(-0.06, 0.05, h) * exp(-max(h,0.0)*12.0) * 0.5;',
      ' gl_FragColor = vec4(c, uK); }'].join('\n'),
  });
  // نوافذ مضاءة ليلًا: تعديل صغير على مادّة المباني (بلا نسيج)
  const WIN = { uNight: { value: 1 } };
  const bMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  bMat.onBeforeCompile = (sh) => {
    sh.uniforms.uNight = WIN.uNight;
    sh.vertexShader = 'varying vec3 vWP; varying vec3 vWN;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vWP = (modelMatrix * vec4(transformed,1.0)).xyz; vWN = objectNormal;');

      sh.fragmentShader.replace('#include <emissivemap_fragment>', [
        '#include <emissivemap_fragment>',
        'if (uNight > 0.001) {',
        ' diffuseColor.rgb *= mix(1.0, 0.5, uNight);',
        ' if (abs(vWN.y) < 0.5 && vWP.y > 1.2) {',
        '  vec2 nn = normalize(vWN.xz + vec2(1e-5)); vec2 tn = vec2(-nn.y, nn.x);',
        '  float u = dot(vWP.xz, tn) / 3.0, v = vWP.y / 3.4;',
        '  float wid = floor(dot(vWP.xz, nn) * 0.5);',
        '  vec2 cell = floor(vec2(u, v)); vec2 f = fract(vec2(u, v));',
        '  float win = step(0.2, f.x) * step(f.x, 0.8) * step(0.3, f.y) * step(f.y, 0.82);',
        '  float fw = max(fwidth(u), fwidth(v)); win = mix(win, 0.36, smoothstep(0.25, 0.8, fw));',
        '  float h = ltH(vec3(cell, wid)); float lit = step(0.5, h);',
        '  vec3 wc = mix(vec3(1.0, 0.70, 0.36), vec3(0.72, 0.85, 1.0), step(0.78, ltH(vec3(cell.yx, wid + 3.0))));',
        '  totalEmissiveRadiance += wc * win * lit * (0.55 + 0.6 * h) * uNight;',
        ' }',
        '}'].join('\n'));
  };

  // ── التشكيلات: كلّ تشكيل = نقاط أساس + ألوان + حركة حيّة anim(t, i, out, oc) ──
  function mk(base, col, anim, delayOf) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < N; i++) { const x = base[i * 3], y = base[i * 3 + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }

    }

  function rotX(out, a) { const c = Math.cos(a), s = Math.sin(a), y = out[1], z = out[2]; out[1] = y * c - z * s; out[2] = y * s + z * c; }

  function fSphere(sz) {
    const base = new Float32Array(N * 3), col = new Float32Array(N * 3), r = 62 * sz, ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i + 0.5) / N * 2, rr = Math.sqrt(1 - y * y), th = i * ga;
      base[i * 3] = Math.cos(th) * rr * r; base[i * 3 + 1] = y * r; base[i * 3 + 2] = Math.sin(th) * rr * r;
      hsl(0.5 + (1 - y) * 0.14, 0.9, 0.62, col, i);
    }
    return mk(base, col, (t, i, o, c) => {
      o[0] = base[i * 3]; o[1] = base[i * 3 + 1]; o[2] = base[i * 3 + 2]; rotY(o, t * 0.45); rotX(o, 0.25 * Math.sin(t * 0.4));
      const band = Math.pow(0.5 + 0.5 * Math.sin(base[i * 3 + 1] / r * 4 - t * 3.2), 6), k = 0.65 + 1.1 * band;
      c[0] = col[i * 3] * k; c[1] = col[i * 3 + 1] * k; c[2] = col[i * 3 + 2] * k;
    });
  }
  function fRing(sz) {
    const base = new Float32Array(N * 3), col = new Float32Array(N * 3), ang = new Float32Array(N), rad = new Float32Array(N), r = 80 * sz, per = Math.ceil(N / 3);
    for (let i = 0; i < N; i++) {
      const strand = i % 3, a = Math.floor(i / 3) / per * Math.PI * 2;
      ang[i] = a; rad[i] = r + (strand - 1) * 4.5 * sz;
      base[i * 3] = Math.cos(a) * rad[i]; base[i * 3 + 1] = Math.sin(a) * rad[i]; base[i * 3 + 2] = (strand - 1) * 3.5 * sz;
      col[i * 3] = 1.0; col[i * 3 + 1] = 0.72 + 0.1 * (strand === 1); col[i * 3 + 2] = 0.3;
    }
    return mk(base, col, (t, i, o, c) => {
      const a = ang[i] + t * 0.55; o[0] = Math.cos(a) * rad[i]; o[1] = Math.sin(a) * rad[i]; o[2] = base[i * 3 + 2];
      rotX(o, 0.35 * Math.sin(t * 0.5)); rotY(o, 0.3 * Math.sin(t * 0.33));
      const k = 0.5 + 1.4 * Math.pow(0.5 + 0.5 * Math.cos(ang[i] - t * 2.4), 10);
      c[0] = col[i * 3] * k; c[1] = col[i * 3 + 1] * k; c[2] = col[i * 3 + 2] * k + 0.25 * k * k;
    });
  }
  function fStar(sz) {
    const base = new Float32Array(N * 3), col = new Float32Array(N * 3), tail = new Float32Array(N).fill(-1);
    const poly = []; for (let k = 0; k < 10; k++) { const a = Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 29 : 70; poly.push([Math.cos(a) * rr, Math.sin(a) * rr + 20]); }
    const n1 = 300, n2 = 80, n3 = N - n1 - n2;
    outline(poly, n1, base, 0, sz, sz);
    outline(poly.map((p) => [p[0] * 0.42, (p[1] - 20) * 0.42 + 20]), n2, base, n1, sz, sz);
    for (let i = 0; i < n1 + n2; i++) { col[i * 3] = 1.0; col[i * 3 + 1] = i < n1 ? 0.88 : 0.95; col[i * 3 + 2] = i < n1 ? 0.55 : 0.85; }
    for (let j = 0; j < n3; j++) {
      const i = n1 + n2 + j; tail[i] = j / n3;
      base[i * 3] = (rnd() - 0.5) * 2; base[i * 3 + 1] = -20 * sz; base[i * 3 + 2] = (rnd() - 0.5) * 2;
      col[i * 3] = 1.0; col[i * 3 + 1] = 0.5; col[i * 3 + 2] = 0.15;
    }
    const side = new Float32Array(N); for (let i = 0; i < N; i++) side[i] = rnd() - 0.5;
    return mk(base, col, (t, i, o, c) => {
      if (tail[i] >= 0) {
        const u = (tail[i] + t * 0.42) % 1, f = 1 - u;
        o[0] = side[i] * 46 * sz * f * f + Math.sin(u * 9 + i) * 2; o[1] = (-22 - u * 80) * sz; o[2] = side[i] * 8 * f;
        c[0] = 1.0 * f; c[1] = (0.35 + 0.4 * f) * f; c[2] = 0.12 * f;
      } else {
        o[0] = base[i * 3]; o[1] = base[i * 3 + 1]; o[2] = 0; rotY(o, 0.4 * Math.sin(t * 0.7));
        const k = 0.8 + 0.5 * Math.pow(0.5 + 0.5 * Math.sin(t * 5 + i * 0.37), 8);
        c[0] = col[i * 3] * k; c[1] = col[i * 3 + 1] * k; c[2] = col[i * 3 + 2] * k;
      }
      o[1] += Math.sin(t * 0.9) * 5 + Math.min(t, 6) * 2.5;
    });
  }
  function fHeart(sz) {
    const base = new Float32Array(N * 3), col = new Float32Array(N * 3), poly = [];
    for (let k = 0; k < 240; k++) { const a = k / 240 * Math.PI * 2, s = Math.sin(a); poly.push([16 * s * s * s, 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a) + 2]); }
    const k0 = 4.3 * sz, n1 = 320, n2 = 110, n3 = N - n1 - n2;
    outline(poly, n1, base, 0, k0, k0);
    outline(poly, n2, base, n1, k0 * 0.68, k0 * 0.68);
    outline(poly, n3, base, n1 + n2, k0 * 0.36, k0 * 0.36);
    for (let i = 0; i < N; i++) { const inner = i >= n1; col[i * 3] = 1.0; col[i * 3 + 1] = inner ? 0.42 : 0.12; col[i * 3 + 2] = inner ? 0.62 : 0.32; }
    return mk(base, col, (t, i, o, c) => {
      const ph = (t * 1.15) % 1, beat = Math.exp(-Math.pow((ph - 0.1) / 0.05, 2)) + 0.6 * Math.exp(-Math.pow((ph - 0.3) / 0.05, 2)), s = 1 + 0.07 * beat;
      o[0] = base[i * 3] * s; o[1] = base[i * 3 + 1] * s; o[2] = base[i * 3 + 2]; rotY(o, 0.18 * Math.sin(t * 0.6));
      const k = 0.75 + 0.75 * beat; c[0] = col[i * 3] * k; c[1] = col[i * 3 + 1] * k; c[2] = col[i * 3 + 2] * k;
    });
  }
  // الكلمة: تُرسم على لوح مخفيّ ثمّ تُؤخذ عيّنات من بكسلاتها (يدعم العربيّة: المتصفّح يشكّل الحروف ويصلها)
  function sampleWord(text) {
    const W = 720, H = 220, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d', { willReadFrequently: true });
    const ar = /[؀-ۿ]/.test(text);
    const font = (s) => '700 ' + s + 'px Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", "DejaVu Sans", Arial, sans-serif';
    let fs = 160; g.font = font(fs); const mw = g.measureText(text).width; if (mw > 680) { fs = Math.max(30, Math.floor(fs * 680 / mw)); g.font = font(fs); }
    g.direction = ar ? 'rtl' : 'ltr'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    g.fillText(text, W / 2, H / 2 + 6);

    for (let y = y0 + st / 2; y <= y1; y += st) for (let x = x0 + st / 2; x <= x1; x += st) { if (d[(Math.round(y) * W + Math.round(x)) * 4 + 3] > 128) pts.push([x, y]); }

  function fWord(sz, text) {

  function fLaunch() { // على سطح أعلى برج قبل الإقلاع

    for (let i = 0; i < N; i++) { const gx = i % 25, gz = Math.floor(i / 25); base[i * 3] = (gx - 12) * 1.3; base[i * 3 + 1] = roofY; base[i * 3 + 2] = (gz - 9.5) * 1.3; col[i * 3] = 0.6; col[i * 3 + 1] = 0.85; col[i * 3 + 2] = 1.0; }
    return mk(base, col, (t, i, o, c) => { o[0] = base[i * 3]; o[1] = base[i * 3 + 1]; o[2] = base[i * 3 + 2]; const k = 0.35 + 0.3 * (Math.sin(t * 6 + i * 0.5) > 0.6); c[0] = col[i * 3] * k; c[1] = col[i * 3 + 1] * k; c[2] = col[i * 3 + 2] * k; });
  }
  function build(name) {

  // ── مكان المشاهدة ──

      tallest: Math.round(S.tallest * 10) / 10, aboveRoof: S.alt, showAltitude: Math.round(C.y), centre: [Math.round(S.cx), Math.round(S.cz)], scale: S.scale,
      size: S.F ? [Math.round(S.F.w), Math.round(S.F.h)] : null, progress: Math.round(progress() * 100) / 100,
      streetLights: S.streetN || 0, beacons: S.beaconN || 0, view: S.view, flying: !!S.fly, fov: Math.round(S.ctx.camera.fov),
      spot: S.spot ? { x: S.spot.x, z: S.spot.z, y: Math.round(S.spot.y * 10) / 10, roof: S.spot.roof, dist: S.spot.dist, elev: S.spot.elev, vis: S.spot.vis } : null,
      best: S.best ? { x: S.best.x, z: S.best.z, dist: S.best.dist, elev: S.best.elev, vis: S.best.vis, tested: S.best.tested } : null,
      city: S.city ? S.city.name : '', buildings: S.city ? S.city.buildings.length : 0, loads: S.loads,
    };
  }
  function progress() { let mx = 0; for (let d = 0; d < N; d++) if (S.delay[d] > mx) mx = S.delay[d]; return clamp01((S.t - S.tStart) / (S.dur + mx)); }

  // ── كلّ مدينة ──
  function onCity(ctx, city) {
    const { THREE: _T, camera, orbit } = ctx;
    S.city = city; S.loads++; S.marker = null; S.spot = null; S.best = null; S.picking = false; S.fly = null; S.view = 'aerial';
    orbit.enabled = true; camera.fov = 50; S.sv.fov = 50; camera.updateProjectionMatrix();
    const tb = city.buildings[0];
    S.tallest = tb ? tb.h : 0; S.tallestName = tb ? tb.name : '';
    S.cx = tb ? (tb.box[0] + tb.box[2]) / 2 : 0; S.cz = tb ? (tb.box[1] + tb.box[3]) / 2 : 0;
    // مادّة المباني الليليّة + ألوان المسطّحات
    city.buildingsMesh.material = bMat;
    const cg = city.group.parent, polys = cg.children.filter((o) => o.isGroup && o !== city.group);
    const firstMat = (g) => { let m = null; g && g.traverse((o) => { if (!m && o.material) m = o.material; }); return m; };
    S.mats = [];
    const addM = (mat, night, em) => { if (mat && mat.color) S.mats.push({ mat, day: mat.color.clone(), night: new THREE.Color(night), em: em ? new THREE.Color(em) : null }); };
    addM(city.ground.material, 0x14171d); addM(city.roadsMesh.material, 0x262a31, 0x1a1208); addM(firstMat(polys[0]), 0x0a1f33); addM(firstMat(polys[1]), 0x0f2117);
    // السماء والنجوم
    const sky = new THREE.Mesh(new THREE.SphereGeometry(ctx.R * 3.6, 32, 16), skyMat); sky.renderOrder = -2; city.group.add(sky);
    const sp = [], ss = [];
    for (let i = 0; i < 1400; i++) { const u = rnd() * 2 * Math.PI, v = 0.06 + rnd() * 0.94, r = ctx.R * 3.4, c = Math.sqrt(1 - v * v); sp.push(Math.cos(u) * c * r, v * r, Math.sin(u) * c * r); ss.push(rnd()); }
    const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3)); sg.setAttribute('aSeed', new THREE.Float32BufferAttribute(ss, 1));
    const stars = new THREE.Points(sg, starMat); stars.renderOrder = -1; stars.frustumCulled = false; city.group.add(stars);
    // أعمدة إنارة على جانبي الشوارع (مرّة واحدة لكلّ مدينة، بتباعد يتكيّف مع طول الشبكة)
    let total = 0; for (const r of city.roads) for (let i = 0; i < r.pts.length - 1; i++) total += Math.hypot(r.pts[i + 1][0] - r.pts[i][0], r.pts[i + 1][1] - r.pts[i][1]);
    const gap = Math.max(26, total * 2 / 7000), lp = [], lc = [], ls = [];
    for (const r of city.roads) {
      if (/footway|path|steps|cycleway/.test(r.kind)) continue;
      let acc = gap * 0.5;
      for (let i = 0; i < r.pts.length - 1; i++) {
        const p = r.pts[i], q = r.pts[i + 1], dx = q[0] - p[0], dz = q[1] - p[1], L = Math.hypot(dx, dz) || 1, nx = -dz / L, nz = dx / L, off = r.w / 2 + 0.8;
        while (acc < L) { const x = p[0] + dx * acc / L, z = p[1] + dz * acc / L; for (const sgn of [1, -1]) { lp.push(x + nx * off * sgn, 7, z + nz * off * sgn); const warm = /motorway|trunk|primary/.test(r.kind); lc.push(1.0, warm ? 0.62 : 0.78, warm ? 0.28 : 0.5); ls.push(rnd()); } acc += gap; }
        acc -= L;
      }
    }
    S.streetN = lp.length / 3;
    if (lp.length) { const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3)); lg.setAttribute('aCol', new THREE.Float32BufferAttribute(lc, 3)); lg.setAttribute('aSeed', new THREE.Float32BufferAttribute(ls.map(() => 0), 1)); city.group.add(new THREE.Points(lg, streetMat)); }
    // أضواء تحذير حمراء على قمم الأبراج
    const bp = [], bc = [], bs = [];
    for (const b of city.buildings) { if (b.h < 60 || bp.length / 3 >= 120) break; bp.push((b.box[0] + b.box[2]) / 2, b.h + 1.5, (b.box[1] + b.box[3]) / 2); bc.push(1, 0.12, 0.08); bs.push(rnd()); }
    S.beaconN = bp.length / 3;
    if (bp.length) { const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.Float32BufferAttribute(bp, 3)); bg.setAttribute('aCol', new THREE.Float32BufferAttribute(bc, 3)); bg.setAttribute('aSeed', new THREE.Float32BufferAttribute(bs, 1)); city.group.add(new THREE.Points(bg, beaconMat)); }
    // الدرونات
    const dg = new THREE.BufferGeometry();
    dg.setAttribute('position', new THREE.BufferAttribute(S.pos, 3).setUsage(THREE.DynamicDrawUsage));
    dg.setAttribute('aCol', new THREE.BufferAttribute(S.col, 3).setUsage(THREE.DynamicDrawUsage));
    dg.setAttribute('aSeed', new THREE.BufferAttribute(S.seed, 1));
    const drones = new THREE.Points(dg, droneMat); drones.frustumCulled = false; city.group.add(drones); S.drones = drones;
    const glow = new THREE.PointLight(0x88ccff, 0, 0, 2); city.group.add(glow); S.glow = glow;
    S.yNow = S.tallest + S.alt; drones.position.set(S.cx, S.yNow, S.cz);
    // الإقلاع من السطح
    S.formName = 'launch'; S.F = fLaunch(); for (let d = 0; d < N; d++) { S.perm[d] = d; S.delay[d] = -10; } S.tStart = S.t; S.shown = 0;
    for (let d = 0; d < N; d++) { const o = [0, 0, 0], c = [0, 0, 0]; S.F.anim(0, d, o, c); S.pos.set(o, d * 3); S.col.set(c, d * 3); }
    S.lightCol = new THREE.Color(0x88ccff);
    S.launchAt = S.t + 1.4; S.autoIdx = -1; S.autoNext = S.launchAt;
    // الكاميرا: زاوية منخفضة تُظهر الأفق والعرض فوقه
    const C = showCentre();
    orbit.target.set(S.cx * 0.7, C.y * 0.66, S.cz * 0.7); orbit.dist = Math.max(520, C.y * 1.55 + 80); orbit.phi = 1.33; orbit.theta = 0.55; orbit.apply();
    S.yaw = Math.atan2(camera.position.x - S.cx, camera.position.z - S.cz); drones.rotation.y = S.yaw;
    S.nightDirty = true; markButtons(); hud(); pub();
    ctx.onFrame(tick);
  }

  const o3 = [0, 0, 0], c3 = [0, 0, 0], vb = new THREE.Vector2();
  function tick(dt, now) {
    const ctx = S.ctx, cam = ctx.camera; S.t += dt; SH.uTime.value = S.t;
    ctx.renderer.getDrawingBufferSize(vb); SH.uScale.value = vb.y / (2 * Math.tan(cam.fov * Math.PI / 360)) / (cam.view && cam.view.enabled ? cam.view.height / cam.view.fullHeight : 1);
    // الليل والنهار بانتقال ناعم
    if (S.night !== S.nightTarget || S.nightDirty) { S.night += Math.sign(S.nightTarget - S.night) * Math.min(Math.abs(S.nightTarget - S.night), dt / 1.6); applyNight(S.night); S.nightDirty = false; }
    // التسلسل التلقائيّ
    if (S.formName === 'launch' && S.t >= S.launchAt && !S.auto) setFormation('sphere');
    if (S.auto && S.t >= S.autoNext) { S.autoIdx = (S.autoIdx + 1) % SEQ.length; const [f, hold] = SEQ[S.autoIdx]; if (f === 'word') setWordFromInput(); else setFormation(f); S.autoNext = S.t + hold + S.dur; }
    // مواضع الدرونات (٥٠٠ فقط في كلّ إطار)
    const F = S.F, tf = S.t - S.tStart, pos = S.pos, col = S.col, from = S.from, fc = S.fromCol;
    for (let d = 0; d < N; d++) {
      F.anim(tf, S.perm[d], o3, c3);
      const e0 = (tf - S.delay[d]) / S.dur, k = d * 3;
      const hov = Math.sin(S.t * 1.3 + S.seed[d] * 40) * 0.35;
      if (e0 >= 1) { pos[k] = o3[0]; pos[k + 1] = o3[1] + hov; pos[k + 2] = o3[2]; col[k] = c3[0]; col[k + 1] = c3[1]; col[k + 2] = c3[2]; }
      else {
        const e = ease(clamp01(e0)), a = Math.sin(Math.PI * e) * S.arc[d];
        pos[k] = from[k] + (o3[0] - from[k]) * e; pos[k + 1] = from[k + 1] + (o3[1] - from[k + 1]) * e + hov * e; pos[k + 2] = from[k + 2] + (o3[2] - from[k + 2]) * e + a;
        const ce = clamp01(e0 * 1.4), boost = 1 + Math.sin(Math.PI * clamp01(e0)) * 0.6;
        col[k] = (fc[k] + (c3[0] - fc[k]) * ce) * boost; col[k + 1] = (fc[k + 1] + (c3[1] - fc[k + 1]) * ce) * boost; col[k + 2] = (fc[k + 2] + (c3[2] - fc[k + 2]) * ce) * boost;
      }
    }
    const ga = S.drones.geometry.attributes; ga.position.needsUpdate = true; ga.aCol.needsUpdate = true;
    // الارتفاع والاتّجاه: التشكيل يلتفت ببطء نحو المشاهد
    const yT = S.tallest + S.alt; S.yNow += (yT - S.yNow) * Math.min(1, dt * 2.5);
    S.drones.position.set(S.cx, S.yNow, S.cz);
    let want = Math.atan2(cam.position.x - S.cx, cam.position.z - S.cz), df = want - S.yaw; df = Math.atan2(Math.sin(df), Math.cos(df));
    S.yaw += df * Math.min(1, dt * 1.6); S.drones.rotation.y = S.yaw;
    S.glow.position.set(S.cx, S.yNow - 30, S.cz); S.glow.color.copy(S.lightCol); S.glow.intensity = S.formName === 'launch' ? 0 : 26000 * S.night;
    // الكاميرا: رحلة ناعمة، أو التفات في الشارع، أو دوران بطيء أثناء العرض التلقائيّ
    if (S.fly) {
      const f = S.fly; f.t += dt; const e = ease(clamp01(f.t / f.dur));
      cam.position.lerpVectors(f.p0, f.p1, e); cam.position.y += Math.sin(Math.PI * e) * f.arc; cam.quaternion.slerpQuaternions(f.q0, f.q1, e);
      if (f.t >= f.dur) { S.fly = null; if (f.done) f.done(); }
    } else if (S.view === 'street') { cam.rotation.set(S.sv.pitch, S.sv.yaw, 0, 'YXZ'); }
    else if (S.auto && S.t - S.lastUser > 5) { ctx.orbit.theta += dt * 0.035; ctx.orbit.apply(); }
    if (S.marker) { const s = 1 + 0.25 * Math.sin(S.t * 3); S.marker.children[0].scale.set(s, s, s); S.marker.visible = S.view === 'aerial' || !!S.fly; }
    if (S.t - S.pubAt > 0.5) { S.pubAt = S.t; pub(); }
  }

  CityKit.start({
    title: T('عرض الدرون الضوئيّ فوق مدينتك', 'Drone light show over your city'),
    sub: T('٥٠٠ درون مضيء فوق أعلى سطح في حيّك الحقيقيّ — غيّر التشكيل، اكتب كلمتك، واختر من وين تتفرّج.', '500 glowing drones above the tallest roof of your real neighbourhood — shape them, write your word, pick your viewing spot.'),
    panel, onCity,
  });
})();
