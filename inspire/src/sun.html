<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شمس بيتك ساعة بساعة</title>

<!--CITYKIT-->
<style>
.sn-hint{display:flex;gap:8px;align-items:center;background:rgba(255,201,74,.09);border:1px solid rgba(255,201,74,.28);color:#ffe3a3;border-radius:10px;padding:6px 10px;font-size:13px;margin:4px 0 6px}

.sn-ctl{display:flex;gap:6px;align-items:center;margin-top:4px}

.sn-hud .h b{font-size:30px;color:#ffc94a;font-variant-numeric:tabular-nums}
.sn-hud .h span{font-size:12.5px;color:#e7eef0;font-weight:500}
.sn-hud .n{font-size:12.5px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:6px;max-width:250px}
.sn-hud .n i{flex:none;width:9px;height:9px;border-radius:50%;background:#ffc94a;box-shadow:0 0 8px #ffc94a}
.sn-hud .n.sh i{background:#7aa3c9;box-shadow:none}
.sn-hud .n.nt i{background:#3c4c6c;box-shadow:none}
@media (max-width:640px){.sn-hud{padding:6px 10px;min-width:0;max-width:200px;border-radius:12px}.sn-hud .c{font-size:21px}.sn-hud .d{font-size:11px}.sn-hud .l{margin-top:3px;font-size:11px}.sn-hud .h b{font-size:21px}.sn-hud .h span{font-size:11px}.sn-hud .n{font-size:11px;margin-top:2px}}
</style>
</head><body><script>
(function () {
  'use strict';
  const CK = window.CityKit, T = CK.T, AR = CK.AR;
  const DEG = Math.PI / 180, H0 = -0.833 * DEG; // ارتفاع الشروق والغروب القياسيّ (انكسار + نصف القرص)
  const MON_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const MON_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const Y = new Date().getFullYear();
  const DAYS = Math.round((Date.UTC(Y + 1, 0, 1) - Date.UTC(Y, 0, 1)) / 86400000);
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (min) => { if (min == null || !isFinite(min)) return '—'; let m = Math.round(min); m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const r1 = (v) => Math.round(v * 10) / 10;
  const doyToMD = (doy) => { const d = new Date(Date.UTC(Y, 0, doy)); return [d.getUTCMonth(), d.getUTCDate()]; };
  const mdToDoy = (m, d) => Math.round((Date.UTC(Y, m, d) - Date.UTC(Y, 0, 0)) / 86400000);
  const dateLabel = (doy) => { const [m, d] = doyToMD(doy); return AR ? d + ' ' + MON_AR[m] : d + ' ' + MON_EN[m]; };
  const DIRS_AR = ['شمال', 'شمال شرق', 'شرق', 'جنوب شرق', 'جنوب', 'جنوب غرب', 'غرب', 'شمال غرب'];
  const DIRS_EN = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  const dirName = (az) => { const i = Math.round((((az / DEG) % 360) + 360) % 360 / 45) % 8; return AR ? DIRS_AR[i] : DIRS_EN[i]; };
  const ICON_SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffc94a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#ffc94a"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
  const ICON_PLAY = '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z" fill="currentColor"/></svg>';
  // مراحل السماء والإضاءة بحسب ارتفاع الشمس (درجات): قمّة السماء، الأفق، لون الشمس، شدّتها، لون السماء المحيطة، شدّتها
  const KF = [
    [-18, 0x050a16, 0x0e1a33, 0xff8a50, 0, 0x2b3b66, 0.16],
    [-6, 0x13234a, 0x3f3f69, 0xff8a50, 0, 0x4d5c8c, 0.26],
    [0, 0x2a4880, 0xee965e, 0xff9348, 0.5, 0xa8a8c4, 0.42],
    [7, 0x3768a6, 0xf4bf88, 0xffb46e, 1.2, 0xdcd6cf, 0.54],
    [22, 0x3c7cc4, 0xcde3ee, 0xffefd6, 1.55, 0xe6f2ff, 0.66],
    [70, 0x2e72c2, 0xc1e0f1, 0xfffaf0, 1.7, 0xeaf6ff, 0.72],
  ];

  let ctx = null, S = null, THREE = null, glowTex = null, skyMat = null, KFC = null;
  const ray = { rc: null, down: null };

  // ── أدوات الرسم ──
  function clearGroup(g) {
    for (const o of g.children.slice()) {
      g.remove(o);
      o.traverse((n) => {
        if (n.geometry) n.geometry.dispose();
        if (n.material) { const ms = Array.isArray(n.material) ? n.material : [n.material]; for (const m of ms) { if (m.map && m.map.__own) m.map.dispose(); m.dispose(); } }
      });
    }
  }
  function label(text, color, size) {
    const c = document.createElement('canvas'), g = c.getContext('2d'), F = '700 50px Tahoma, Arial, sans-serif';
    g.font = F; const w = Math.ceil(g.measureText(text).width) + 30; c.width = w; c.height = 74;
    const q = c.getContext('2d'); q.font = F;
    q.fillStyle = 'rgba(8,16,24,0.66)';
    if (q.roundRect) { q.beginPath(); q.roundRect(1, 1, w - 2, 72, 20); q.fill(); } else q.fillRect(0, 0, w, 74);
    q.fillStyle = color; q.textAlign = 'center'; q.textBaseline = 'middle'; q.fillText(text, w / 2, 39);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.__own = true;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true }));
    s.scale.set(size * w / 74, size, 1); s.renderOrder = 20; return s;
  }
  function glow(color, size, opacity) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: opacity == null ? 1 : opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.set(size, size, 1); s.renderOrder = 15; return s;
  }
  function tube(pts, radius, color, opacity) {
    if (pts.length < 2) return null;
    const curve = new THREE.CatmullRomCurve3(pts);
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.min(400, pts.length * 3), radius, 8, false),
      new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: opacity >= 1 }));
    return m;
  }
  function cap(b, color, opacity, lift) {
    const shape = new THREE.Shape(b.poly.map((p) => new THREE.Vector2(p[0], -p[1])));
    const m = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.position.y = b.h + (lift || 0.5); m.renderOrder = 5; return m;
  }

  // ── الشمس ──
  const dayBase = (doy) => Date.UTC(Y, 0, doy) - S.tz * 3600000; // منتصف الليل بتوقيت المكان التقريبيّ
  const sunAt = (doy, tmin) => CK.sunDir(S.lat, S.lon, dayBase(doy) + tmin * 60000);
  function dayInfo(doy) { // الشروق والغروب (−0.833°) بمسح كلّ ٤ دقائق ثمّ استيفاء خطّيّ، وذروة الشمس
    let rise = null, set = null, peak = -Math.PI, noon = 720, prev = sunAt(doy, 0).alt;
    if (prev > peak) { peak = prev; noon = 0; }
    for (let t = 4; t <= 1440; t += 4) {
      const a = sunAt(doy, t).alt;
      if (prev < H0 && a >= H0 && rise == null) rise = t - 4 + 4 * (H0 - prev) / (a - prev);
      if (prev >= H0 && a < H0) set = t - 4 + 4 * (prev - H0) / (prev - a);
      if (a > peak) { peak = a; noon = t; }
      prev = a;
    }
    if (rise == null && set == null) { // نهار قطبيّ أو ليل قطبيّ
      return peak > H0 ? { rise: 0, set: 1440, up: true, polar: 'day', peak, noon, len: 24 } : { rise: null, set: null, up: false, polar: 'night', peak, noon, len: 0 };
    }
    if (rise == null) rise = 0;
    if (set == null || set < rise) set = set == null ? 1440 : set + 1440;
    return { rise, set, up: true, peak, noon, len: (set - rise) / 60 };
  }
  function rayLen(P, s) { // طول المسار الأفقيّ الذي يكفي: حتّى يعلو الشعاع أطول مبنى أو يخرج من نطاق البيانات
    const alt = Math.max(s.alt, 0.5 * DEG), ux = Math.sin(s.az), uz = -Math.cos(s.az), tanA = Math.tan(alt);
    const lim = (S.maxH - P.y) / tanA; if (lim <= 0) return null;
    const au = P.x * ux + P.z * uz, c = P.x * P.x + P.z * P.z - S.Rd * S.Rd, disc = au * au - c;
    if (disc <= 0) return null;
    const L = Math.min(lim, -au + Math.sqrt(disc)); if (L <= 0.5) return null;
    return { ux, uz, tanA, L };
  }
  function clearTo(P, s) { // خطّ رؤية النواة نحو الشمس
    const r = rayLen(P, s); if (!r) return true;
    return S.idx.los(P, { x: P.x + r.ux * r.L, y: P.y + r.tanA * r.L, z: P.z + r.uz * r.L }, 2);
  }
  function blocker(P, s) { // نفس العيّنات التي يمشيها los، لكن يعيد المبنى الحاجب ومسافته
    const r = rayLen(P, s); if (!r) return null;
    const n = Math.max(1, Math.ceil(r.L / 2));
    for (let k = 1; k < n; k++) {
      const d = r.L * k / n, x = P.x + r.ux * d, z = P.z + r.uz * d, y = P.y + r.tanA * d;
      const b = S.idx.at(x, z); if (b && b.h > y) return { b, d };
    }
    return null;
  }
  function sunHours(P, doy, info, step) { // عيّنة كلّ ١٠ دقائق من الشروق إلى الغروب
    step = step || 10;
    if (!info.up) return { N: 0, lit: 0, hours: 0, samples: [], t0: 0, step };
    const N = Math.floor((info.set - info.rise) / step) + 1, samples = new Array(N);
    let lit = 0;
    for (let k = 0; k < N; k++) {
      const s = sunAt(doy, info.rise + k * step);
      const ok = s.alt > H0 && clearTo(P, s);
      samples[k] = ok ? 1 : 0; if (ok) lit++;
    }
    return { N, lit, hours: info.len * lit / N, samples, t0: info.rise, step };
  }

  // ── الواجهة ──
  let el = {};
  function panel(c) {
    ctx = c; THREE = c.THREE;
    // ظلال أنعم على الحاسوب، وإعداد الضوء الشمسيّ مرّة واحدة
    if (window.innerWidth > 640 && c.renderer.capabilities.maxTextureSize >= 8192) c.sun.shadow.mapSize.set(4096, 4096);
    c.sun.shadow.bias = -0.0004; c.sun.shadow.normalBias = 0.4;
    const g = document.createElement('canvas'); g.width = g.height = 128; const q = g.getContext('2d');
    const gr = q.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.75)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    q.fillStyle = gr; q.fillRect(0, 0, 128, 128);
    glowTex = new THREE.CanvasTexture(g); glowTex.colorSpace = THREE.SRGBColorSpace;
    KFC = KF.map((k) => ({ a: k[0], top: new THREE.Color(k[1]), hor: new THREE.Color(k[2]), sc: new THREE.Color(k[3]), si: k[4], hs: new THREE.Color(k[5]), hi: k[6] }));
    skyMat = new THREE.ShaderMaterial({
      uniforms: { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunC: { value: new THREE.Color() }, sunD: { value: new THREE.Vector3(0, 1, 0) }, sunV: { value: 1 } },
      vertexShader: 'varying vec3 vD;\nvoid main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform vec3 top; uniform vec3 hor; uniform vec3 sunC; uniform vec3 sunD; uniform float sunV; varying vec3 vD;\n' +
        'void main(){ vec3 d = normalize(vD); float h = d.y;\n' +
        ' vec3 c = mix(hor, top, pow(clamp(h, 0.0, 1.0), 0.45));\n' +
        ' c = mix(c, hor * 0.82, smoothstep(0.0, -0.2, h));\n' +
        ' float s = max(dot(d, normalize(sunD)), 0.0);\n' +
        ' c += sunC * (pow(s, 5.0) * 0.30 + pow(s, 60.0) * 0.55 + smoothstep(0.9990, 0.9996, s) * 1.6) * sunV;\n' +
        ' gl_FragColor = vec4(c, 1.0);\n#include <colorspace_fragment>\n}',
      side: THREE.BackSide, depthTest: false, depthWrite: false, fog: false,
    });

    const P = c.ui.panel;
    P.innerHTML =
      '<div class="sn-hint">' + ICON_SUN + '<span>' + T('المس أيّ سطح أو نقطة على الأرض لتحسب شمسها', 'Tap any roof or ground point to measure its sun') + '</span></div>' +
      '<div class="sn-pt" id="snPt"></div>' +
      '<div class="sn-ctl"><button class="sn-play" id="snPlay"></button><button class="ghost" id="snNow">' + T('الآن', 'Now') + '</button></div>' +
      '<div class="sn-lab"><span>' + T('الساعة', 'Time') + ' <small id="snTz"></small></span><b id="snTimeL"></b></div>' +
      '<input type="range" class="sn-r" id="snTime" min="0" max="1435" step="5" aria-label="' + T('الساعة', 'Time') + '">' +
      '<div class="sn-strip" id="snStrip"></div>' +
      '<div class="sn-ticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>' +
      '<div class="sn-lab"><span>' + T('التاريخ', 'Date') + '</span><b id="snDateL"></b></div>' +
      '<input type="range" class="sn-r" id="snDate" min="1" max="' + DAYS + '" step="1" aria-label="' + T('التاريخ', 'Date') + '">' +
      '<div class="sn-chips" id="snChips">' +
      '<button class="ghost" data-chip="today">' + T('اليوم', 'Today') + '</button>' +
      '<button class="ghost" data-chip="long">' + T('أطول نهار', 'Longest day') + '</button>' +
      '<button class="ghost" data-chip="short">' + T('أقصر نهار', 'Shortest day') + '</button>' +
      '<button class="ghost" data-chip="eq">' + T('الاعتدال', 'Equinox') + '</button></div>' +
      '<div class="sn-cards" id="snCards"></div>' +
      '<div class="sn-year"><div class="t"><span>' + T('شمس نقطتك على مدار السنة (يوم ٢١ من كلّ شهر)', 'Your spot\'s sun through the year (21st of each month)') + '</span></div><div id="snYear"></div><div class="t"><span id="snYearCap"></span></div></div>' +
      '<div class="sn-leg"><span><i style="background:#ffc94a"></i>' + T('مسار اليوم المختار', 'Chosen day path') + '</span><span><i style="background:#ff8a4c"></i>' + T('أطول نهار', 'Longest day') + '</span><span><i style="background:#8fc2ff"></i>' + T('أقصر نهار', 'Shortest day') + '</span></div>';
    el = {}; for (const id of ['snPt', 'snPlay', 'snNow', 'snTz', 'snTimeL', 'snTime', 'snStrip', 'snDateL', 'snDate', 'snChips', 'snCards', 'snYear', 'snYearCap']) el[id] = P.querySelector('#' + id);
    setPlayBtn(false);
    el.snTime.addEventListener('input', () => { if (!S) return; S.playing = false; setPlayBtn(false); S.t = +el.snTime.value; applyTime(); });
    el.snDate.addEventListener('input', () => { if (!S) return; S.doy = +el.snDate.value; S.dirtyDay = true; el.snDateL.textContent = dateLabel(S.doy); markChips(); });
    el.snPlay.addEventListener('click', () => play(!(S && S.playing)));
    el.snNow.addEventListener('click', () => { if (!S) return; const n = nowLocal(); S.doy = n.doy; S.t = n.t; S.playing = false; setPlayBtn(false); syncInputs(); recomputeDay(); });
    el.snChips.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || !S) return; setDoy(chipDoy(b.dataset.chip)); });
    el.snStrip.addEventListener('pointerdown', (e) => { if (!S) return; const r = el.snStrip.getBoundingClientRect(); const f = 1 - (e.clientX - r.left) / r.width; S.t = Math.max(0, Math.min(1435, Math.round(f * 1440 / 5) * 5)); S.playing = false; setPlayBtn(false); el.snTime.value = S.t; applyTime(); });
    el.snYear.addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (b && S) setDoy(mdToDoy(+b.dataset.m, 21)); });

    // اللمس للاختيار: ضغطة قصيرة بلا سحب (السحب يدير الكاميرا)
    const dom = c.renderer.domElement; const downs = new Map();
    ray.rc = new THREE.Raycaster();
    dom.addEventListener('pointerdown', (e) => { downs.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), multi: downs.size > 0 }); if (downs.size > 1) for (const d of downs.values()) d.multi = true; });
    const up = (e) => {
      const d = downs.get(e.pointerId); downs.delete(e.pointerId);
      if (!d || d.multi || e.type === 'pointercancel') return;
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 7 || performance.now() - d.t > 650) return;
      tap(e.clientX, e.clientY);
    };
    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
  }
  function setPlayBtn(on) { if (!el.snPlay) return; el.snPlay.classList.toggle('on', on); el.snPlay.innerHTML = (on ? ICON_PAUSE : ICON_PLAY) + '<span>' + (on ? T('إيقاف', 'Pause') : T('شغّل اليوم', 'Play the day')) + '</span>'; }
  function chipDoy(k) {
    const north = S.lat >= 0;
    if (k === 'today') return nowLocal().doy;
    if (k === 'long') return mdToDoy(north ? 5 : 11, 21);
    if (k === 'short') return mdToDoy(north ? 11 : 5, 21);
    return mdToDoy(2, 20);
  }
  function markChips() { for (const b of el.snChips.querySelectorAll('button')) b.classList.toggle('on', chipDoy(b.dataset.chip) === S.doy); }

    const n = nowLocal(); S.doy = n.doy;
    setPlayBtn(false);
    el.snTz.textContent = '(UTC' + (S.tz >= 0 ? '+' : '−') + Math.abs(S.tz) + T(' تقريبًا)', ' approx.)');
    S.sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), skyMat); S.sky.renderOrder = -10; S.sky.frustumCulled = false; city.group.add(S.sky);
    S.gPick = new THREE.Group(); S.gArc = new THREE.Group(); city.group.add(S.gPick, S.gArc);
    syncInputs();
    // نقطة البداية: مركز الحيّ (سطح إن كان فيه مبنى)
    pickWorld(0, 0, true);
    const St = S;
    c.onFrame((dt, now) => {
      if (S !== St) return;
      S.sky.position.copy(c.camera.position);
      c.scene.fog.near = Math.max(c.R * 1.2, c.orbit.dist * 0.95); c.scene.fog.far = c.scene.fog.near + c.R * 2.6;
      if (S.dirtyDay) recomputeDay();
      const rdt = Math.min(0.5, (now - (S.lastNow || now)) / 1000); S.lastNow = now; // سرعة التشغيل لا تتبع عدد الإطارات
      if (S.playing) {
        const i = S.info; let t = S.t + rdt * 80;
        if (!i.up) t = t % 1440; else if (i.polar) t = t % 1440; else if (t > i.set + 30) t = Math.max(0, i.rise - 40);
        if (t > 1435) t = 0;
        S.t = t; applyTime();
      }
      if (S.fly) {
        const f = S.fly; if (!f.s) f.s = now; f.k = Math.min(1, (now - f.s) / 1300); /* بالزمن الحقيقيّ لا بعدد الإطارات */ const e = f.k < 0.5 ? 4 * f.k * f.k * f.k : 1 - Math.pow(-2 * f.k + 2, 3) / 2, o = c.orbit;
        o.target.lerpVectors(f.t0, f.t1, e); o.dist = f.d0 + (f.d1 - f.d0) * e; o.theta = f.th0 + (f.th1 - f.th0) * e; o.phi = f.ph0 + (f.ph1 - f.ph0) * e; o.apply();
        if (f.k >= 1) S.fly = null;
      }
      if (S.markRing) { const p = 1 + ((now / 1400) % 1) * 1.6; S.markRing.scale.set(p, p, 1); S.markRing.material.opacity = 0.95 * (1 - ((now / 1400) % 1)) + 0.1; }
      if (S.sunGlow) { const q = S.RA * (0.4 + 0.03 * Math.sin(now / 300)); S.sunGlow.scale.set(q, q, 1); }
    });
  }

  window.__sun = {
    tap, pick: (x, z, full) => pickWorld(x, z, !!full),
    setDate: (m, d) => setDoy(mdToDoy(m - 1, d)),
    setTime: (hm) => { const t = typeof hm === 'string' ? (+hm.split(':')[0]) * 60 + (+hm.split(':')[1]) : +hm; S.t = Math.max(0, Math.min(1435, t)); S.playing = false; setPlayBtn(false); applyTime(); },
    play: (on) => play(on !== false),
    check: (x, z, m, d, hm) => { // للاختبار: نفس الحساب لنقطة وتاريخ بلا تغيير المشهد
      const doy = mdToDoy(m - 1, d), info = dayInfo(doy), t = (+hm.split(':')[0]) * 60 + (+hm.split(':')[1]);
      const P = { x, y: (S.idx.heightAt(x, z) || 0) + 0.3, z }, s = sunAt(doy, t), bk = blocker(P, s);
      return { rise: fmt(info.rise), set: fmt(info.set), lenH: r1(info.len), hours: r1(sunHours(P, doy, info, 10).hours), alt: r1(s.alt / DEG), los: s.alt > H0 && clearTo(P, s), blocker: bk ? r1(bk.b.h) : null };
    },
  };

  CK.start({
    title: T('شمس بيتك ساعة بساعة', 'Your home\'s sun, hour by hour'),
    sub: T('المس سطحك أو أيّ نقطة، وحرّك التاريخ والساعة: الشمس والظلال حقيقيّة لمكانك.', 'Tap your roof or any spot, then move the date and hour: the sun and shadows are real for your place.'),
    shadows: true, panel, onCity,
  });
})();
</script></body></html>
