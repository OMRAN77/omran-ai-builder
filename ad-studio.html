<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استوديو الإعلانات — عمران AI</title>
<script src="/i18n/ad-studio.js?v=602"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:#0e1013;color:#e8eaed;padding:20px 14px 70px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:24px;font-weight:900}
.sub{color:#9aa3ad;font-size:13.5px;margin-top:6px;line-height:1.7}
.note{display:inline-block;margin-top:10px;background:#1f2a1f;border:1px solid #2f5132;color:#9ae6a4;font-size:12px;padding:5px 12px;border-radius:99px}
a.back{display:inline-block;margin-top:10px;margin-right:8px;color:#8b939d;font-size:12px;text-decoration:none;border:1px solid #2b3038;padding:5px 12px;border-radius:99px}

/* ===== المحادثة — على نمط الشات ===== */
.chat{max-width:720px;margin:22px auto 0;background:#fff;color:#0d0d0d;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.chead{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid #ececec;font-size:13px;color:#5d5d5d}
.chead b{font-weight:800;color:#0d0d0d;font-size:14px}
.cbody{padding:16px 16px 6px;min-height:210px;max-height:60vh;overflow-y:auto}
.m{margin-bottom:16px;font-size:15px;line-height:1.85}
.m.u{display:flex;justify-content:flex-start}
.m.u span{background:#ececec;padding:9px 15px;border-radius:20px;max-width:82%}
.m.a{color:#0d0d0d;white-space:pre-wrap}
.m.a b{font-weight:800}
.dots span{display:inline-block;width:7px;height:7px;margin-left:3px;border-radius:50%;background:#c3c3c3;animation:bp 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 12px}
.chip{background:#fff;border:1px solid #d9d9d9;color:#0d0d0d;font:600 13px 'Tajawal';padding:7px 14px;border-radius:99px;cursor:pointer}
.chip:hover{background:#f3f3f3}
.comp{display:flex;align-items:center;gap:8px;padding:10px 12px 14px;border-top:1px solid #ececec}
.comp input{flex:1;border:1px solid #d9d9d9;border-radius:99px;padding:12px 18px;font:400 15px 'Tajawal';outline:none}
.comp input:focus{border-color:#b5b5b5}
.snd{width:40px;height:40px;border-radius:50%;background:#0d0d0d;color:#fff;border:0;font-size:17px;cursor:pointer;flex:none}
.snd:disabled{background:#d3d3d3;cursor:default}

/* ===== المعرض ===== */
.gwrap{display:none;margin-top:34px}
.gwrap.on{display:block}
.gtitle{font-size:19px;font-weight:900}
.dragbar{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:12px;color:#8b939d;flex-wrap:wrap}
.rst,.rstAll{background:#1c1f25;border:1px solid #2b3038;color:#cbd2da;font:600 11px 'Tajawal';padding:4px 10px;border-radius:99px;cursor:pointer}
.rst{margin-right:auto}
.genB{background:linear-gradient(135deg,#a855f7,#22d3ee);border:0;color:#0b0d10;font:800 11.5px 'Tajawal';padding:5px 13px;border-radius:99px;cursor:pointer}
.genB:disabled{opacity:.55;cursor:default}
.rtb{display:inline-flex;gap:4px;margin:0 6px;vertical-align:middle}
.rtb button{background:#1c1f25;border:1px solid #2b3038;color:#8b939d;font:700 11px 'Tajawal';padding:4px 10px;border-radius:99px;cursor:pointer}
.rtb button.on{background:rgba(34,211,238,.14);border-color:#22d3ee;color:#cbd2da}
#genOut{display:none;margin-top:18px}
#genOut.on{display:block}
#genOut h3{font-size:13px;font-weight:700;color:#c9d1d9;margin-bottom:9px}
#genOut img{max-width:min(420px,100%);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.5);display:block}
#genOut a{display:inline-block;margin-top:9px;background:#1c1f25;border:1px solid #2b3038;color:#cbd2da;font:700 12px 'Tajawal';padding:7px 14px;border-radius:99px;text-decoration:none}
.gwait{color:#9aa3ad;font:600 12.5px 'Tajawal';padding:14px;border:1px dashed #2b3038;border-radius:12px}
.rst:hover,.rstAll:hover{background:#262b33}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:20px;align-items:start}
.col h3{font-size:13px;font-weight:700;color:#c9d1d9;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.col h3 i{width:7px;height:7px;border-radius:50%;background:var(--ac);display:inline-block}
.cap{color:#7e868f;font-size:11.5px;line-height:1.7;margin-top:8px}
.pick{display:block;width:100%;margin-top:8px;background:#161a20;border:1px solid #2b3038;color:#cbd2da;font:700 12px 'Tajawal';padding:8px;border-radius:9px;cursor:pointer}
.pick:hover{background:#1f242c;border-color:var(--ac);color:#fff}
.col.chosen .pick{background:var(--ac);color:#12141a;border-color:var(--ac)}
.col.chosen .canvas{outline:2px solid var(--ac);outline-offset:3px}

.canvas{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:14px;background:#07090c;box-shadow:0 10px 34px rgba(0,0,0,.5);cursor:zoom-in;color:var(--ink);--ink:#fff;--ink-soft:rgba(255,255,255,.66)}
body.ink .canvas{--ink:#0b0d10;--ink-soft:rgba(11,13,16,.66)}
body.ink .canvas .bg{filter:brightness(1.5) saturate(.92)}
body.ink .canvas .ovl.veil,body.ink .canvas .ovl.tint,body.ink .canvas .ovl.soft,body.ink .canvas .ovl.vig,body.ink .canvas .ovl.nv,body.ink .canvas .ovl.hpan{background:linear-gradient(to top,rgba(255,255,255,.90) 2%,rgba(255,255,255,.60) 24%,rgba(255,255,255,.20) 56%,rgba(255,255,255,.34) 100%)}
body.ink .canvas .ibd,body.ink .canvas .icard,body.ink .canvas .ibar span,body.ink .canvas .stamp{background:rgba(255,255,255,.62)}
body.ink .canvas.noImg,body.ink .canvas.I{background:linear-gradient(165deg,#f2f4f7 0%,#dfe3e9 100%)}
body.ink .I h2{text-shadow:0 0 10px rgba(255,255,255,.9)}
.canvas.noImg{background:var(--grad)}
.canvas .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.zoomWrap{position:fixed;inset:0;background:rgba(4,6,9,.94);z-index:99;display:none;align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
.zoomWrap.on{display:flex}
.zoomWrap .canvas{width:min(560px,92vw);max-height:94vh;cursor:zoom-out;box-shadow:0 24px 70px rgba(0,0,0,.8)}
.zhint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:#8b939d}

/* أ — سينمائيّ */
.A .ovl.veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.90) 2%,rgba(0,0,0,.58) 15%,rgba(0,0,0,.06) 33%,transparent 55%,transparent 84%,rgba(0,0,0,.34) 100%)}
.A .kick{position:absolute;top:20px;right:20px;font:700 11px/1 'Tajawal';color:var(--ink);opacity:.9}
.A .rule{position:absolute;top:40px;right:20px;width:26px;height:2px;background:var(--ac)}
.A .body{position:absolute;right:22px;left:22px;bottom:20px}
.A h2{font-size:28px;font-weight:900;line-height:1.15;text-shadow:0 2px 22px rgba(0,0,0,.7)}
.A .spec{margin-top:9px;font-size:12px;color:var(--ink-soft);line-height:1.7}
.A .foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px;padding-top:13px;border-top:1px solid rgba(255,255,255,.18)}
.A .pr{font-size:38px;font-weight:900;color:var(--ac);line-height:.9}
.A .pr em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px}
.A .tel{font-size:14px;font-weight:700;color:var(--ink);text-align:left;opacity:.95}
.A .tel em{font-style:normal;display:block;font-size:10px;font-weight:500;color:var(--ink-soft);margin-bottom:3px}

/* ب — طبقات */
.B{background:var(--grad)}
.B .ovl.glow{position:absolute;left:50%;top:38%;width:88%;height:44%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,var(--ac) 0%,transparent 68%);opacity:.22;filter:blur(14px)}
.B .ghost{position:absolute;left:0;right:0;top:30%;transform:translateY(-50%);text-align:center;font-weight:900;line-height:.85;color:transparent;-webkit-text-stroke:1.7px rgba(255,255,255,.72);white-space:nowrap;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45));z-index:4}
.B .arch{position:absolute;left:50%;bottom:19%;transform:translateX(-50%);width:69%;aspect-ratio:3/4.15;border-radius:999px 999px 12px 12px;overflow:hidden;box-shadow:0 26px 44px rgba(0,0,0,.55)}
.B .arch img{width:100%;height:100%;object-fit:cover}
.B .top{position:absolute;top:19px;right:20px;left:20px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--ink-soft)}
.B .top b{color:var(--ac);font-weight:900}
.B h2{position:absolute;right:20px;left:20px;bottom:13%;text-align:center;font-size:22px;font-weight:900;line-height:1.2;text-shadow:0 3px 18px rgba(0,0,0,.6)}
.B .bar{position:absolute;right:20px;left:20px;bottom:20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.16);padding-top:11px}
.B .p{font-size:26px;font-weight:900;color:var(--ac);line-height:1}
.B .p em{font-style:normal;font-size:11px;color:var(--ink-soft);font-weight:600}
.B .t{font-size:13px;font-weight:700;color:var(--ink-soft)}
.B .chps{position:absolute;right:20px;left:20px;bottom:8.5%;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:10.5px;color:var(--ink-soft)}

/* ج — ملصق حرّ */
.C .ovl.tint{position:absolute;inset:0;background:linear-gradient(145deg,rgba(0,0,0,.44) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 56%,rgba(0,0,0,.58) 100%)}
.C h2{position:absolute;right:16px;top:26%;font-size:32px;font-weight:900;line-height:1.02;transform:rotate(-5.5deg);transform-origin:right center;text-shadow:0 4px 26px rgba(0,0,0,.75);max-width:78%}
.C h2 u{text-decoration:none;color:var(--ac);display:block}
.C .slash{position:absolute;right:16px;top:22%;width:52%;height:3px;background:var(--ac);transform:rotate(-5.5deg);transform-origin:right center}
.C .stamp{position:absolute;left:16px;top:7%;width:86px;height:86px;border-radius:50%;border:1.5px solid var(--ac);background:rgba(0,0,0,.34);backdrop-filter:blur(3px);display:grid;place-content:center;text-align:center;transform:rotate(-11deg);line-height:1.15}
.C .stamp b{display:block;font-size:19px;font-weight:900;color:var(--ac)}
.C .stamp i{font-style:normal;font-size:9.5px;color:var(--ink-soft)}
.C .scat{position:absolute;right:18px;bottom:23%;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.C .scat span{font-size:11px;font-weight:600;color:var(--ink-soft);background:rgba(0,0,0,.3);padding:2px 0}
.C .telc{position:absolute;left:16px;bottom:18px;text-align:left;transform:rotate(-2deg)}
.C .telc b{display:block;font-size:15px;font-weight:900;color:var(--ink)}
.C .telc i{font-style:normal;font-size:9.5px;color:var(--ink-soft)}

/* د — أنيق */
.D .ovl.soft{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.12) 34%,rgba(0,0,0,.05) 62%,rgba(0,0,0,.5) 100%)}
.D .ovl.frm{position:absolute;inset:16px;border:1px solid rgba(255,255,255,.42)}
.D .dk{position:absolute;top:34px;right:0;left:0;text-align:center;font:600 10px 'Tajawal';letter-spacing:5px;color:var(--ink-soft)}
.D h2{position:absolute;right:30px;left:30px;bottom:32%;text-align:center;font-size:27px;font-weight:400;line-height:1.35;letter-spacing:1px}
.D .dl{position:absolute;left:50%;bottom:29%;transform:translateX(-50%);width:44px;height:1px;background:var(--ac)}
.D .dsp{position:absolute;right:30px;left:30px;bottom:23%;text-align:center;font-size:11.5px;color:var(--ink-soft);line-height:1.8}
.D .dpr{position:absolute;right:0;left:0;bottom:12%;text-align:center;font-size:22px;font-weight:800;color:var(--ac)}
.D .dpr em{font-style:normal;font-size:10px;font-weight:500;color:var(--ink-soft);display:block;letter-spacing:3px;margin-bottom:4px}
.D .dtl{position:absolute;right:0;left:0;bottom:34px;text-align:center;font:700 12.5px 'Tajawal';color:var(--ink);letter-spacing:1px}

/* هـ — جريء */
.E .ovl.tint{position:absolute;inset:0;background:linear-gradient(200deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.85) 100%)}
.E .band{position:absolute;right:-6%;top:15%;width:112%;padding:7px 0;background:var(--ac);color:#111;font:900 13px 'Tajawal';text-align:center;transform:rotate(-4deg);letter-spacing:1px}
.E h2{position:absolute;right:18px;left:18px;bottom:31%;font-size:40px;font-weight:900;line-height:.98;text-shadow:0 5px 24px rgba(0,0,0,.6)}
.E .ech{position:absolute;right:18px;bottom:26%;display:flex;gap:6px;flex-wrap:wrap}
.E .ech span{font:700 10.5px 'Tajawal';border:1px solid rgba(255,255,255,.45);border-radius:99px;padding:3px 10px;color:var(--ink)}
.E .epr{position:absolute;right:18px;bottom:18px;background:var(--ac);color:#111;font:900 26px 'Tajawal';padding:6px 16px 8px;border-radius:10px;line-height:1}
.E .epr em{font-style:normal;font-size:10px;font-weight:700;display:block;opacity:.75}
.E .etl{position:absolute;left:18px;bottom:22px;text-align:left;font:900 16px 'Tajawal';color:var(--ink)}
.E .etl em{font-style:normal;display:block;font-size:9.5px;font-weight:500;color:var(--ink-soft)}

/* و — فخم */
.F .ovl.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.06) 0%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.9) 100%)}
.F .ovl.frm{position:absolute;inset:13px;border:1px solid var(--ac);opacity:.55}
.F .ovl.frm2{position:absolute;inset:19px;border:1px solid rgba(255,255,255,.16)}
.F .mono{position:absolute;top:36px;left:50%;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;border:1px solid var(--ac);display:grid;place-content:center;font:900 19px 'Tajawal';color:var(--ac)}
.F .fk{position:absolute;top:100px;right:0;left:0;text-align:center;font:600 9.5px 'Tajawal';letter-spacing:6px;color:var(--ink-soft)}
.F h2{position:absolute;right:26px;left:26px;bottom:35%;text-align:center;font-size:26px;font-weight:800;line-height:1.3;color:var(--ink)}
.F .fl{position:absolute;left:50%;bottom:32%;transform:translateX(-50%);width:70px;height:1px;background:var(--ac);opacity:.8}
.F .fsp{position:absolute;right:26px;left:26px;bottom:25%;text-align:center;font-size:11.5px;color:var(--ink-soft);line-height:1.85}
.F .fpr{position:absolute;right:0;left:0;bottom:14%;text-align:center;font:900 27px 'Tajawal';color:var(--ac)}
.F .fpr em{font-style:normal;display:block;font-size:10px;font-weight:500;letter-spacing:3px;color:var(--ink-soft);margin-bottom:5px}
.F .ftl{position:absolute;right:0;left:0;bottom:36px;text-align:center;font:700 13px 'Tajawal';color:var(--ink-soft);letter-spacing:1px}

/* ز — بسيط */
.G .ovl.tint{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.18) 26%,transparent 46%)}
.G h2{position:absolute;right:22px;left:22px;bottom:74px;font-size:25px;font-weight:800;line-height:1.25}
.G .gsp{position:absolute;right:22px;left:22px;bottom:52px;font-size:11.5px;color:var(--ink-soft)}
.G .gpill{position:absolute;right:22px;bottom:18px;background:var(--ac);color:#111;font:900 14px 'Tajawal';padding:6px 14px;border-radius:99px}
.G .gtl{position:absolute;left:22px;bottom:22px;font:700 13px 'Tajawal';color:var(--ink-soft)}

/* ح — مجلّة */
.H .ovl.hph{position:absolute;top:0;right:0;left:0;height:62%;overflow:hidden}
.H .ovl.hph img{width:100%;height:100%;object-fit:cover;object-position:center 42%}
.H .ovl.hpan{position:absolute;bottom:0;right:0;left:0;height:38%;background:#101216}
.H .hnum{position:absolute;top:calc(62% - 34px);right:20px;font:900 46px 'Tajawal';color:var(--ac);line-height:1;opacity:.95}
.H .hk{position:absolute;top:calc(62% + 20px);right:20px;font:700 10px 'Tajawal';letter-spacing:3px;color:var(--ac)}
.H h2{position:absolute;right:20px;left:20px;top:calc(62% + 40px);font-size:23px;font-weight:900;line-height:1.2;color:var(--ink)}
.H .hsp{position:absolute;right:20px;left:20px;top:calc(62% + 78px);font-size:11.5px;color:var(--ink-soft);line-height:1.7}
.H .hbar{position:absolute;right:20px;left:20px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(255,255,255,.14);padding-top:10px}
.H .hbar b{font:900 21px 'Tajawal';color:var(--ac)}
.H .hbar b em{font-style:normal;font-size:10px;font-weight:600;color:var(--ink-soft);display:block}
.H .hbar span{font:700 13px 'Tajawal';color:var(--ink)}

/* ط — نيون (ستوري عموديّ) */
.canvas.I{aspect-ratio:9/16;background:#05060a}
.I .bg{opacity:.62;object-position:center 46%}
.I .ovl.ng{position:absolute;left:50%;top:33%;width:126%;height:54%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,var(--ac) 0%,transparent 63%);opacity:.32;filter:blur(4px)}
.I .ovl.nv{position:absolute;inset:0;background:linear-gradient(to top,#05060a 3%,rgba(5,6,10,.74) 24%,rgba(5,6,10,.16) 50%,rgba(5,6,10,.30) 78%,rgba(5,6,10,.62) 100%)}
.I .ibd{position:absolute;top:15px;left:50%;transform:translateX(-50%);font:800 10px/1 'Tajawal';letter-spacing:2px;color:var(--ink);padding:6px 15px;border:1px solid var(--ac);border-radius:99px;background:rgba(0,0,0,.34);box-shadow:0 0 13px var(--ac),inset 0 0 9px rgba(255,255,255,.07);white-space:nowrap}
.I h2{position:absolute;left:0;right:0;top:13%;text-align:center;font-family:'Tajawal';font-weight:900;line-height:.94;color:var(--ink);text-shadow:0 0 5px var(--ac),0 0 20px var(--ac),0 0 46px var(--ac);padding:0 12px}
.I .isub{position:absolute;left:0;right:0;top:26.5%;display:flex;align-items:center;justify-content:center;gap:9px;font:700 11px 'Tajawal';color:var(--ink);opacity:.93;padding:0 16px}
.I .isub:before,.I .isub:after{content:'';height:1px;flex:1;max-width:54px;background:linear-gradient(to right,transparent,var(--ac))}
.I .icard{position:absolute;left:50%;bottom:14.5%;transform:translateX(-50%);text-align:center;padding:8px 22px 10px;border:1px solid var(--ac);border-radius:12px;background:rgba(0,0,0,.44);box-shadow:0 0 15px var(--ac),inset 0 0 13px rgba(255,255,255,.05)}
.I .icard em{display:block;font-style:normal;font:700 9px 'Tajawal';letter-spacing:2px;color:var(--ink);opacity:.6}
.I .icard b{font:900 25px 'Tajawal';color:var(--ink);text-shadow:0 0 9px var(--ac)}
.I .ibar{position:absolute;left:11px;right:11px;bottom:13px;display:flex;gap:5px}
.I .ibar span{flex:1;text-align:center;font:700 8.5px 'Tajawal';color:var(--ink);padding:7px 2px;border:1px solid var(--ac);border-radius:8px;background:rgba(0,0,0,.36);box-shadow:inset 0 0 9px var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ي — بطاقة مواصفات */
.canvas.J{aspect-ratio:3/4;background:#0a0806}
.canvas.J.noImg{background:var(--grad)}
.J .bg{height:56%;bottom:auto;object-position:center 48%}
.J .ovl.jv{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,8,6,.74) 0%,rgba(10,8,6,.30) 17%,rgba(10,8,6,.08) 33%,rgba(10,8,6,.88) 51%,#0a0806 59%)}
.J .jbd{position:absolute;top:13px;left:50%;transform:translateX(-50%);font:900 15px/1 'Tajawal';letter-spacing:5px;color:var(--ac);padding:6px 26px;border:2px solid var(--ac);border-radius:7px;background:rgba(0,0,0,.38);white-space:nowrap}

/* لون الكتابة — أبيض/أسود بلا لمس الخلفيّة */
body.inkw .canvas{--ink:#fff;--ink-soft:rgba(255,255,255,.72)}

:is(body.inkw,body.inkb) .canvas :is(.pr,.p,.dpr,.fpr,.hnum,.hk,.hbar b,.mono,.stamp b,.top b,h2 u,.jbd,.jgrid span i,.jrow b,.jloc b,.jnote b){color:var(--ink)}

.swat b.w{background:#fff}
.swat b.k{background:#0b0d10;border-color:#5a626c}
.dlB{display:block;width:100%;margin-top:6px;background:#161a20;border:1px solid #2b3038;color:#cbd2da;font:700 12px 'Tajawal';padding:7px;border-radius:9px;cursor:pointer}
.dlB:hover{border-color:var(--ac);color:#fff}
.dlB:disabled{opacity:.6;cursor:default}

/* تحديد + تكبير */
.canvas .drg.sel{outline:1.5px dashed var(--ac);outline-offset:3px}

<body>
<div class="wrap">
  <h1 data-i18n="h1">استوديو الإعلانات — تحدّث، ثمّ اختر تصميمك</h1>
  <div class="sub" data-i18n="sub">تكتب ما تريد الإعلان عنه بكلامك، تُجيب عن سؤالين، ترفع صورتك — فتخرج تسعة تصاميم جاهزة تختار منها.</div>
  <a class="back" href="/" data-i18n="back">← رجوع إلى التطبيق</a>

  <div class="chat">
    <div class="chead"><b data-i18n="asstName">مساعد الإعلانات</b><span id="stepLbl" data-i18n="stepStart">ابدأ</span></div>
    <div class="cbody" id="cbody"></div>
    <div class="chips" id="chips"></div>
    <div class="comp">
      <input id="inp" placeholder="اكتب هنا…" data-i18n="[placeholder]inpPh" autocomplete="off">
      <button class="snd" id="snd">↑</button>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" style="display:none">

  <div class="gwrap" id="gwrap">
    <div class="gtitle" data-i18n="gTitle">عشرة تصاميم — اختر واحدًا</div>
    <div class="dragbar"><span data-i18n="dragHint">اسحب أيّ نصّ — والمسه ثمّ كبّره أو صغّره</span><span class="szb"><button id="szM">−</button><button id="szP">+</button></span><span class="swat" id="sw"></span><span class="rtb" id="rt" data-i18n="[title]ratioTitle"><button data-r="square" data-i18n="rSquare">◻ مربّع</button><button data-r="tall" class="on" data-i18n="rTall">▯ طولي</button><button data-r="wide" data-i18n="rWide">▭ عرضي</button></span><button class="genB" id="genB"></button><button class="rstAll" id="inkT"></button><button class="rstAll" data-i18n="resetAll">أعِد الكلّ لأصله</button></div>
    <div id="genOut"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="zoomWrap" id="zoomWrap"><div class="zhint" data-i18n="zoomHint">اضغط في أي مكان للإغلاق</div></div>
</div>

<script>
const TOKEN=(()=>{try{return localStorage.getItem('aiapp_auth_token')||''}catch(e){return''}})();
/* ============ i18n — قاموس مستقلّ لهذه الصفحة: /i18n/ad-studio.js ============ */
const AL=(()=>{try{return localStorage.getItem('aiapp_lang')||'ar'}catch(e){return'ar'}})();
const ADX=window.ADI18N||{}, ADD=ADX[AL]||ADX.en||{}, ADE=ADX.en||{};
const ARN=(AL==='ar'||AL==='ur');                      // الأرقام العربيّة-الهنديّة لهاتين فقط
function T(k,v){ let x=ADD[k]!==undefined?ADD[k]:(ADE[k]!==undefined?ADE[k]:k);
  if(v) for(const p in v) x=String(x).split('{'+p+'}').join(v[p]);
  return x; }
function NU(n){ return ARN?String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):String(n); }
function step(n,m){ return n?T('stepOf',{n:NU(n),m:NU(m||4)}):T('stepReady'); }
document.documentElement.lang=AL; document.documentElement.dir=T('dir')||'ltr';
document.title=T('pageTitle');
document.querySelectorAll('[data-i18n]').forEach(el=>{
  const r=el.getAttribute('data-i18n'), m=r.match(/^\[(.+)\]([\s\S]+)$/);
  if(m) el.setAttribute(m[1],T(m[2])); else el.textContent=T(r); });
/* ================= الفئات ================= */
const CH = k => [1,2,3].map(i => T('chip_'+k+'_'+i));
const CATS = {
  car:{n:T('cat_car'),ic:'🚗',ac:'#e0a94a',grad:'linear-gradient(165deg,#5b452c 0%,#1a1410 62%,#0b0908 100%)',kick:T('kick_car'),unit:T('unitAed'),demo:'/assets/ad/car.webp',
    spec:T('spec_car'),chips:CH('car'),title:T('title_car'),price:'49000',
    intro:T('intro_car'),
    q1:T('q1_car'),q2:T('q2_car')},
  flat:{n:T('cat_flat'),ic:'🏠',ac:'#c9a97a',grad:'linear-gradient(165deg,#6a5c49 0%,#221d18 62%,#0e0c0a 100%)',kick:T('kick_flat'),unit:T('unitAedYear'),demo:'/assets/ad/flat.webp',
    spec:T('spec_flat'),chips:CH('flat'),title:T('title_flat'),price:'145000',
    intro:T('intro_flat'),
    q1:T('q1_flat'),q2:T('q2_flat')},
  food:{n:T('cat_food'),ic:'🍽️',ac:'#e2703a',grad:'linear-gradient(165deg,#5c3320 0%,#1d1310 62%,#0b0806 100%)',kick:T('kick_food'),unit:T('unitAed'),demo:'/assets/ad/food.webp',
    spec:T('spec_food'),chips:CH('food'),title:T('title_food'),price:'39',
    intro:T('intro_food'),
    q1:T('q1_food'),q2:T('q2_food')},
  shop:{n:T('cat_shop'),ic:'👗',ac:'#d76a9a',grad:'linear-gradient(165deg,#5a2f43 0%,#1e1218 62%,#0c0709 100%)',kick:T('kick_shop'),unit:T('unitAed'),demo:null,
    spec:T('spec_shop'),chips:CH('shop'),title:T('title_shop'),price:'199',
    intro:T('intro_shop'),
    q1:T('q1_shop'),q2:T('q2_shop')},
  clinic:{n:T('cat_clinic'),ic:'🩺',ac:'#4aa8d8',grad:'linear-gradient(165deg,#20415a 0%,#101a22 62%,#080c0f 100%)',kick:T('kick_clinic'),unit:T('unitAed'),demo:null,
    spec:T('spec_clinic'),chips:CH('clinic'),title:T('title_clinic'),price:'250',
    intro:T('intro_clinic'),
    q1:T('q1_clinic'),q2:T('q2_clinic')},
  salon:{n:T('cat_salon'),ic:'💇',ac:'#c69adf',grad:'linear-gradient(165deg,#4a3358 0%,#1a1220 62%,#0a070c 100%)',kick:T('kick_salon'),unit:T('unitAed'),demo:null,
    spec:T('spec_salon'),chips:CH('salon'),title:T('title_salon'),price:'149',
    intro:T('intro_salon'),
    q1:T('q1_salon'),q2:T('q2_salon')},
  service:{n:T('cat_service'),ic:'🛠️',ac:'#5fb98a',grad:'linear-gradient(165deg,#25493a 0%,#111c17 62%,#070c09 100%)',kick:T('kick_service'),unit:T('unitAed'),demo:null,
    spec:T('spec_service'),chips:CH('service'),title:T('title_service'),price:'120',
    intro:T('intro_service'),
    q1:T('q1_service'),q2:T('q2_service')},
  other:{n:T('cat_other'),ic:'✨',ac:'#7fb2f0',grad:'linear-gradient(165deg,#2b3a54 0%,#141a24 62%,#080a0e 100%)',kick:T('kick_other'),unit:T('unitAed'),demo:null,
    spec:T('spec_other'),chips:CH('other'),title:T('title_other'),price:'0',
    intro:T('intro_other'),
    q1:T('q1_other'),q2:T('q2_other')}
};
const KW = {car:['سيار','سيّار','مرسيدس','تويوتا','لكزس','نيسان','لاندكروز','باترول','هوندا','مركبة','موتر','كامري','بي ام'],
 flat:['شقّ','شقه','شقة','فيلا','عقار','أرض','ارض','بيت','استوديو','مكتب','محل','ايجار','إيجار','سكن'],
 food:['مطعم','طبخ','أكل','اكل','طبق','برجر','بيتزا','كافيه','قهوة','حلوي','حلوى','مندي','مشاوي','وجب'],
 shop:['ملابس','عبا','أزياء','ازياء','متجر','منتج','عطر','حقيب','ساع','جزم','فستان','قميص','تشكيل'],
 clinic:['عياد','طبيب','أسنان','اسنان','علاج','مستشفى','جلد','تجميل طبي','فحص','استشار'],
 salon:['صالون','شعر','مكياج','بشرة','مساج','سبا','أظافر','اظافر','حلاق','حنّ','حنا'],
 service:['خدم','صيان','تنظيف','نقل','عفش','سباك','كهرب','تكييف','نجار','دهان','برمج','تصميم','محاسب']};
/* كلمات لاتينيّة — الكشف كان عربيًّا فقط فيسقط كلّ مستخدم أجنبيّ إلى «شيء آخر». */
const KWE = {car:['car','vehicle','toyota','nissan','lexus','mercedes','bmw','honda','patrol','cruiser','suv','sedan','mileage','automatic'],
 flat:['apartment','flat','villa','property','studio','office','land','plot','rent','bedroom','sqft','estate','tenant','freehold'],
 food:['restaurant','food','dish','burger','pizza','cafe','coffee','menu','meal','delivery','bakery','grill','sushi','shawarma'],
 shop:['shop','store','fashion','clothes','dress','abaya','perfume','bag','watch','shoes','collection','boutique','product','sale'],
 clinic:['clinic','dental','dentist','doctor','medical','hospital','skin','treatment','consultation','therapy','checkup','implant'],
 salon:['salon','hair','makeup','spa','massage','nails','beauty','barber','facial','henna','lashes'],
 service:['service','repair','cleaning','moving','plumber','electrician','carpenter','painting','handyman','accounting','maintenance','plumbing','ac unit']};

/* ================= الحالة ================= */
const S = {cat:null, title:'', spec:'', price:'', unit:'', tel:'', kick:'', chips:null, facts:null, place:'', note:'', img:null, step:0, chosen:null, ratio:'tall'};
const cb=document.getElementById('cbody'), chipsEl=document.getElementById('chips'),
      inp=document.getElementById('inp'), snd=document.getElementById('snd'),
      fileEl=document.getElementById('file'), stepLbl=document.getElementById('stepLbl');

function push(who,txt){
  const d=document.createElement('div'); d.className='m '+who;
  if(who==='u'){ const s=document.createElement('span'); s.textContent=txt; d.appendChild(s); }
  else d.innerHTML=txt;
  cb.appendChild(d); cb.scrollTop=cb.scrollHeight; return d;
}
function say(txt,after){
  const t=document.createElement('div'); t.className='m a dots';
  t.innerHTML='<span></span><span></span><span></span>'; cb.appendChild(t); cb.scrollTop=cb.scrollHeight;
  setTimeout(()=>{ t.remove(); push('a',txt); if(after) after(); }, 520);
}
function setChips(list){
  chipsEl.innerHTML='';
  list.forEach(c=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=c.t;
    b.onclick=c.f; chipsEl.appendChild(b); });
}
function detect(t){
  const lo=String(t).toLowerCase();
  for(const k in KW) if(KW[k].some(w=>t.includes(w))||(KWE[k]||[]).some(w=>lo.includes(w))) return k;
  return null;
}
function fmtNum(x){
  const d=String(x).replace(/\D/g,''); if(!d) return x;
  const g=d.replace(/\B(?=(\d{3})+(?!\d))/g,ARN?'٬':',');
  return ARN?g.replace(/\d/g,n=>'٠١٢٣٤٥٦٧٨٩'[n]):g;
}
function nums(t){
  const ar='٠١٢٣٤٥٦٧٨٩';
  const norm=t.replace(/[٠-٩]/g,d=>ar.indexOf(d));
  return (norm.match(/\d[\d,٬\.\s-]{1,}\d|\d+/g)||[]).map(x=>x.replace(/[\s\.]/g,'').trim());
}

/* ================= خطوات المحادثة ================= */
function start(){
  say(T('greet'), ()=>{
    setChips(Object.keys(CATS).map(k=>({t:CATS[k].ic+' '+CATS[k].n, f:()=>{ const m=T('wantAd',{cat:CATS[k].n}); push('u',CATS[k].n); S.cat=k; S.unit=CATS[k].unit; turn(m); }})));
  });
  S.step=0; stepLbl.textContent=step(1);
}
function pickCat(k){
  S.cat=k; const c=CATS[k]; S.unit=c.unit; setChips([]);
  stepLbl.textContent=step(2);
  say(c.intro+'\n\n'+T('needTwo')+'\n'+NU(1)+'. '+c.q1+'\n'+NU(2)+'. '+c.q2, ()=>{
    S.step=1; inp.placeholder=c.q1;
    setChips([{t:T('useExample'), f:()=>{ push('u',T('exampleUsed')); S.title=c.title; S.spec=c.spec; S.price=fmtNum(c.price); S.tel='050 504 0108'; askPhoto(); }}]);
  });
}
function step1(t){
  S.title = t.split(/[،,\n]/)[0].slice(0,34).trim() || CATS[S.cat].title;
  S.spec  = t.length>S.title.length ? t.slice(0,120) : CATS[S.cat].spec;
  S.step=2; stepLbl.textContent=step(3); setChips([]);
  say(T('great')+'\n<b>'+CATS[S.cat].q2+'</b>\n\n'+T('oneLine'), ()=>{
    inp.placeholder=T('priceTelPh');
  });
}
function step2(t){
  const n=nums(t);
  const tel = n.find(x=>x.replace(/\D/g,'').length>=9);
  const pr  = n.find(x=>x!==tel);
  S.price = fmtNum(pr || CATS[S.cat].price);
  S.tel   = tel ? tel.replace(/(\d{3})(\d{3})(\d+)/,'$1 $2 $3') : '050 504 0108';
  askPhoto();
}
function askPhoto(){
  S.step=3; stepLbl.textContent=step(4);
  say(T('photoStep'), ()=>{
    inp.placeholder=T('skipPh');
    const c=CATS[S.cat], list=[{t:T('upload'), f:()=>fileEl.click()}];
    if(c.demo) list.push({t:T('useDemo'), f:()=>{ push('u',T('demoUsed')); S.img=c.demo; done(); }});
    list.push({t:T('noPhoto'), f:()=>{ push('u',T('noPhoto')); S.img=null; done(); }});
    setChips(list);
  });
}
fileEl.onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  push('u','📷 '+f.name);
  const r=new FileReader(); r.onload=()=>{ S.img=r.result; done(); }; r.readAsDataURL(f);
};
function done(){
  S.step=4; setChips([]); stepLbl.textContent=step(0);
  say(T('doneMsg'), ()=>{
    setChips([{t:T('restart'), f:()=>location.reload()}]);
    render(); document.getElementById('gwrap').classList.add('on');
    document.getElementById('gwrap').scrollIntoView({behavior:'smooth'});
  });
}
function legacy(t){
  if(S.step===0){ const k=detect(t)||'other'; pickCat(k); return; }
  if(S.step===1){ step1(t); return; }
  if(S.step===2){ step2(t); return; }
  say(T('restartHint'));
}

/* ============ العقل الحقيقيّ ============ */
let AI=true, HIST=[], busy=false;
function dots(){ const t=document.createElement('div'); t.className='m a dots';
  t.innerHTML='<span></span><span></span><span></span>'; cb.appendChild(t); cb.scrollTop=cb.scrollHeight; return t; }
function fmtA(x){ return String(x).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))
  .replace(/\n/g,'<br>').replace(/^(\d[\.\-\)])/gm,'<b>$1</b>'); }

function applyAd(o){
  const k = CATS[o.cat] ? o.cat : (S.cat || detect(String(o.title||'')+' '+String(o.spec||'')) || 'other');
  S.cat=k; const c=CATS[k];
  if(o.title) S.title=String(o.title).slice(0,34);
  if(o.spec)  S.spec =String(o.spec).slice(0,130);
  if(o.price) S.price=String(o.price);
  S.unit = o.unit ? String(o.unit) : c.unit;
  if(o.tel)  S.tel  =String(o.tel);
  if(o.kick) S.kick =String(o.kick).slice(0,26);
  if(Array.isArray(o.chips)&&o.chips.length) S.chips=o.chips.slice(0,3).map(x=>String(x).slice(0,18));
  if(Array.isArray(o.facts)&&o.facts.length) S.facts=o.facts.slice(0,8).map(x=>String(x).slice(0,30));
  if(o.place) S.place=String(o.place).slice(0,34);
  if(o.note)  S.note =String(o.note).slice(0,70);
}

async function turn(text){
  if(busy) return; busy=true;
  HIST.push({role:'user',content:text});
  const d=dots(); setChips([]);
  let out=null, gate=null;
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),28000);
    const r=await fetch('/api/adchat',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({messages:HIST,token:TOKEN,lang:AL}),signal:ctl.signal});
    clearTimeout(to);
    const j=await r.json();
    if(r.ok && j && j.text) out=j.text;
    else if(j && (j.message||j.message_ar)) gate=j.message||j.message_ar;
  }catch(e){}
  d.remove(); busy=false;

  if(out===null){                                   // سقوط آمن — لا تتوقّف المحادثة أبدًا
    if(AI){ AI=false; push('a','<i style="opacity:.8">'+(gate||T('aiDown'))+'</i>'); }
    if(S.step===0 && S.cat){ pickCat(S.cat); } else { legacy(text); }
    return;
  }
  HIST.push({role:'assistant',content:out});

  const raw=out.replace(/```+[a-zA-Z]*\n?/g,'');       // اسحب أسوار الكود إن أضافها النموذج
  const m=raw.match(/@@AD\s*(\{[\s\S]*\})/);
  const b=m||raw.match(/(\{[\s\S]*?"(?:cat|title)"\s*:[\s\S]*\})/); // JSON عارٍ بلا علامة @@AD
  let visible=(m?raw.replace(/@@AD[\s\S]*$/,''):(b?raw.replace(b[0],''):raw)).trim();
  if(b){
    try{ applyAd(JSON.parse(b[1])); }catch(e){ if(!S.cat) S.cat=detect(text)||'other'; }
    if(visible) push('a',fmtA(visible));
    askPhoto(); return;
  }
  push('a',fmtA(visible||'…'));
  if(S.step===0){ S.step=1; stepLbl.textContent=step(2); }
  inp.placeholder=T('answerPh');
}

const SKIPW=(T('skipWords')+','+(ADE.skipWords||'')+',تخط,بدون,بلا').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
const isSkip=t=>{ const lo=String(t).toLowerCase(); return SKIPW.some(w=>lo.indexOf(w)>=0); };
function send(){
  const t=inp.value.trim(); if(!t||busy) return; inp.value=''; push('u',t);
  if(S.step===3){ if(isSkip(t)){ S.img=null; done(); } else say(T('uploadHint')); return; }
  if(S.step>=4){ say(T('restartHint')); return; }
  if(!S.cat){ const k=detect(t); if(k){ S.cat=k; S.unit=CATS[k].unit; } }
  if(AI) turn(t); else legacy(t);
}
snd.onclick=send;
inp.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });

/* ================= سحب حرّ ================= */
const KEY='adst-pos-v1';
let POS=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(POS))}catch(e){}};
const kOf=(cv,el)=>(S.cat||'x')+'|'+cv.dataset.si+'|'+el.dataset.di;

function applyCanvas(cv){
  if(!cv) return;
  const w=cv.clientWidth,h=cv.clientHeight;
  cv.querySelectorAll('.drg').forEach(el=>{
    const p=POS[kOf(cv,el)]||[0,0,1];
    el.style.translate=(p[0]*w/100).toFixed(2)+'px '+(p[1]*h/100).toFixed(2)+'px';
    el.style.scale=String(p[2]||1);
  });
}
const applyAll=()=>document.querySelectorAll('.canvas').forEach(applyCanvas);

function initDrag(){
  document.querySelectorAll('#grid .canvas').forEach((cv,i)=>{
    cv.dataset.si=i;
    [...cv.children].forEach(el=>{ if(!el.matches('.bg,.ovl,.gl')) el.classList.add('drg'); });
    [...cv.querySelectorAll('.drg')].forEach((el,j)=>el.dataset.di=j);
    if(!cv.querySelector('.gl')) cv.insertAdjacentHTML('beforeend','<b class="gl v"></b><b class="gl h"></b>');
  });
  document.querySelectorAll('#grid .col').forEach((col,i)=>{
    if(col.querySelector('.rst')) return;
    const b=document.createElement('button');
    b.className='rst'; b.textContent=T('resetOne'); b.dataset.si=i;
    col.querySelector('h3').appendChild(b);
  });
  applyAll();
}

let drg=null, moved=false, justDragged=false;
const SNAP=7;
addEventListener('pointerdown', e=>{
  const el=e.target.closest('.drg'); if(!el) return;
  const cv=el.closest('.canvas'); if(!cv) return;
  const cr=cv.getBoundingClientRect(), er=el.getBoundingClientRect();
  const p=POS[kOf(cv,el)]||[0,0];
  const ox=p[0]*cv.clientWidth/100, oy=p[1]*cv.clientHeight/100;
  drg={els:[el],cv,ox,oy,nx:ox,ny:oy,sx:e.clientX,sy:e.clientY,
       bx:er.left-cr.left-ox, by:er.top-cr.top-oy, bw:er.width, bh:er.height};
  moved=false; el.classList.add('dragging'); setSel(el);
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
addEventListener('pointermove', e=>{
  if(!drg) return;
  const dx=e.clientX-drg.sx, dy=e.clientY-drg.sy;
  if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
  let nx=drg.ox+dx, ny=drg.oy+dy;
  const W=drg.cv.clientWidth,H=drg.cv.clientHeight;
  const gv=drg.cv.querySelector('.gl.v'), gh=drg.cv.querySelector('.gl.h');
  let L=drg.bx+nx,T=drg.by+ny,sX=null,sY=null;
  for(const [tg,v] of [[W/2,L+drg.bw/2],[20,L],[W-20,L+drg.bw]])
    if(Math.abs(v-tg)<=SNAP){ nx+=tg-v; sX=tg; break; }
  for(const [tg,v] of [[H/2,T+drg.bh/2],[20,T],[H-20,T+drg.bh]])
    if(Math.abs(v-tg)<=SNAP){ ny+=tg-v; sY=tg; break; }
  L=drg.bx+nx; T=drg.by+ny;
  if(L>W-24) nx-=L-(W-24); if(L+drg.bw<24) nx+=24-(L+drg.bw);
  if(T>H-24) ny-=T-(H-24); if(T+drg.bh<24) ny+=24-(T+drg.bh);
  if(gv){ gv.style.display=sX==null?'none':'block'; if(sX!=null) gv.style.left=sX+'px'; }
  if(gh){ gh.style.display=sY==null?'none':'block'; if(sY!=null) gh.style.top=sY+'px'; }
  drg.nx=nx; drg.ny=ny;
  drg.els.forEach(n=>n.style.translate=nx.toFixed(2)+'px '+ny.toFixed(2)+'px');
});
function endDrag(){
  if(!drg) return;
  const cv=drg.cv, pct=[drg.nx/cv.clientWidth*100, drg.ny/cv.clientHeight*100];
  if(moved){ drg.els.forEach(n=>{const q=POS[kOf(cv,n)]||[]; POS[kOf(cv,n)]=[pct[0],pct[1],q[2]||1];}); save(); justDragged=true; setTimeout(()=>justDragged=false,80); }
  drg.els.forEach(n=>n.classList.remove('dragging'));
  cv.querySelectorAll('.gl').forEach(g=>g.style.display='none');
  drg=null; applyAll();
}
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',endDrag);
addEventListener('click',e=>{ if(justDragged){ e.stopPropagation(); e.preventDefault(); } },true);
addEventListener('resize',applyAll);

document.getElementById('grid').addEventListener('click', e=>{
  const r=e.target.closest('.rst');
  if(r){ e.stopPropagation();
    Object.keys(POS).forEach(k=>{ if(k.indexOf((S.cat||'x')+'|'+r.dataset.si+'|')===0) delete POS[k]; });
    save(); applyAll(); return; }
  const p=e.target.closest('.pick');
  if(p){ e.stopPropagation();
    const col=p.closest('.col');
    document.querySelectorAll('#grid .col').forEach(c=>c.classList.remove('chosen'));
    col.classList.add('chosen'); S.chosen=+col.dataset.ci;
    push('a',T('chosenMsg',{name:'<b>'+NAMES[S.chosen]+'</b>'}));
    cb.scrollTop=cb.scrollHeight; return; }
  if(e.target.closest('.drg')){ e.stopPropagation(); return; }
  const c=e.target.closest('.canvas');
  if(c){ const z=document.getElementById('zoomWrap');
    z.querySelectorAll('.canvas').forEach(n=>n.remove());
    z.appendChild(c.cloneNode(true)); z.classList.add('on');
    requestAnimationFrame(()=>applyCanvas(z.querySelector('.canvas'))); }
});
document.getElementById('zoomWrap').onclick=()=>document.getElementById('zoomWrap').classList.remove('on');
document.querySelector('.rstAll').onclick=()=>{ POS={}; save(); applyAll(); };

/* ============ تحديد + تكبير/تصغير + ألوان + لون الكتابة ============ */
let SEL=null;
function setSel(el){
  document.querySelectorAll('.drg.sel').forEach(n=>n.classList.remove('sel'));
  SEL=el||null; if(SEL) SEL.classList.add('sel');
}
function bump(d){
  if(!SEL||!SEL.isConnected){ push('a',T('touchFirst')); cb.scrollTop=cb.scrollHeight; return; }
  const cv=SEL.closest('.canvas'); if(!cv) return;
  const k=kOf(cv,SEL), q=POS[k]||[0,0,1];
  POS[k]=[q[0]||0,q[1]||0,Math.min(2.8,Math.max(.4,+((q[2]||1)+d).toFixed(3)))];
  save(); applyAll();
}
document.getElementById('szP').onclick=()=>bump(.08);
document.getElementById('szM').onclick=()=>bump(-.08);
addEventListener('wheel',e=>{ const el=e.target.closest('.drg'); if(!el) return;
  e.preventDefault(); setSel(el); bump(e.deltaY<0?.06:-.06); },{passive:false});

const SWA=[['','swAuto'],['#a855f7','swPurple'],['#3b82f6','swBlue'],['#e0a94a','swGold'],['#ef4444','swRed'],['#22c55e','swGreen'],['#22d3ee','swCyan']].map(([c,k])=>[c,T(k)]);
const swEl=document.getElementById('sw');
swEl.innerHTML=SWA.map(([c,n],i)=>'<b class="'+(c?'':'auto ')+(i===0?'on':'')+'" data-c="'+c+'" title="'+n+'"'+(c?' style="background:'+c+'"':'')+'></b>').join('');
swEl.insertAdjacentHTML('beforeend','<b class="w" data-ink="w" title="'+T('inkWhite')+'"></b><b class="k" data-ink="k" title="'+T('inkBlack')+'"></b>');
swEl.onclick=e=>{ const b=e.target.closest('b[data-c]'); if(!b) return;
  S.ac=b.dataset.c||''; [...swEl.querySelectorAll('b[data-c]')].forEach(n=>n.classList.toggle('on',n===b));
  if(S.cat) render(); };
swEl.addEventListener('click',e=>{ const b=e.target.closest('b[data-ink]'); if(!b) return;
  const want=b.classList.contains('on')?null:b.dataset.ink;
  document.body.classList.remove('inkw','inkb');
  [...swEl.querySelectorAll('b[data-ink]')].forEach(n=>n.classList.remove('on'));
  if(want){ document.body.classList.add(want==='w'?'inkw':'inkb'); b.classList.add('on'); } });

const inkT=document.getElementById('inkT');
inkT.textContent=T('bgLight');
inkT.onclick=()=>{ const on=document.body.classList.toggle('ink');
  inkT.textContent=T(on?'bgDark':'bgLight'); };

const rtEl=document.getElementById('rt');
rtEl.onclick=e=>{ const b=e.target.closest('button[data-r]'); if(!b) return;
  S.ratio=b.dataset.r;
  [...rtEl.querySelectorAll('button')].forEach(n=>n.classList.toggle('on',n===b)); };

/* ============ توليد الإعلان صورةً كاملة (OpenAI gpt-image-1) ============ */
const LOOKMAP=['cinema','layers','poster','elegant','bold','luxe','minimal','magazine','neon'];
const genB=document.getElementById('genB'), genOut=document.getElementById('genOut');
genB.textContent='🎨 '+T('genBtn');
genB.onclick=async()=>{
  if(!S.cat){ push('a',T('genNeedData')); cb.scrollTop=cb.scrollHeight; return; }
  const c=CATS[S.cat], m=(S.img||'').match(/^data:(image\/[a-z]+);base64,(.+)$/);
  const old=genB.textContent; genB.disabled=true; genB.textContent=T('genBusy');
  genOut.className='on'; genOut.innerHTML='<div class="gwait">🎨 '+T('genDraw')+'</div>';
  genOut.scrollIntoView({behavior:'smooth',block:'nearest'});
  try{
    const r=await fetch('/api/adimage',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({token:TOKEN,lang:AL,ratio:S.ratio||'tall',look:LOOKMAP[S.chosen||0]||'neon',ac:S.ac||'',
        title:S.title||c.title,spec:S.spec||c.spec,price:S.price||fmtNum(c.price),unit:S.unit||c.unit,
        tel:S.tel||'',kick:S.kick||c.kick,imageBase64:m?m[2]:'',mimeType:m?m[1]:''})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.imageBase64){ genOut.innerHTML='<div class="gwait">⚠️ '+esc(j.message||j.message_ar||j.error||T('genErrCode',{code:r.status}))+'</div>'; }
    else{ const mt=j.mimeType||'image/webp', src='data:'+mt+';base64,'+j.imageBase64, ext=(mt.split('/')[1]||'webp');
      genOut.innerHTML='<h3>'+T('genOutTitle')+'</h3><img src="'+src+'"><a download="ad.'+ext+'" href="'+src+'">⬇︎ '+T('genDl')+'</a>'; }
  }catch(e){ genOut.innerHTML='<div class="gwait">⚠️ '+esc(e.message||T('genErrConn'))+'</div>'; }
  genB.disabled=false; genB.textContent=old;
};

/* ============ تنزيل أيّ تصميم صورةً PNG ============ */
let H2I=null;
function h2iLib(){ return H2I||(H2I=new Promise((ok,no)=>{ const t=document.createElement('script');
  t.src='/js/vendor/html-to-image.js'; t.onload=()=>window.htmlToImage?ok(window.htmlToImage):no(new Error('lib'));
  t.onerror=()=>no(new Error('load')); document.head.appendChild(t); })); }
async function cardPng(cv){ const L=await h2iLib();
  return await L.toPng(cv,{pixelRatio:2,cacheBust:true,backgroundColor:'#07090c',
    width:cv.offsetWidth,height:cv.offsetHeight}); }
document.getElementById('grid').addEventListener('click',async e=>{
  const b=e.target.closest('.dlB'); if(!b) return;
  const col=b.closest('.col'), cv=col&&col.querySelector('.canvas'); if(!cv) return;
  const old=b.textContent; b.disabled=true; b.textContent=T('dlPrep');
  try{ const url=await cardPng(cv);
    const a=document.createElement('a'); a.href=url;
    a.download='ad-'+(NAMES[col.dataset.ci]||'design')+'.png'; document.body.appendChild(a); a.click(); a.remove();
    b.textContent='✅ '+T('dlDone');
  }catch(err){ b.textContent='⚠️ '+T('dlFail'); }
  setTimeout(()=>{ b.textContent=old; b.disabled=false; },1600);
});
window.__cardPng=cardPng;

start();
