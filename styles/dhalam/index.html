<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ظلام</title>
<link rel="stylesheet" href="./hud.css">
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js", "three/addons/": "../../vendor/addons/" } }</script>
</head>
<body data-mode="hero">

<!-- icon set: drawn here, one consistent thin-line style -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-axe" viewBox="0 0 24 24"><path d="M5.5 20.5 15.2 6.6"/><path d="M12.6 5.2 17 3.4c2.6 1.8 3.6 5.4 2.2 8.6l-4.8-2.4z"/><path d="m12.6 5.2 1.8 4.4"/></symbol>
    <symbol id="i-pick" viewBox="0 0 24 24"><path d="M5.5 20.5 15 8.2"/><path d="M5.4 8.6C9.2 3.8 16.4 3 21 8.8"/><path d="M8.2 7.2c3.4-2.6 7.8-2.4 10.6.2"/><path d="m13.6 6.4 2.6 2.4"/></symbol>
    <symbol id="i-torch" viewBox="0 0 24 24"><path d="M9.2 21 11.6 12.6"/><path d="M9.8 12.2h4.6l-.8-2.6h-3z"/><path class="em" d="M12.2 9.4c-2.6-2-.6-3.8-.9-6.2 3 1.8 4.4 4.2 2.3 6.2z"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><ellipse cx="7" cy="12" rx="2.8" ry="5.2"/><path d="M7 6.8 17.6 6.8M7 17.2h10.6"/><path d="M17.6 6.8c1.6 0 2.8 2.3 2.8 5.2s-1.2 5.2-2.8 5.2"/><ellipse cx="7" cy="12" rx="1" ry="2"/><path d="M11.5 10.2h4M12.5 13.6h3"/></symbol>
    <symbol id="i-stone" viewBox="0 0 24 24"><path d="M4.6 15.2 6.8 8.6 12.6 5l6.2 2.8 1 7-5.4 4.4H8.6z"/><path d="m12.6 5-.8 5.2 3.4 3.2M6.8 8.6l5 1.6M11.8 10.2 9.6 15"/></symbol>
    <symbol id="i-plank" viewBox="0 0 24 24"><path d="M3.8 14.8 14.2 5.4l6 3.2L9.8 18z"/><path d="M9.8 18v2.2l10.4-9.4V8.6M3.8 14.8V17l6 3.2"/><path d="m8.4 11.8 5.6 3"/></symbol>
    <symbol id="i-meat" viewBox="0 0 24 24"><path d="M12 2.8v2.6"/><path d="M8.6 5.4h6.8c1.4 3.6-1.6 5.6-.4 9.2.8 2.4.2 4.6-1.8 6H9.8c1.8-2.2 1.4-3.8.6-6-1.2-3.4 0-6.2-1.8-9.200z"/><path d="M11.2 9.200c.2 2 .2 3.400 1 5.400"/></symbol>
    <symbol id="i-bandage" viewBox="0 0 24 24"><circle cx="9.200" cy="13.600" r="5.200"/><circle cx="9.200" cy="13.600" r="1.600"/><path d="M12.400 9.400 19.200 5l1.800 2.800-6.600 4.400"/><path d="m16.200 6.900 1.700 2.700"/></symbol>
    <symbol id="i-health" viewBox="0 0 24 24"><path d="M2.800 12.400h4.600l2-5.200 3.600 10 2-4.800h6.200"/></symbol>
    <symbol id="i-warm" viewBox="0 0 24 24"><path d="M12 21c-3.600 0-6-2.400-6-5.600 0-3 2.200-4.400 3-7.400 1.400 1 2 2.400 2 3.800 1.600-1.800 2-4.800 1.200-8.200 4 2.600 5.800 6.400 5.800 11 0 3.800-2.400 6.400-6 6.400z"/><path d="M12 21c-1.400 0-2.400-1-2.400-2.400 0-1.600 1.400-2.200 2.200-3.800.400 1.600 2.600 2.200 2.600 3.800 0 1.400-1 2.400-2.400 2.400z"/></symbol>
    <symbol id="i-ore" viewBox="0 0 24 24"><path d="M4.400 15.600 7 8.800l6-3.600 6 3 .800 7-5.400 4.200H8.400z"/><path class="em" d="m10.400 9.800 2.400 2-1 3.200M14.600 9.200l1.600 2.800"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 19 12 5l8 14"/><path d="M9.200 19c0-2.400 1.200-3 2.800-5.200 1.600 2.200 2.800 2.800 2.800 5.200"/></symbol>
    <symbol id="i-jump" viewBox="0 0 24 24"><path d="m6 13.200 6-6 6 6"/><path d="m6 18.600 6-6 6 6"/></symbol>
    <symbol id="i-place" viewBox="0 0 24 24"><path d="M12 3.600 19.600 8v8L12 20.400 4.400 16V8z"/><path d="M4.400 8 12 12.400 19.600 8M12 12.400v8"/><path class="em" d="M17.600 2.400v4.400M15.400 4.600h4.400"/></symbol>
    <symbol id="i-look" viewBox="0 0 36 24"><circle cx="18" cy="12" r="3.200"/><path d="M11 12H3.600m3-3-3 3 3 3M25 12h7.400m-3-3 3 3-3 3"/></symbol>
    <symbol id="i-more" viewBox="0 0 12 24"><path d="m7.600 7.400-4.200 4.600 4.200 4.600"/></symbol>
    <symbol id="i-earth" viewBox="0 0 24 24"><path d="M12 3.600 19.600 8v8L12 20.400 4.400 16V8z"/><path d="M4.400 8 12 12.400 19.600 8M12 12.400v8"/><path d="M7.600 13v.010M9.400 16.600v.010M15.400 15.400v.010M17.200 12.200v.010"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5.400 9.600h13.200l1.200 10H4.200z"/><path d="M8.800 9.600V7.400a3.200 3.200 0 0 1 6.400 0v2.200"/><path d="M9.600 13.400h4.800"/></symbol>
    <symbol id="i-plant" viewBox="0 0 24 24"><path d="M12 20.500V10"/><path d="M12 14.400c-.800-3-3-4.800-6.200-5.200.400 3.200 2.600 5 6.200 5.200z"/><path d="M12 11.600c.600-3.200 2.600-5.400 5.800-6.200 0 3.200-2.200 5.600-5.800 6.200z"/><path d="M8.600 20.500h6.800"/></symbol>
  </defs>
</svg>

<div id="tags" aria-hidden="true"></div>

<div id="hud" aria-label="واجهة اللعب">
  <!-- top: vitals / compass / day clock -->
  <section class="vitals glass">
    <div class="vital v-health">
      <svg class="ic"><use href="#i-health"/></svg>
      <span class="v-label">الصحة</span>
      <span class="v-bar"><i style="--v: 82%"></i></span>
      <span class="v-num">82</span>
    </div>
    <div class="vital v-warm">
      <svg class="ic"><use href="#i-warm"/></svg>
      <span class="v-label">الدفء</span>
      <span class="v-bar"><i style="--v: 46%"></i></span>
      <span class="v-num">46</span>
    </div>
  </section>

  <section class="compass glass" dir="ltr">
    <div class="c-main">
      <div class="c-strip" id="compassStrip"></div>
      <span class="c-caret"></span>
    </div>
    <span class="c-home"><svg class="ic"><use href="#i-home"/></svg><b dir="rtl" id="homeDist">18 م</b></span>
  </section>

  <section class="clock glass">
    <svg class="c-arc" viewBox="0 0 60 34" aria-hidden="true">
      <path d="M5 30A25 25 0 0 1 55 30" class="arc"/>
      <path d="M2 30h56" class="hz"/>
      <circle cx="9.800" cy="19.500" r="3.200" class="sun"/>
    </svg>
    <div class="c-text">
      <b class="c-day">اليوم 12</b>
      <span class="c-time"><span class="num">18:42</span> · الغسق</span>
    </div>
  </section>

  <!-- centre: crosshair only -->
  <div class="crosshair" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>

  <!-- what the crosshair is on -->
  <section class="target glass">
    <svg class="ic"><use href="#i-ore"/></svg>
    <div class="t-body">
      <b class="t-name">خام متوهّج</b>
      <span class="t-bar"><i style="--v: 62%"></i></span>
    </div>
    <span class="t-num">62%</span>
  </section>

  <!-- tool / block bar -->
  <section class="bar-wrap">
    <div class="bar-label"><b>معول حديدي</b></div>
    <div class="bar glass">
      <div class="slot" data-i="0"><em>1</em><svg class="ic"><use href="#i-axe"/></svg></div>
      <div class="slot on" data-i="1"><em>2</em><svg class="ic"><use href="#i-pick"/></svg></div>
      <div class="slot" data-i="2"><em>3</em><svg class="ic"><use href="#i-torch"/></svg><span class="n">12</span></div>
      <div class="slot" data-i="3"><em>4</em><svg class="ic"><use href="#i-log"/></svg><span class="n">34</span></div>
      <div class="slot" data-i="4"><em>5</em><svg class="ic"><use href="#i-stone"/></svg><span class="n">58</span></div>
      <div class="slot x6" data-i="5"><em>6</em><svg class="ic"><use href="#i-plank"/></svg><span class="n">16</span></div>
      <div class="slot x7" data-i="6"><em>7</em><svg class="ic"><use href="#i-meat"/></svg><span class="n">5</span></div>
      <div class="slot x8" data-i="7"><em>8</em><svg class="ic"><use href="#i-bandage"/></svg><span class="n">2</span></div>
      <div class="slot x9" data-i="8"><em>9</em><svg class="ic"><use href="#i-none"/></svg></div>
      <div class="more" aria-hidden="true"><svg class="ic"><use href="#i-more"/></svg><span class="dots"><i></i><i></i><i></i></span></div>
    </div>
  </section>

  <!-- touch controls (phones only) -->
  <div class="pads">
    <div class="stick" data-act="stick"><i class="s-ring"></i><i class="s-knob"></i></div>
    <div class="look"><svg class="ic"><use href="#i-look"/></svg><span>اسحب للنظر</span></div>
    <button class="tb tb-jump" type="button" data-act="jump"><svg class="ic"><use href="#i-jump"/></svg><span>قفز</span></button>
    <button class="tb tb-place" type="button" data-act="place"><svg class="ic"><use href="#i-place"/></svg><span>وضع</span></button>
    <button class="tb tb-break" type="button" data-act="dig"><svg class="ic"><use href="#i-pick"/></svg><span>كسر</span></button>
    <button class="tb tb-bag" type="button" data-act="bag"><svg class="ic"><use href="#i-bag"/></svg><span>حقيبة</span></button>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
