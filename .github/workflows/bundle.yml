name: Rebuild bundle

# يبني js/app.bundle.js تلقائيًا كلما تغيّرت إحدى شرائح المصدر،
# ويدفع الناتج إلى نفس الفرع.
on:
  push:
    branches: [main]
    paths:
      - 'js/app-*.js'
      - 'js/partials-*.js'
      - 'scripts/build.mjs'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-bundle-${{ github.ref }}
  cancel-in-progress: false   # لا تقطع تشغيلًا في منتصف الدفع

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # مطلوب لـ rebase عند التسابق

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build bundle
        run: npm run bundle -- --force

      - name: Verify bundle
        run: npm run verify

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- js/app.bundle.js
          if git diff --cached --quiet -- js/app.bundle.js; then
            echo "الحزمة لم تتغيّر — لا شيء لدفعه."
            exit 0
          fi
          git commit -m "build: rebuild app.bundle.js [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "فشل الدفع، إعادة المحاولة بعد rebase…"
            git pull --rebase origin ${{ github.ref_name }}
          done
          exit 1
