# v-models-live: فحص أسماء الموديلات المكتوبة في الكود مقابل قوائم المزوّدين الحيّة — أسبوعيًّا (الأحد) أو يدويًّا.
# الأسماء تُستخرج من الكود نفسه (scripts/lib/models-live.cjs) فلا قائمة يدويّة تتقادم. سؤال /models مجّانيّ: لا يشغّل موديلًا
# ولا يصرف رصيدًا. اسم ميّت ⇒ مسألة «🔴 موديلات موقوفة في الكود» (تُحدَّث إن كانت مفتوحة، لا تتكرّر)؛ سليم ⇒ صمت.
# مزوّد بلا مفتاح في أسرار المستودع = «لم يُفحص» في التقرير، لا «ميّت».
name: model-probe
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 0'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check model ids against live catalogs
        id: probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY || secrets.KIMI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set +e
          node scripts/models-live.mjs --out report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 1 ] && exit 1
          exit 0
      - name: Open or update issue
        if: steps.probe.outputs.code == '2' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔴 موديلات موقوفة في الكود"
          { cat report.md; echo; echo "التشغيل: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > body.md
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file body.md
          else gh issue create --title "$title" --body-file body.md; fi
