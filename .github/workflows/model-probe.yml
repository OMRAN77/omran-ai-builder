# فحص أسماء موديلات OpenRouter المستعملة في الكود ضد القائمة الحية.
# لا أسرار ولا مفاتيح: /api/v1/models عام. يُشغَّل يدويًا عند الحاجة.
name: model-probe
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check slugs against live OpenRouter catalog
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          used = [
            "anthropic/claude-sonnet-4.5",
            "anthropic/claude-opus-5",
            "anthropic/claude-sonnet-5",
            "deepseek/deepseek-chat",
            "deepseek/deepseek-v3.2",
            "google/gemini-3.5-flash",
            "google/gemma-4-31b-it:free",
            "google/gemini-2.5-pro",
            "meta-llama/llama-3.1-70b-instruct",
            "meta-llama/llama-4-maverick",
            "meta-llama/llama-4-scout",
            "z-ai/glm-5.2:free",
            "mistralai/mistral-medium-3-5",
            "nvidia/nemotron-3-super-120b-a12b:free",
            "openai/gpt-4o",
            "openai/gpt-4o-mini",
            "openai/gpt-5.6-terra",
          ]
          with urllib.request.urlopen("https://openrouter.ai/api/v1/models", timeout=30) as r:
              ids = {m["id"] for m in json.load(r)["data"]}
          print("catalog size:", len(ids))
          print("== USED SLUGS ==")
          for s in used:
              print(("OK   " if s in ids else "DEAD "), s)
          print("== LIVE :free MODELS (for replacements) ==")
          for i in sorted(x for x in ids if x.endswith(":free")):
              print("  ", i)
          print("== LIVE anthropic/google/openai/meta/mistral/deepseek (paid) ==")
          for fam in ("anthropic/", "google/", "openai/", "meta-llama/", "mistralai/", "deepseek/"):
              for i in sorted(x for x in ids if x.startswith(fam) and not x.endswith(":free")):
                  print("  ", i)
          EOF
