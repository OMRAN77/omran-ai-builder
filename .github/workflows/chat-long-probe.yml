# مجس بثّ المحادثة على الإنتاج — رسالة طويلة (عربي+إنجليزي+كود) لكشف «ما ترد».
name: chat-long-probe
on:
  workflow_dispatch:
  push:
    branches: [claude/hala-t3hsq0]
    paths: ['scripts/chat-long-probe.mjs', '.github/workflows/chat-long-probe.yml']

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe production chat stream (long message)
        run: node scripts/chat-long-probe.mjs
