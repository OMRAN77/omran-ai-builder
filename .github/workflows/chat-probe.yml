# مجسّ المحادثة: يقيس معمارية «العقل الواحد» على الإنتاج بالأرقام.
name: chat-probe
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe production chat
        run: node scripts/chat-probe.mjs
