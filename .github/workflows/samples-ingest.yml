name: samples-ingest

# المالك يرفع فيديو نموذج في media/samples/raw/ من موقع GitHub ← يُضغط بجودة عالية ويُسجَّل في البطاقة ويُدفع على main فينشر Vercel.
on:
  push:
    branches: [main]
    paths: ['media/samples/raw/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samples-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ضغط النماذج وتسجيلها
        run: node scripts/samples-ingest.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: دفع النتيجة
        run: |
          git config user.name "samples-ingest"
          git config user.email "samples-ingest@users.noreply.github.com"
          git add -A media/samples
          git diff --cached --quiet && { echo "لا جديد"; exit 0; }
          git commit -m "نماذج فيديو جديدة من رفع المالك (مضغوطة بجودة عالية ومسجَّلة في البطاقات)"
          git pull --rebase origin main
          git push origin HEAD:main
