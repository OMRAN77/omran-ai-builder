# مسبار لهجة مها: ٣٠ طلبًا إماراتيًّا بصوت حقيقيّ على جلسة مها كما يبنيها الإنتاج — هل فهمت، هل ردّت بالخليجي، أيّ نافذة
# فتحت، وكم م.ث من نهاية الكلام إلى أوّل صوت منها. يُشغَّل يدويًّا، أو بدفعة رسالة التزامها فيها [maha-probe].
# كلفة: مكالمات صوتيّة قصيرة بمفتاح المستودع — لا تُشغَّل إلّا بطلب.
name: maha-dialect-probe

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'أرقام طلبات مفصولة بفواصل (فارغ = الثلاثون)'
        default: ''
  push:
    paths:
      - 'scripts/maha-dialect-probe.mjs'
      - 'scripts/maha-dialect-requests.json'
      - 'api/_lib/realtime-session.js'
      - 'api/_lib/maha-app.js'
      - '.github/workflows/maha-dialect-probe.yml'

permissions:
  contents: read

concurrency:
  group: maha-dialect-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[maha-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm i --no-save --ignore-scripts --no-audit --no-fund ws@8.18.0
      # الصوت نفسه في كلّ تشغيلة (قبل/بعد): مخبّأ ببصمة ملفّ الطلبات
      - uses: actions/cache@v4
        with:
          path: .maha-tts-cache
          key: maha-tts-${{ hashFiles('scripts/maha-dialect-requests.json') }}-v1
      - name: Probe Maha
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/maha-dialect-probe.mjs --cache .maha-tts-cache --out maha-dialect-results.json ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maha-dialect-${{ github.run_id }}
          path: maha-dialect-results.json
          retention-days: 30
