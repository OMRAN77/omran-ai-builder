# v-play-aab (المالك ٢١ نوفمبر: «ابدأ»): حزمة Google Play ‏(AAB) لتطبيق com.omran.aibuilder من مشروع هواوي نفسه (store/huawei/twa).
# Play Console أنذر مرّتين: (١) ٣ أكتوبر «مستوى واجهة برمجة التطبيقات المستهدفة» — 1.3.8 (vc 15) قديمة والمهلة انتهت ١ نوفمبر؛
# (٢) ٢ نوفمبر «رابط عميق لا يعمل» — assetlinks.json فيه حزمة هواوي وحدها. هنا تُبنى الحزمة على أندرويد 36 باسم «om ai» وتنطلق من «/»
# (لا ?store=huawei: علم هواوي يُخفي الأسواق ويفتح على الأدوات — ليس لجوجل). مشروع هواوي في المستودع لا يُمسّ: التبديل على نسخة المشغّل.
# التوقيع بمفتاح المستودع نفسه (أسرار android-release) كمفتاح رفع؛ إن كان مفتاح رفع Play غيره فالمالك يطلب «إعادة ضبط مفتاح الرفع»
# في Play Console بالشهادة upload_certificate.pem المرفقة بالتشغيل. الرفع إلى Play Console يدويّ (لا مفتاح API هنا).
name: play-release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (مثل 1.4.0)'
        required: true
        default: '1.4.0'
      version_code:
        description: 'versionCode — أكبر من كلّ إصدار رُفع إلى Play (آخرها 15)'
        required: true
        default: '20261121'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SRC_DIR: store/huawei/twa
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نسخة المشروع لجوجل (الحزمة والانطلاق والإصدار)
        run: |
          set -e
          node -e "if(!(Number(process.env.VERSION_CODE)>15)) { console.error('versionCode يجب أن يكون أكبر من 15'); process.exit(1); }"
          PLAY_DIR="$RUNNER_TEMP/play-twa"
          cp -r "$SRC_DIR" "$PLAY_DIR"
          echo "PLAY_DIR=$PLAY_DIR" >> "$GITHUB_ENV"
          cd "$PLAY_DIR"
          sed -i -E "s/applicationId: 'com\.omran\.aibuilder\.twa'/applicationId: 'com.omran.aibuilder'/; s/applicationId \"com\.omran\.aibuilder\.twa\"/applicationId \"com.omran.aibuilder\"/; s#launchUrl: '/\?store=huawei'#launchUrl: '/'#" app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          grep -n "applicationId\|launchUrl:\|versionCode\|versionName\|targetSdkVersion\|name: 'om ai'\|launcherName" app/build.gradle
          grep -q "applicationId \"com.omran.aibuilder\"" app/build.gradle
          grep -q "applicationId: 'com.omran.aibuilder'" app/build.gradle
          grep -q "launchUrl: '/'," app/build.gradle
          ! grep -q "store=huawei" app/build.gradle

      - name: بناء AAB (غير موقّع)
        run: |
          set -e
          cd "$PLAY_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release/

      - name: التوقيع بمفتاح الرفع (أسرار المستودع) وشهادته
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::أسرار التوقيع ناقصة (ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD و ANDROID_KEY_ALIAS) — هي نفسها أسرار android-release"
            exit 1
          fi
          export KEY_PASS_EFF="${KEY_PASS:-$KS_PASS}"
          echo "$KS_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.keystore"
          AAB_IN=$(ls "$PLAY_DIR"/app/build/outputs/bundle/release/*.aab | head -1)
          OUT="om-ai-play-${VERSION_NAME}.aab"
          cp "$AAB_IN" "$OUT"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/release.keystore" -storepass:env KS_PASS -keypass:env KEY_PASS_EFF "$OUT" "$KEY_ALIAS"
          jarsigner -verify "$OUT" | tail -1
          keytool -export -rfc -keystore "$RUNNER_TEMP/release.keystore" -storepass:env KS_PASS -alias "$KEY_ALIAS" -file upload_certificate.pem
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass:env KS_PASS -alias "$KEY_ALIAS" | grep -i "SHA256:" | head -1 | awk '{print $2}')
          rm -f "$RUNNER_TEMP/release.keystore"
          echo "AAB=$OUT" >> "$GITHUB_ENV"
          {
            echo "## om ai ${VERSION_NAME} لـGoogle Play (versionCode ${VERSION_CODE})"
            echo "- الحزمة: \`com.omran.aibuilder\` — أندرويد 36 — تنطلق من \`https://omran-ai-builder.vercel.app/\`"
            echo "- بصمة مفتاح الرفع SHA-256: \`${FP}\` — إن اختلفت عن «شهادة مفتاح الرفع» في Play Console ← سلامة التطبيق، اطلب إعادة ضبط مفتاح الرفع بالملفّ upload_certificate.pem"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: om-ai-play-${{ inputs.version_name }}
          path: |
            ${{ env.AAB }}
            upload_certificate.pem
          if-no-files-found: error
