# توليد صور نماذج بطاقات استوديو الأزياء عبر خطّ الإنتاج، وتصغيرها webp،
# ورفعها artifact لتُنزَّل وتُلتزم في assets/fashion/looks/.
name: Fashion thumbs

on:
  workflow_dispatch:
    inputs:
      genders:
        description: 'الفئات المولّدة (women,men,kids)'
        required: false
        default: 'women'

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate style model images on production
        run: node scripts/fashion-thumbs.mjs "https://omran-ai-builder.vercel.app" "${{ github.event.inputs.genders }}"
      - name: Resize to webp cards
        run: npm i --no-save sharp && node scripts/fashion-thumbs-resize.mjs
      # تنزيل الـartifact محجوب من بيئة الوكيل — الدفع لفرع بوت هو قناة التسليم.
      - name: Push cards to bot branch
        run: |
          mkdir -p assets/fashion/looks
          cp -r thumbs/. assets/fashion/looks/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/fashion-thumbs
          git add assets/fashion/looks
          git commit -m "أصول: صور نماذج بطاقات الأزياء (مولّدة بمحرّك التطبيق)"
          git push -f origin bot/fashion-thumbs
      - uses: actions/upload-artifact@v4
        with:
          name: fashion-thumbs
          path: thumbs/
          retention-days: 3
