# v-store-twa: بناء حزمة متجر هواوي (Trusted Web Activity) وتوقيعها ونشرها Release — على مشغّل GitHub حيث Android SDK جاهز.
# التشغيل يدويًّا (Actions ← android-release ← Run workflow) أو من الجلسة. المشروع في store/huawei/twa
# (مولَّد بـscripts/twa-generate.mjs من manifest-huawei.json). أسرار التوقيع في أسرار المستودع لا في الملفّات:
#   ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD (اختياريّ = كلمة المخزن)
name: android-release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (مثل 1.3.10)'
        required: true
        default: '1.3.10'
      version_code:
        description: 'versionCode — أكبر من كلّ إصدار سابق رُفع إلى AppGallery'
        required: true
        default: '20260918'
      release:
        description: 'إنشاء Release في GitHub بالـAPK'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TWA_DIR: store/huawei/twa
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ضبط الإصدار في المشروع
        run: |
          set -e
          cd "$TWA_DIR"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          node -e "const fs=require('fs');const f='twa-manifest.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.appVersion=process.env.VERSION_NAME;j.appVersionCode=Number(process.env.VERSION_CODE);fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          grep -n "versionCode\|versionName\|launchUrl:" app/build.gradle

      - name: بناء APK (غير موقّع)
        run: |
          set -e
          cd "$TWA_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: التوقيع بمفتاح المالك (من أسرار المستودع)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::أسرار التوقيع ناقصة — أضف في Settings ← Secrets and variables ← Actions: ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD و ANDROID_KEY_ALIAS (و ANDROID_KEY_PASSWORD إن اختلفت عن كلمة المخزن). الخطوات في store/huawei/README.md"
            exit 1
          fi
          export KEY_PASS_EFF="${KEY_PASS:-$KS_PASS}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "$KS_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.keystore"
          UNSIGNED=$(ls "$TWA_DIR"/app/build/outputs/apk/release/*-unsigned.apk | head -1)
          OUT="omran-ai-builder-${VERSION_NAME}.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS_EFF --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
          "$BT/apksigner" verify --print-certs "$OUT" | tee "$RUNNER_TEMP/certs.txt"
          FP=$(grep -i "SHA-256 digest" "$RUNNER_TEMP/certs.txt" | head -1 | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          {
            echo "## Omran AI Builder ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo "- الحزمة: \`com.omran.aibuilder.twa\` — تنطلق من \`https://omran-ai-builder.vercel.app/?store=huawei\`"
            echo "- بصمة شهادة التوقيع SHA-256: \`${FP}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: omran-ai-builder-${{ inputs.version_name }}-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Release في GitHub
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v${VERSION_NAME}"
          NOTES="حزمة AppGallery — com.omran.aibuilder.twa ${VERSION_NAME} (versionCode ${VERSION_CODE}). تنطلق من /?store=huawei. بصمة التوقيع SHA-256: ${FINGERPRINT}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Omran AI Builder ${VERSION_NAME} — AppGallery" --notes "$NOTES"
          fi
          echo "- Release: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: بصمة التوقيع في .well-known/assetlinks.json (فرع + طلب سحب إن لم تكن فيه)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          F=.well-known/assetlinks.json
          if grep -q "$FINGERPRINT" "$F"; then echo "البصمة موجودة في $F"; exit 0; fi
          node -e "
            const fs=require('fs');const f=process.argv[1];const fp=process.argv[2];
            const al=JSON.parse(fs.readFileSync(f,'utf8'));const t=al[0].target;
            t.sha256_cert_fingerprints=t.sha256_cert_fingerprints.filter(x=>/^([0-9A-F]{2}:){31}[0-9A-F]{2}$/.test(x));
            if(!t.sha256_cert_fingerprints.includes(fp)) t.sha256_cert_fingerprints.push(fp);
            fs.writeFileSync(f,JSON.stringify(al,null,2)+'\n');
          " "$F" "$FINGERPRINT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="android/assetlinks-${VERSION_NAME}"
          git checkout -B "$BR"
          git add "$F"
          git commit -m "بصمة توقيع حزمة ${VERSION_NAME} في assetlinks.json — التحقّق من Digital Asset Links لحزمة هواوي"
          git push -f origin "$BR"
          gh pr create --base main --head "$BR" --title "بصمة توقيع حزمة ${VERSION_NAME} في assetlinks.json" --body "أضافها android-release تلقائيًّا بعد توقيع الحزمة. بعد الدمج يمرّ التحقّق من Digital Asset Links فيعمل TWA بلا شريط متصفّح." \
            || echo "::warning::لم يُفتح طلب السحب تلقائيًّا — الفرع ${BR} مدفوع، افتحه يدويًّا أو اطلب من الجلسة"
          echo "- assetlinks.json: الفرع ${BR} (يحتاج دمجًا)" >> "$GITHUB_STEP_SUMMARY"
