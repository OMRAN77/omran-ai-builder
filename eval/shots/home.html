<!doctype html>
<!-- v-shot-reply — الحالة (ج): الصفحة الرئيسيّة للمنصّة الخياليّة نفسها بلا أيّ مزوّد، وعنوانها ظاهر في شريط المتصفّح. تُصوَّر إلى home.png. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
  body { margin: 0; width: 1000px; font: 15px/1.5 Tahoma, "Segoe UI", sans-serif; background: #fff; color: #222; }
  .chrome { background: #e9ebee; padding: 8px 12px; direction: ltr; }
  .url { background: #fff; border-radius: 16px; padding: 5px 14px; color: #333; font: 14px Arial, sans-serif; }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #eee; }
  .logo { font-size: 24px; font-weight: bold; color: #1d6fd8; }
  .nav span { margin-inline-start: 18px; color: #444; }
  .hero { padding: 40px 20px; text-align: center; background: linear-gradient(135deg, #eaf2fe, #fdf1e7); }
  .hero h1 { margin: 0 0 14px; font-size: 30px; }
  .search { width: 520px; margin: 0 auto; border: 1px solid #ccd; border-radius: 24px; padding: 10px 18px; color: #888; background: #fff; text-align: right; }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 24px 20px; }
  .cat { border: 1px solid #e3e5e8; border-radius: 10px; padding: 18px; text-align: center; font-weight: bold; }
  .stats { text-align: center; color: #666; padding-bottom: 20px; }
</style></head><body>
  <div class="chrome"><div class="url">khadamati.example</div></div>
  <div class="head"><div class="logo">خدماتي</div><div class="nav"><span>تصفّح الخدمات</span><span>كيف يعمل الموقع</span><span>تسجيل الدخول</span></div></div>
  <div class="hero"><h1>أنجز أعمالك مع أفضل المستقلّين</h1><div class="search">ابحث عن خدمة…</div></div>
  <div class="cats">
    <div class="cat">🎨 تصميم وجرافيك</div><div class="cat">✍️ كتابة وترجمة</div><div class="cat">💻 برمجة وتطوير</div>
    <div class="cat">📣 تسويق إلكتروني</div><div class="cat">🎬 فيديو وأنيميشن</div><div class="cat">🎧 صوتيّات</div>
  </div>
  <div class="stats">+120 ألف خدمة · +40 ألف مستقلّ · دفع آمن</div>
</body></html>
