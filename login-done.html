<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تم تسجيل الدخول ✅</title>
<!-- v-login-done: يهبط هنا سفاري بعد نجاح دخول جوجل الذي بدأ من غلاف
     الآيفون — رسالة رجوع واضحة بدل نسخة كاملة من الموقع كانت تربك المستخدم.
     التطبيق نفسه يستلم الجلسة تلقائيًا عبر جسر oauth-claim فور العودة إليه. -->
<style>
  html, body { margin:0; padding:0; background:#0d0d17; color:#f2f2f7; font-family:-apple-system, "Segoe UI", Tahoma, sans-serif; }
  .wrap {
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:18px;
    padding: calc(24px + env(safe-area-inset-top,0px)) 28px calc(24px + env(safe-area-inset-bottom,0px));
    box-sizing:border-box;
  }
  .check { font-size:64px; line-height:1; }
  h1 { margin:0; font-size:24px; font-weight:800; }
  p { margin:0; font-size:16px; line-height:1.9; color:#c9c9d4; max-width:340px; }
  .hint {
    margin-top:6px; padding:12px 18px; border-radius:14px;
    background:rgba(124,108,255,0.14); border:1px solid rgba(124,108,255,0.35);
    font-size:15px; line-height:1.9; color:#e6e2ff; max-width:340px;
  }
  .en { font-size:13px; color:#8a8a96; direction:ltr; }
</style>
</head>
<body>
<div class="wrap">
  <div class="check">✅</div>
  <h1>تم تسجيل الدخول بنجاح</h1>
  <p>حسابك جاهز — باقي خطوة وحدة بس:</p>
  <div class="hint">ارجع إلى تطبيق <b>Omran AI Builder</b> — اضغط اسمه أعلى الشاشة (بجانب الساعة)، وستجد نفسك داخلًا تلقائيًا خلال ثوانٍ.</div>
  <p class="en">Signed in ✓ — return to the Omran AI Builder app (tap its name at the top of the screen). You'll be signed in automatically.</p>
</div>
<script>
/* v-google-app-fail: الكولباك يهبط هنا بـ?gerror حين يفشل الدخول — نقول ذلك صراحة
   بدل «تم» (التطبيق نفسه يعرض السبب المفصّل عند العودة إليه). */
(function(){
  try {
    /* v-google-login-help: غلاف أندرويد يفتح هذه الصفحة في تبويب متصفّح فوق التطبيق — الرجوع بـ✕ أعلاها أو زرّ الرجوع،
       لا «اسمه بجانب الساعة» (ذاك سفاري الآيفون). */
    var android = /Android/i.test(navigator.userAgent || '');
    var g = new URLSearchParams(location.search).get('gerror');
    if(android && !g){
      document.querySelector('.hint').textContent = 'ارجع إلى تطبيق «عمران AI» — اضغط ✕ أعلى هذه الصفحة أو زرّ الرجوع في جهازك، وستجد نفسك داخلًا تلقائيًا خلال ثوانٍ.';
      document.querySelector('.en').textContent = 'Signed in ✓ — return to the Omran AI app (tap ✕ at the top of this page or your phone’s Back button). You’ll be signed in automatically.';
    }
    if(!g) return;
    document.title = 'تعذّر تسجيل الدخول';
    document.querySelector('.check').textContent = '⚠️';
    document.querySelector('h1').textContent = 'تعذّر إكمال الدخول بجوجل';
    document.querySelector('.wrap p').textContent = g === 'access_denied' ? 'ألغيتَ الدخول من شاشة جوجل.' : 'حدث خطأ أثناء الدخول (' + g + ').';
    document.querySelector('.hint').textContent = android
      ? 'ارجع إلى تطبيق «عمران AI» (✕ أعلى هذه الصفحة أو زرّ الرجوع) واضغط «المتابعة عبر Google» مرة ثانية — السبب سيظهر لك هناك.'
      : 'ارجع إلى تطبيق Omran AI Builder (اسمه أعلى الشاشة بجانب الساعة) واضغط «المتابعة عبر Google» مرة ثانية — السبب سيظهر لك هناك.';
    document.querySelector('.en').textContent = 'Google sign-in failed (' + g + '). Return to the ' + (android ? 'Omran AI' : 'Omran AI Builder') + ' app and try again.';
  } catch(e) { /* الصفحة الافتراضيّة تبقى */ }
})();
</script>
</body>
</html>
