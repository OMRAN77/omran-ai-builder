<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>نافذة خام</title>
<style>
  :root { --bg:#0b0d10; --panel:#12161b; --line:#242b33; --ink:#e8ecf1; --dim:#8b97a6; --acc:#c7a95b; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
    font-family:-apple-system, "Segoe UI", "Noto Kufi Arabic", "Dubai", Tahoma, sans-serif;
  }
  header {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:.2px; }
  header .sp { flex:1 1 auto; }
  select, button, textarea, input {
    font-family:inherit; font-size:14px; color:var(--ink);
    background:#171c22; border:1px solid var(--line); border-radius:8px; padding:7px 10px;
  }
  button { cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  #sysWrap { padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  #sysWrap[hidden] { display:none; }
  #sys { width:100%; min-height:84px; margin:10px 0; resize:vertical; line-height:1.7; }
  #note { color:var(--dim); font-size:12px; padding-bottom:10px; }
  main { flex:1 1 auto; overflow-y:auto; padding:22px 16px 8px; }
  .wrap { max-width:760px; margin:0 auto; }
  .msg { margin:0 0 22px; line-height:1.85; font-size:15.5px; white-space:pre-wrap; word-wrap:break-word; }
  .msg .who { display:block; font-size:11px; letter-spacing:1px; color:var(--dim); margin-bottom:6px; }
  .msg.u { color:#cfd8e3; border-inline-start:2px solid var(--line); padding-inline-start:12px; }
  .msg.a .who { color:var(--acc); }
  .err { color:#e2725b; font-size:13px; }
  footer { border-top:1px solid var(--line); background:var(--panel); padding:12px 16px; }
  .bar { max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
  #q { flex:1 1 auto; min-width:0; min-height:46px; max-height:190px; resize:none; line-height:1.6; }
  #send { min-width:78px; height:46px; background:var(--acc); color:#12161b; border-color:var(--acc); font-weight:700; }
  .tag { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>نافذة خام</h1>
  <span class="tag" id="via">بلا توجيه · بلا أدوات · بلا قوالب</span>
  <span class="sp"></span>
  <select id="model" title="النموذج">
    <option value="opus">claude-opus-5</option>
    <option value="sonnet">claude-sonnet-5</option>
  </select>
  <button id="toggleSys">تعليمات النظام</button>
  <button id="clear">محادثة جديدة</button>
</header>

<div id="sysWrap" hidden>
  <textarea id="sys" placeholder="اتركه فارغًا للخام التامّ. أي نصّ هنا يصبح توجيه النظام لهذه المحادثة."></textarea>
  <div id="note">فارغ = النموذج كما هو، بلا سطر واحد يُملى عليه. يُطبَّق على كلّ رسالة تالية.</div>
</div>

<main id="main"><div class="wrap" id="log"></div></main>

<footer>
  <div class="bar">
    <textarea id="q" rows="1" placeholder="اكتب هنا… (Enter للإرسال · Shift+Enter لسطر جديد)"></textarea>
    <button id="send">إرسال</button>
  </div>
</footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var log = $('log'), main = $('main'), q = $('q'), send = $('send');

  // رمز البوابة: من عنوان الرابط مرّة واحدة، ثمّ يُحفظ محليًّا ويُمسح من الشريط.
  var gate = '';
  try {
    var h = (location.hash || '').replace(/^#/, '').trim();
    if (h) { localStorage.setItem('rawGate', h); history.replaceState(null, '', location.pathname); }
    gate = localStorage.getItem('rawGate') || '';
  } catch (_) {}
  if (!gate) { gate = prompt('رمز الدخول:') || ''; try { localStorage.setItem('rawGate', gate); } catch (_) {} }

  var history_ = [];
  var busy = false;

  function add(role, text) {
    var d = document.createElement('div');
    d.className = 'msg ' + (role === 'user' ? 'u' : 'a');
    var w = document.createElement('span');
    w.className = 'who';
    w.textContent = role === 'user' ? 'أنت' : 'كلود';
    var b = document.createElement('span');
    b.textContent = text || '';
    d.appendChild(w); d.appendChild(b);
    log.appendChild(d);
    main.scrollTop = main.scrollHeight;
    return b;
  }

  function autogrow() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 190) + 'px'; }
  q.addEventListener('input', autogrow);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
  });
  send.addEventListener('click', go);
  $('toggleSys').addEventListener('click', function () { $('sysWrap').hidden = !$('sysWrap').hidden; });
  $('clear').addEventListener('click', function () { history_ = []; log.innerHTML = ''; q.focus(); });

  async function go() {
    if (busy) return;
    var text = q.value.trim();
    if (!text) return;
    q.value = ''; autogrow();
    add('user', text);
    history_.push({ role: 'user', content: text });

    busy = true; send.disabled = true;
    var out = add('assistant', '');
    var acc = '';
    try {
      var r = await fetch('/api/raw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-gate': gate },
        body: JSON.stringify({ messages: history_, system: $('sys').value, model: $('model').value })
      });
      if (!r.ok) {
        var t = await r.text().catch(function () { return ''; });
        out.parentNode.className = 'msg err';
        out.textContent = r.status === 403 ? 'رمز الدخول غير صحيح.' : ('تعذّر: ' + r.status + ' ' + t.slice(0, 300));
        history_.pop();
      } else {
        $('via').textContent = 'عبر ' + (r.headers.get('X-Raw-Via') || '—') + ' · بلا توجيه · بلا أدوات';
        var reader = r.body.getReader(), dec = new TextDecoder();
        for (;;) {
          var s = await reader.read();
          if (s.done) break;
          acc += dec.decode(s.value, { stream: true });
          out.textContent = acc;
          main.scrollTop = main.scrollHeight;
        }
        history_.push({ role: 'assistant', content: acc });
      }
    } catch (e) {
      out.parentNode.className = 'msg err';
      out.textContent = 'انقطع الاتصال: ' + (e && e.message ? e.message : e);
      history_.pop();
    }
    busy = false; send.disabled = false; q.focus();
  }

  q.focus();
})();
</script>
</body>
</html>
