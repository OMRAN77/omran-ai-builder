<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Omran AI Builder</title>
<link rel="icon" type="image/png" href="/icons/favicon-32-v2.png?icon=black-20261022">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png?icon=black-20261022">
<noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
<!-- v-qr-one: الباركود الواحد. /app و/download و/install كلّها هنا: لا صفحة متاجر — كلّ جهاز يذهب مباشرة إلى تطبيقه.
     المالك (١١ أكتوبر): «سوّ لي باركود واحد لكلّ التطبيقات، مش نفس هذا» عن صفحة المتاجر الخمس، و«هذا مكانه» عن «حسابي».
     الباركود يُرسم في «حسابي» برابط /app?ref=اسمه؛ والباركود القديم (/download) يصل هنا أيضًا. -->
<style>
html, body { margin: 0; height: 100%; background: #090a0d; }
body { display: flex; align-items: center; justify-content: center; }
.goMark { width: 84px; height: 84px; border-radius: 24px; border: 1.5px solid #d4af37; box-shadow: 0 0 36px rgba(212,175,55,.25); overflow: hidden; animation: goPulse 1.2s ease-in-out infinite alternate; }
.goMark img { width: 100%; height: 100%; display: block; object-fit: cover; }
@keyframes goPulse { from { opacity: .55; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div class="goMark"><img src="/icons/ai-hub-mark-256.png" alt="Omran AI"></div>
<script>
(function(){
  'use strict';
  // رابط متجر كلّ منصّة حين يُنشر التطبيق فيه — يُملأ هنا وحده، والباركود المطبوع لا يتغيّر.
  // فارغ = لا متجر منشور بعد، فيفتح الجهاز التطبيق نفسه وزرّ «تثبيت التطبيق» (?install=1، app-10-features).
  var STORES = { ios: '', android: '', huawei: '', windows: '' };

  function goDest(ua, touch, search, stores){
    var m = /[?&]ref=([^&#]*)/.exec(search || '');
    var ref = m ? decodeURIComponent(m[1]) : '';
    if(!/^[a-zA-Z0-9_-]{3,64}$/.test(ref)) ref = '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && touch > 1);
    var isHuawei = /HUAWEI|HONOR|HarmonyOS|HMSCore|HuaweiBrowser/i.test(ua);
    var key = isIOS ? 'ios' : (isHuawei ? 'huawei' : (/Android/i.test(ua) ? 'android' : (/Windows NT/i.test(ua) ? 'windows' : '')));
    if(key && stores && stores[key]) return stores[key];
    return '/?' + (ref ? 'ref=' + ref + '&' : '') + 'install=1';
  }

  var dest = '/';
  try { dest = goDest(navigator.userAgent || '', navigator.maxTouchPoints || 0, location.search, STORES); }
  catch(e){ dest = '/'; /* guard-ok — أيّ خطأ في الكشف يفتح التطبيق نفسه */ }
  location.replace(dest);
})();
</script>
</body>
</html>
