<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<!-- v-ref-stores (المالك ٢١ نوفمبر بلقطة بوستره: «هذا الرابط سو اياها اي واحد يضغط على الصور يحوله الي المتاجر»): ‎/?ref=omran‎
     يُحوَّل هنا (vercel.json redirects)، فمعاينة الرابط في واتساب وغيره بوستر المالك نفسه — والزاحف لا يشغّل السكربت فيقرأ هذه الوسوم.
     بلا og:url: كلّ رابط يبقى بدعوته (‎/app?ref=اسمه‎ لكلّ مستخدم). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="om ai">
<meta property="og:title" content="om ai — كل أدوات الذكاء الاصطناعي في مكان واحد">
<meta property="og:description" content="وفّر وقتك واشتراكاتك.. واحد يغنيك عن الكل! حمّل التطبيق الآن.">
<meta property="og:image" content="https://omran-ai-builder.vercel.app/icons/om-ai-poster.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1424">
<meta property="og:image:height" content="752">
<meta property="og:image:alt" content="om ai — أدوات الذكاء الاصطناعي في تطبيق واحد">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://omran-ai-builder.vercel.app/icons/om-ai-poster.jpg">
<link rel="icon" type="image/png" href="/icons/favicon-32-v2.png?icon=black-20261022">

<noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
<!-- v-qr-one: الباركود الواحد. /app و/download و/install كلّها هنا: لا صفحة متاجر — كلّ جهاز يذهب مباشرة إلى تطبيقه.
     المالك (١١ أكتوبر): «سوّ لي باركود واحد لكلّ التطبيقات، مش نفس هذا» عن صفحة المتاجر الخمس، و«هذا مكانه» عن «حسابي».
     الباركود يُرسم في «حسابي» برابط /app?ref=اسمه؛ والباركود القديم (/download) يصل هنا أيضًا. -->
<style>
html, body { margin: 0; height: 100%; background: #090a0d; }
body { display: flex; align-items: center; justify-content: center; }
.goMark { width: 84px; height: 84px; border-radius: 24px; border: 1.5px solid #d4af37; box-shadow: 0 0 36px rgba(212,175,55,.25); overflow: hidden; animation: goPulse 1.2s ease-in-out infinite alternate; }
.goMark img { width: 100%; height: 100%; display: block; object-fit: cover; }
@keyframes goPulse { from { opacity: .55; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
/* v-app-intro: تعريف قصير لجوّال بلا متجر منشور قبل أن يدخل التطبيق. مخفيّ حتى يقرّر السكربت، فبقيّة الأجهزة لا تراه. */
html.introOn, html.introOn body { height: auto; min-height: 100%; }
html.introOn body { display: block; color: #f4f1e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
html.introOn .goMark { display: none; }
.intro { box-sizing: border-box; max-width: 480px; margin: 0 auto; padding: 28px 20px calc(104px + env(safe-area-inset-bottom, 0px)); text-align: center; }
.intro[hidden] { display: none; }
.introLogo { width: 64px; height: 64px; border-radius: 18px; border: 1.5px solid #d4af37; box-shadow: 0 0 30px rgba(212,175,55,.22); display: block; margin: 0 auto 8px; object-fit: cover; }
.introName { font-size: 15px; letter-spacing: .5px; color: #d4af37; margin: 0 0 18px; font-weight: 700; }
.intro h1 { font-size: 26px; line-height: 1.45; margin: 0 0 10px; font-weight: 800; text-wrap: balance; }
.introSub { font-size: 16px; line-height: 1.7; color: #b9b3a3; margin: 0 0 22px; text-wrap: balance; }
.introTry { font-size: 14px; color: #d4af37; margin: 0 0 10px; font-weight: 700; }
.introList { list-style: none; margin: 0 0 24px; padding: 0; }
.introList li { border: 1px solid rgba(212,175,55,.35); background: rgba(212,175,55,.06); border-radius: 14px; padding: 13px 14px; margin: 0 0 9px; font-size: 16px; line-height: 1.5; }
.introShot { display: block; width: 100%; height: auto; border-radius: 18px; border: 1px solid rgba(212,175,55,.3); }
.introBar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgba(9,10,13,0), #090a0d 38%); }
.introGo { display: block; max-width: 440px; margin: 0 auto; padding: 16px 20px; border-radius: 999px; background: linear-gradient(180deg, #f5df88, #d4af37); color: #1c1304; font-size: 19px; font-weight: 800; text-align: center; text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,.55); }
.introGo:focus-visible { outline: 3px solid #f5df88; outline-offset: 3px; }
</style>
</head>
<body>
<div class="goMark"><img src="/icons/ai-hub-mark-256.png" alt="om ai"></div>
<main class="intro" id="intro" hidden>
  <img class="introLogo" src="/icons/ai-hub-mark-256.png" alt="" width="64" height="64">
  <p class="introName">om ai</p>
  <h1 id="introTitle">اكتب جملة وحدة… وom ai يسوّي الباقي</h1>
  <p class="introSub" id="introSub">ذكاء اصطناعي بالعربي — كل الأدوات في تطبيق واحد.</p>
  <p class="introTry" id="introTry">جرّب تكتب:</p>
  <ul class="introList">
    <li id="introEx1">«سوّ لي موقع لمطعمي»</li>
    <li id="introEx2">«سوّ لي دعاية فيديو لمنتجي»</li>
    <li id="introEx3">«حوّل صورتي لنمط كرتوني»</li>
  </ul>
  <img class="introShot" id="introShot" src="/assets/screenshots/narrow-tools-1.webp" alt="من داخل التطبيق" width="540" height="960" loading="lazy">
  <div class="introBar"><a class="introGo" id="introGo" href="/?install=1">جرّب الآن</a></div>
</main>
<script>
(function(){
  'use strict';
  // رابط متجر كلّ منصّة حين يُنشر التطبيق فيه — يُملأ هنا وحده، والباركود المطبوع لا يتغيّر.
  // فارغ = لا متجر منشور بعد، فيفتح الجهاز التطبيق نفسه وزرّ «تثبيت التطبيق» (?install=1، app-10-features).
  // v-hw-store-link (٦ نوفمبر ٢٠٢٦): هواوي وافقت على 1.3.15 ونشرته — جوّال هواوي أو هونر يذهب إلى صفحته في AppGallery.
  // v-qr-all-stores (٧ نوفمبر): المالك «كلهم اريدهم في باركود واحد» — آيفون إلى App Store (om ai app 2.0.1)، وويندوز إلى Microsoft Store.
  // روابط بالمعرّف وحده بلا الاسم القديم (رابط آبل في الإيميل كان /app/omran-ai-builder/…). أندرويد فارغ: Google Play ما زال اختبارًا مغلقًا.
  var STORES = { ios: 'https://apps.apple.com/app/id6795795451', android: '', huawei: 'https://appgallery.huawei.com/app/C118703501', windows: 'https://apps.microsoft.com/detail/9NZLQM4G1X3D' };

  function goDest(ua, touch, search, stores){
    var m = /[?&]ref=([^&#]*)/.exec(search || '');
    var ref = m ? decodeURIComponent(m[1]) : '';
    if(!/^[a-zA-Z0-9_-]{3,64}$/.test(ref)) ref = '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && touch > 1);
    var isHuawei = /HUAWEI|HONOR|HarmonyOS|HMSCore|HuaweiBrowser/i.test(ua);
    var key = isIOS ? 'ios' : (isHuawei ? 'huawei' : (/Android/i.test(ua) ? 'android' : (/Windows NT/i.test(ua) ? 'windows' : '')));
    if(key && stores && stores[key]) return stores[key];
    return '/?' + (ref ? 'ref=' + ref + '&' : '') + 'install=1';
  }

  // v-app-intro (٢١ نوفمبر ٢٠٢٦): جوّال بلا متجر منشور (أندرويد اليوم) كان يُرمى داخل التطبيق على نافذة الموافقة مباشرة،
  // فزائر تيك توك وإنستغرام لا يعرف ما الذي فتحه. يرى الآن تعريفًا قصيرًا وزرًّا واحدًا يحمل الوجهة نفسها.
  // لا يظهر لمن له متجر (وجهته خارجيّة)، ولا داخل التطبيق المثبّت، ولا لمن وافق على الخصوصيّة سابقًا (زائر عائد).
  // حين يُملأ STORES.android يختفي التعريف وحده.
  function wantsIntro(ua, dest, standalone, returning){
    if(standalone || returning) return false;
    return /Android|iPhone|iPod/i.test(ua) && dest.charAt(0) === '/';
  }

  var INTRO_EN = {
    introTitle: 'Write one sentence… om ai does the rest',
    introSub: 'AI chat and tools together in one app.',
    introTry: 'Try writing:',
    introEx1: '“Build a website for my restaurant”',
    introEx2: '“Make a video ad for my product”',
    introEx3: '“Turn my photo into a cartoon style”',
    introGo: 'Try it now'
  };

  function showIntro(to){
    var el = function(id){ return document.getElementById(id); };
    if(!/^ar\b/i.test(navigator.language || 'ar')){
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      for(var k in INTRO_EN) el(k).textContent = INTRO_EN[k];
      el('introShot').setAttribute('alt', 'Inside the app');
    }
    el('introGo').setAttribute('href', to);
    el('intro').hidden = false;
    document.documentElement.className += ' introOn';
  }

  // v-ref-stores (مراجعة النقض): داخل تطبيقنا المثبّت لا متجر — جسر هواوي OmranRender (فلتر autoVerify يفتح روابط الموقع فيه) أو
  // تطبيق الويب المثبّت. كان رابط المالك يرمي من عنده التطبيق إلى صفحته في AppGallery ويترك الشاشة على الشعار النابض.
  var inApp = false;
  try { inApp = !!window.OmranRender || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  catch(e){ inApp = false; /* guard-ok — تعذّر الكشف = متصفّح عاديّ */ }
  var dest = '/';
  try { dest = goDest(navigator.userAgent || '', navigator.maxTouchPoints || 0, location.search, inApp ? null : STORES); }
  catch(e){ dest = '/'; /* guard-ok — أيّ خطأ في الكشف يفتح التطبيق نفسه */ }
  var intro = false;
  try {
    var returning = localStorage.getItem('aiapp_privacy_ack') === '1';
    intro = wantsIntro(navigator.userAgent || '', dest, inApp, returning);
    if(intro) showIntro(dest);
  } catch(e){ intro = false; /* guard-ok — تعذّر التعريف (تخزين محجوب مثلًا) لا يحبس الزائر: يكمل إلى وجهته */ }
  if(!intro) location.replace(dest);
})();
</script>
</body>
</html>
